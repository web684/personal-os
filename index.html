<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<!-- PWA: iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Juny">
<link rel="apple-touch-icon" href="icon-192.png">
<!-- PWA: Android / Chrome -->
<meta name="theme-color" content="#2a8c61">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>Juny</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #f3f4f6;
  --card-bg: #ffffff;
  --text: #1d1d1f;
  --text-secondary: #6e6e73;
  --text-tertiary: #aeaeb2;
  --border: #ececf0;
  --accent: #2a8c61;
  --accent-light: #3a9c70;
  --blue: #0071e3;
  --green: #34c759;
  --orange: #ff9500;
  --red: #ff3b30;
  --purple: #af52de;
  --teal: #5ac8fa;
  --lotus: #2e9e6b;
  --lotus-deep: #1f7a54;
  --sidebar-width: 220px;
  --stats-height: 100px;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.04);
  --shadow: 0 2px 8px rgba(0,0,0,.06);
  --shadow-lg: 0 8px 30px rgba(0,0,0,.08);
  --font: -apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',system-ui,sans-serif;
  --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.6;
  background-image:radial-gradient(rgba(0,0,0,.025) 1px,transparent 1px);
  background-size:22px 22px;}
button{-webkit-tap-highlight-color:transparent;font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit}
input,textarea,select{font-family:inherit;font-size:inherit}
.app-container{display:flex;min-height:100vh;min-height:100dvh}

/* Sidebar */
.sidebar{
  width:var(--sidebar-width);min-width:var(--sidebar-width);
  background:var(--card-bg);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:fixed;top:0;left:0;
  height:100vh;height:100dvh;z-index:200;
  transition:left var(--transition);
  padding:0;
  box-shadow:2px 0 20px rgba(0,0,0,.06);
}
.sidebar.closed{left:calc(-1 * var(--sidebar-width))}
.sidebar-header{
  padding:20px 18px 16px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
}
.app-logo{
  width:36px;height:36px;border-radius:10px;
  background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:16px;letter-spacing:-0.5px;
}
.app-logo span{font-weight:400;opacity:.7}
.sidebar-header h2{font-size:15px;font-weight:600;letter-spacing:-0.3px;color:var(--text)}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.sidebar-nav::-webkit-scrollbar{width:0}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 14px;border-radius:var(--radius-sm);
  font-size:14px;font-weight:500;color:var(--text-secondary);
  transition:all var(--transition);position:relative;
  white-space:nowrap;
}
.nav-item:hover{background:rgba(0,0,0,.03);color:var(--text)}
.nav-item.active{background:var(--accent);color:#fff}
.nav-item .nav-icon{font-size:17px;width:22px;text-align:center;flex-shrink:0}
.nav-item .nav-name{flex:1}
.nav-item .nav-remove{
  width:20px;height:20px;border-radius:50%;display:none;
  align-items:center;justify-content:center;
  font-size:12px;color:inherit;opacity:.6;flex-shrink:0;
}
.nav-item:hover .nav-remove{display:flex}
.nav-item.active .nav-remove:hover{opacity:1}
.sidebar-add{padding:10px 14px;border-top:1px solid var(--border)}
.sidebar-add button{
  width:100%;padding:10px;border-radius:var(--radius-sm);
  border:1.5px dashed var(--border);color:var(--text-tertiary);
  font-size:13px;font-weight:500;
  transition:all var(--transition);
}
.sidebar-add button:hover{border-color:var(--accent);color:var(--accent)}
.sidebar-add-row{display:flex;gap:6px;margin-top:6px}
.sidebar-add-row input{
  flex:1;padding:8px 10px;border:1.5px solid var(--border);
  border-radius:8px;font-size:13px;outline:none;
}
.sidebar-add-row input:focus{border-color:var(--blue)}
.sidebar-add-row .btn-confirm,.sidebar-add-row .btn-cancel{
  padding:8px 12px;border-radius:8px;font-size:13px;font-weight:500;
}
.sidebar-add-row .btn-confirm{background:var(--accent);color:#fff}
.sidebar-add-row .btn-cancel{color:var(--text-secondary)}

/* Main Content */
.main-content{
  flex:1;margin-left:0;
  padding:0;min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
}

/* Sidebar Toggle Button (always visible) */
.sidebar-toggle-btn{
  position:fixed;top:14px;left:14px;z-index:210;
  width:44px;height:44px;border-radius:50%;
  background:var(--card-bg);box-shadow:var(--shadow);
  align-items:center;justify-content:center;
  font-size:20px;color:var(--text);display:flex;
  transition:all var(--transition);cursor:pointer;
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.sidebar-toggle-btn:active{background:var(--bg);transform:scale(.92)}
.sidebar-toggle-btn.shifted{left:calc(var(--sidebar-width) + 14px)}

/* Sidebar Overlay */
.sidebar-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.35);
  z-index:190;opacity:0;pointer-events:none;
  transition:opacity var(--transition);
}
.sidebar-overlay.show{opacity:1;pointer-events:auto}

/* Bottom Tab Bar (always visible) */
.bottom-nav{
  display:block;
  position:fixed;left:0;right:0;bottom:0;z-index:180;
  background:var(--card-bg);
  border-top:1px solid var(--border);
  box-shadow:0 -2px 12px rgba(0,0,0,.05);
  overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  scrollbar-width:none;
}
.bottom-nav::-webkit-scrollbar{display:none}
.bottom-nav-inner{display:inline-flex;gap:4px;min-width:100%;align-items:center}
.bottom-nav .nav-item{
  flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:8px 12px;border-radius:10px;
  font-size:11px;font-weight:600;color:var(--text-tertiary);
  min-width:64px;max-width:96px;
  transition:all var(--transition);
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  position:relative;
}
.bottom-nav .nav-item .nav-icon{font-size:20px;line-height:1}
.bottom-nav .nav-item .nav-name{
  font-size:10.5px;line-height:1.1;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.bottom-nav .nav-item.active{background:var(--accent);color:#fff}
.bottom-nav .nav-item:active{background:rgba(0,0,0,.06)}
.bottom-nav .nav-item.active:active{background:var(--accent)}
.bottom-nav .nav-add{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  width:38px;height:38px;border-radius:50%;
  background:var(--bg);color:var(--text-secondary);
  font-size:22px;font-weight:300;
  margin-left:6px;
  cursor:pointer;border:1.5px dashed var(--border);
  -webkit-tap-highlight-color:transparent;
}
.bottom-nav .nav-add:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(min-width:769px){
  .bottom-nav .nav-item{padding:10px 16px;font-size:12px;min-width:76px}
  .bottom-nav .nav-item .nav-icon{font-size:22px}
  .bottom-nav .nav-item .nav-name{font-size:11.5px}
}

/* Content Area */
.content-area{flex:1;padding:0 24px calc(80px + env(safe-area-inset-bottom) + 20px);overflow-y:auto}
.section-title{font-size:20px;font-weight:700;letter-spacing:-0.5px;margin-bottom:16px;color:var(--text);display:flex;align-items:center;gap:10px}
.sec-prog{display:flex;align-items:center;gap:6px;margin-left:auto;flex-shrink:0}
.sec-prog-bar{width:80px;height:6px;border-radius:3px;background:rgba(0,0,0,.07);overflow:hidden}
.sec-prog-fill{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .35s ease}
.sec-prog-count{font-size:12px;color:var(--text-tertiary);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.section-subtitle{font-size:13px;color:var(--text-secondary);margin-bottom:16px;margin-top:-10px}

/* Content Card */
.content-card{
  background:var(--card-bg);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow-sm);margin-bottom:14px;
}
.content-card h3{
  font-size:15px;font-weight:600;margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}
.content-card h3 .card-icon{font-size:18px}

/* Todo / Task Items */
.task-list{display:flex;flex-direction:column;gap:8px}
.task-item{
  display:flex;flex-direction:column;gap:8px;
  padding:12px 14px;border-radius:var(--radius-sm);
  border:1px solid var(--border);transition:all var(--transition);
}
.task-item:hover{border-color:var(--text-tertiary)}
.task-item.done .task-title{text-decoration:line-through;color:var(--text-tertiary)}
.task-header{display:flex;align-items:center;gap:10px}
.task-checkbox{
  width:20px;height:20px;border-radius:50%;border:2px solid var(--text-tertiary);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:all var(--transition);font-size:11px;color:transparent;
}
.task-checkbox.checked{background:var(--green);border-color:var(--green);color:#fff}
.learn-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--text-tertiary);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:transparent;cursor:pointer;transition:all var(--transition);user-select:none}
.learn-check.checked{background:var(--accent);border-color:var(--accent);color:#fff}
.python-plan-item .learn-check{margin-left:auto;margin-top:2px}
.learn-card-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.task-title{flex:1;font-size:14px;line-height:1.5}
.task-review{
  font-size:13px;color:var(--text-secondary);padding:8px 10px;
  background:var(--bg);border-radius:8px;border:none;width:100%;
  outline:none;resize:none;min-height:36px;margin-top:4px;
}
.task-review:focus{background:#fff;box-shadow:inset 0 0 0 1px var(--blue)}
.task-review::placeholder{color:var(--text-tertiary)}
.task-actions{display:flex;gap:8px;align-self:flex-end}
.task-btn{
  font-size:12px;color:var(--text-secondary);padding:4px 10px;
  border-radius:6px;transition:all var(--transition);
}
.task-btn:hover{background:var(--bg);color:var(--text)}
.task-btn.danger:hover{color:var(--red)}
.add-task-row{
  display:flex;gap:8px;margin-top:8px;
}
.add-task-row input{
  flex:1;padding:10px 14px;border:1.5px dashed var(--border);
  border-radius:var(--radius-sm);font-size:14px;outline:none;
  transition:all var(--transition);
}
.add-task-row input:focus{border-color:var(--blue);border-style:solid}
.add-task-row button{
  padding:10px 16px;background:var(--accent);color:#fff;
  border-radius:var(--radius-sm);font-size:13px;font-weight:500;
}

/* Life Section */
.health-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.health-input-card{
  background:var(--card-bg);border-radius:var(--radius-sm);
  padding:14px;box-shadow:var(--shadow-sm);
}
.health-input-card label{
  font-size:12px;color:var(--text-secondary);font-weight:500;
  display:block;margin-bottom:6px;
}
.health-input-card input,.health-input-card select{
  width:100%;padding:8px 10px;border:1px solid var(--border);
  border-radius:8px;font-size:14px;outline:none;
}
.health-input-card input:focus{border-color:var(--blue)}
.chart-tabs{display:flex;gap:6px;margin-bottom:12px}
.chart-tab{
  padding:6px 16px;border-radius:20px;font-size:12px;font-weight:500;
  color:var(--text-secondary);background:var(--bg);
  transition:all var(--transition);
}
.chart-tab.active{background:var(--accent);color:#fff}
.chart-wrap{background:var(--card-bg);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);margin-bottom:14px}
.chart-wrap canvas{max-height:260px}
@media(max-width:560px){.chart-wrap canvas{max-height:200px}}

/* Tips Cards */
.tips-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tip-card{
  background:var(--card-bg);border-radius:var(--radius-sm);
  padding:16px;box-shadow:var(--shadow-sm);
  border-left:3px solid var(--purple);
}
.tip-card h4{font-size:13px;font-weight:600;margin-bottom:6px;color:var(--accent)}
.tip-card p{font-size:12px;color:var(--text-secondary);line-height:1.6}
.tip-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.tip-head h4{flex:1}
.fav-btn{flex-shrink:0;background:none;border:none;font-size:16px;cursor:pointer;color:var(--text-tertiary);padding:0;line-height:1;transition:transform .15s}
.fav-btn:hover{transform:scale(1.2)}
.fav-btn.on{color:#f5a623}
.fav-inline{font-size:13px;padding:3px 8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);cursor:pointer;color:var(--text-tertiary);white-space:nowrap}
.fav-inline:hover{border-color:#f5a623;color:#f5a623}
.fav-inline.on{background:#fff8e8;border-color:#f5a623;color:#f5a623}
.fav-card{background:linear-gradient(135deg,#fffdf5,#fff9ea);border:1px solid #f0d860;border-radius:var(--radius);padding:18px;margin-top:16px}
.fav-card h3{font-size:15px;font-weight:800;color:#b8860b;margin-bottom:12px}
.fav-empty{text-align:center;color:var(--text-tertiary);font-size:13px;padding:16px 0}
.fav-group{margin-bottom:12px}
.fav-group-title{font-size:12px;font-weight:700;color:#b8860b;margin-bottom:6px}
.fav-item{display:flex;align-items:flex-start;gap:8px;background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:6px;box-shadow:var(--shadow-sm)}
.fav-item-body{flex:1;min-width:0}
.fav-item-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
.fav-item-text{font-size:12px;color:var(--text-secondary);line-height:1.5;max-height:60px;overflow:hidden;position:relative}
.fav-item-text::after{content:'';position:absolute;bottom:0;left:0;right:0;height:16px;background:linear-gradient(transparent,#fff)}
.fav-item-del{flex-shrink:0;background:none;border:none;font-size:16px;color:var(--text-tertiary);cursor:pointer;padding:0 4px}
.fav-item-del:hover{color:#e74c3c}

/* 姨妈周期追踪 */
.period-tracker{margin-top:4px}
.period-add-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.period-date-input{padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:#fff}
.period-note-input{flex:1;min-width:100px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:#fff}
.period-add-btn{padding:7px 16px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.period-table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border)}
.period-table{width:100%;border-collapse:collapse;font-size:12px}
.period-table th{background:var(--bg-alt);padding:8px 10px;text-align:left;font-weight:600;color:var(--text-secondary);white-space:nowrap}
.period-table td{padding:7px 10px;border-top:1px solid var(--border)}
.mini-del-btn{background:none;border:none;color:var(--text-tertiary);cursor:pointer;font-size:14px;padding:0 4px}
.mini-del-btn:hover{color:#e74c3c}
.phase-info{margin-top:14px}
.phase-empty{text-align:center;color:var(--text-tertiary);font-size:12px;padding:14px 8px;line-height:1.8;background:var(--bg-alt);border-radius:10px}
.phase-current{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:2px solid;flex-wrap:wrap}
.phase-current-icon{font-size:28px}
.phase-current-text{flex:1;min-width:120px}
.phase-current-name{font-size:15px;font-weight:700;color:var(--text)}
.phase-current-desc{font-size:12px;color:var(--text-secondary);margin-top:2px;line-height:1.5}
.phase-bars{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.phase-bar{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);min-width:56px;opacity:.5;transition:opacity .2s}
.phase-bar.current{opacity:1;background:#fff;box-shadow:var(--shadow-sm)}
.phase-bar-icon{font-size:18px}
.phase-bar-name{font-size:11px;font-weight:600;color:var(--text)}
.phase-bar-days{font-size:10px;color:var(--text-tertiary)}
.phase-next{margin-top:8px;font-size:12px;color:var(--text-secondary);text-align:center}
.phase-tip-group{margin-bottom:14px}
.phase-tip-group-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px}

/* Mood */
.mood-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.mood-chip{
  font-size:13px;padding:8px 14px;border-radius:18px;cursor:pointer;
  border:1px solid var(--border);background:var(--bg);color:var(--text-secondary);
  font-family:inherit;transition:all .15s;
}
.mood-chip:hover{border-color:var(--accent)}
.mood-chip.active{background:rgba(175,82,222,.12);border-color:var(--accent);color:var(--accent);font-weight:600}
.mood-song-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mood-input,.mood-textarea{
  width:100%;padding:9px 12px;border:1px solid var(--border);
  border-radius:var(--radius-sm);font-size:13px;background:var(--bg);
  color:var(--text-primary);font-family:inherit;box-sizing:border-box;
}
.mood-input:focus,.mood-textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(175,82,222,.12)}
.mood-textarea{resize:vertical;min-height:70px;line-height:1.5;margin-top:12px}
.mood-display{display:flex;align-items:center;gap:12px;margin-top:6px}
.mood-emoji{font-size:42px;line-height:1}
.mood-label{font-size:20px;font-weight:700;color:var(--text-primary)}
.mood-song{font-size:13px;color:var(--text-secondary);margin-top:10px}
.mood-note{font-size:13px;color:var(--text-secondary);line-height:1.7;margin-top:10px;white-space:pre-wrap}
.mood-edit-box{margin-top:12px;padding-top:12px;border-top:1px dashed #ecd6e3;}
@media(max-width:768px){ .mood-song-row{grid-template-columns:1fr} }

/* Mental Health science card */
.mh-fact{display:flex;gap:14px;align-items:flex-start;background:#fff;border-radius:12px;padding:14px;margin-top:4px;border-top:3px solid #5ac8fa}
.mh-emoji{font-size:34px;line-height:1;flex-shrink:0;width:42px;text-align:center}
.mh-main{flex:1;min-width:0}
.mh-title{font-size:15px;font-weight:700;color:var(--text-primary);margin-bottom:6px;letter-spacing:-0.2px}
.mh-body{font-size:13px;line-height:1.75;color:var(--text-secondary)}
.mh-action{margin-top:12px;background:rgba(90,200,250,.12);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.7;color:var(--text-secondary)}
.mh-action-label{display:block;font-weight:700;color:#1aa3c8;margin-bottom:3px;font-size:12px}

/* Tree Hole board */
.treehole-box{margin-top:6px;background:#fff;border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.85;color:var(--text-primary);white-space:pre-wrap;border:1px solid rgba(124,92,255,.18);box-shadow:0 1px 3px rgba(124,92,255,.06)}
.th-hist{margin-top:14px;border-top:1px dashed rgba(124,92,255,.25);padding-top:10px}
.th-hist>summary{cursor:pointer;font-size:13px;font-weight:600;color:#7c5cff;list-style:none;user-select:none}
.th-hist>summary::-webkit-details-marker{display:none}
.th-hist>summary::before{content:'▸ ';font-size:11px}
.th-hist[open]>summary::before{content:'▾ '}
.th-hist-item{margin-top:10px;padding:10px 12px;background:#fff;border-radius:10px;border:1px solid rgba(124,92,255,.15)}
.th-hist-date{font-size:11px;color:var(--text-tertiary);margin-bottom:4px}
.th-hist-content{font-size:13px;line-height:1.75;color:var(--text-primary);white-space:pre-wrap}

/* shared mini edit button */
.mini-edit-btn{
  float:right;font-size:11px;font-weight:500;color:var(--accent);
  background:rgba(175,82,222,.08);border:1px solid rgba(175,82,222,.2);
  border-radius:14px;padding:3px 10px;cursor:pointer;margin-top:2px;
}
.mini-edit-btn:hover{background:rgba(175,82,222,.16)}

/* Emotion Section */
.emotion-input-row{
  display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px;
}
.emotion-slider{flex:1;min-width:200px}
.emotion-slider label{font-size:12px;color:var(--text-secondary);display:block;margin-bottom:6px}
.emotion-slider input[type=range]{
  width:100%;-webkit-appearance:none;height:6px;border-radius:3px;
  background:linear-gradient(to right,var(--red),var(--orange),var(--teal),var(--green));
  outline:none;
}
.emotion-slider input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:28px;height:28px;border-radius:50%;
  background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer;
}
.emotion-value{
  font-size:28px;font-weight:700;min-width:40px;text-align:center;
}
.emotion-note{flex:1;min-width:200px}
.emotion-note label{font-size:12px;color:var(--text-secondary);display:block;margin-bottom:6px}
.emotion-note input{
  width:100%;padding:10px 14px;border:1px solid var(--border);
  border-radius:8px;font-size:14px;outline:none;
}
.emotion-note input:focus{border-color:var(--blue)}
.emotion-btn{
  padding:10px 20px;background:var(--accent);color:#fff;
  border-radius:var(--radius-sm);font-size:14px;font-weight:500;
  white-space:nowrap;
}
.md-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px;}
.md-label{font-size:14px;font-weight:500;color:var(--text-primary);}
.md-status{font-size:12.5px;color:var(--text-secondary);margin-top:10px;line-height:1.5;}

/* Hotspots Section */
.news-category{margin-bottom:20px}
.news-category h3{
  font-size:15px;font-weight:600;margin-bottom:10px;
  display:flex;align-items:center;gap:8px;
}
.news-item{
  background:var(--card-bg);border-radius:var(--radius-sm);
  padding:14px 16px;margin-bottom:8px;box-shadow:var(--shadow-sm);
}
.news-item h4{font-size:14px;font-weight:600;margin-bottom:4px;line-height:1.4}
.news-item .news-meta{font-size:11px;color:var(--text-tertiary);margin-bottom:6px}
.news-item .news-analysis{font-size:13px;color:var(--text-secondary);line-height:1.6}
.add-news-row{display:flex;gap:8px;margin-top:8px}
.add-news-row input,.add-news-row textarea{
  flex:1;padding:8px 10px;border:1.5px dashed var(--border);
  border-radius:8px;font-size:13px;outline:none;
}
.add-news-row input:focus,.add-news-row textarea:focus{border-color:var(--blue);border-style:solid}
.add-news-row select{
  padding:8px 10px;border:1px solid var(--border);border-radius:8px;
  font-size:13px;background:#fff;outline:none;
}
.cat-desc{font-size:11px;font-weight:400;color:var(--text-tertiary);margin-left:8px}
.cat-count{font-size:12px;color:var(--text-tertiary);float:right;margin-top:-20px}
.news-region-label{margin:6px 0 4px}
.region-tag{
  display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:600;
}
.region-tag.region-cn{background:#e8f4fd;color:#1a6fb5}
.region-tag.region-intl{background:#fef3e2;color:#b87514}
.btn-add-news{
  padding:8px 16px;background:var(--accent);color:#fff;border-radius:8px;font-size:13px;
  white-space:nowrap;
}
.news-textarea{
  width:100%;margin-top:6px;padding:8px;border:1px solid var(--border);
  border-radius:8px;font-size:13px;min-height:50px;resize:vertical;
}

/* --- News Feed & Papers --- */
.news-date-group{margin-bottom:16px}
.news-date-header{
  font-size:13px;font-weight:600;color:var(--accent);
  padding:6px 0;border-bottom:1px solid var(--border);margin-bottom:8px;
}
.news-source-label{
  font-size:11px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;
  letter-spacing:.5px;margin:6px 0 4px;
}
.news-item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.news-item-top h4{flex:1;margin-bottom:2px}
.news-item-top h4 a{color:var(--text);text-decoration:none;border-bottom:1px solid transparent;transition:border-color var(--transition)}
.news-item-top h4 a:hover{border-bottom-color:var(--blue);color:var(--blue)}
.add-panel{
  background:var(--bg);border-radius:var(--radius-sm);padding:12px 14px;margin-top:8px;
}
.add-panel h4{font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text-secondary)}
.add-panel select{
  padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:#fff;
}
.paper-item{border-left:3px solid var(--blue);padding-left:12px}
.paper-meta{font-size:11px;color:var(--text-tertiary);margin-bottom:4px}

/* --- News Toolbar & Daily Report --- */
.news-toolbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:0 0 16px;flex-wrap:wrap;
}
.news-toolbar-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.news-view-toggle{
  display:flex;border-radius:8px;overflow:hidden;border:1px solid var(--border);
}
.news-view-btn{
  padding:7px 14px;font-size:12px;font-weight:500;color:var(--text-secondary);
  background:var(--card-bg);transition:all var(--transition);white-space:nowrap;
}
.news-view-btn.active{background:var(--accent);color:#fff}
.news-view-btn:not(.active):hover{background:var(--bg)}
.news-refresh-btn{
  padding:7px 14px;font-size:12px;font-weight:500;border-radius:8px;
  background:var(--blue);color:#fff;transition:all var(--transition);white-space:nowrap;
}
.news-refresh-btn:hover{opacity:.85}
.news-refresh-btn:active{transform:scale(.96)}
.update-status{
  font-size:11px;color:var(--text-tertiary);display:flex;align-items:center;gap:4px;
}
.update-status .dot{
  width:6px;height:6px;border-radius:50%;background:var(--green);
  display:inline-block;
}
.update-status .dot.old{background:var(--orange)}
.update-status .dot.auto{background:var(--blue)}
.news-toolbar-right{
  display:flex;align-items:center;gap:8px;
}
/* Daily Report View */
.daily-report{border-top:1px solid var(--border);padding-top:16px}
.daily-report-header{
  text-align:center;padding:20px 0;border-bottom:2px solid var(--accent);margin-bottom:20px;
}
.daily-report-header h2{font-size:22px;font-weight:700;letter-spacing:1px;color:var(--accent)}
.daily-report-header .report-date{font-size:13px;color:var(--text-tertiary);margin-top:4px}
.daily-report-header .report-subtitle{font-size:12px;color:var(--text-tertiary);margin-top:2px}
.daily-report-article{
  background:var(--card-bg);border-radius:var(--radius);padding:18px 20px;
  margin-bottom:12px;box-shadow:var(--shadow-sm);
  border-left:4px solid var(--accent);
}
.daily-report-article .article-cat{
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;
  color:var(--text-tertiary);margin-bottom:4px;
  display:flex;align-items:center;gap:6px;
}
.daily-report-article h3{
  font-size:16px;font-weight:700;line-height:1.5;margin-bottom:6px;color:var(--text);
}
.daily-report-article .article-source{
  font-size:11px;color:var(--text-tertiary);margin-bottom:10px;
}
.daily-report-article .article-source a{color:var(--blue);text-decoration:none}
.daily-report-article .article-body{
  font-size:14px;line-height:1.8;color:var(--text-secondary);
  white-space:pre-wrap;
}
.daily-cat-block{margin-bottom:6px}
.daily-cat-title{
  font-size:17px;font-weight:700;color:var(--text);
  margin:20px 0 10px;padding-left:12px;border-left:4px solid var(--accent);
}
.daily-cat-block .news-region-label{margin:10px 0 6px}
.daily-report .no-report{
  text-align:center;padding:50px 20px;color:var(--text-tertiary);
}
.daily-report .no-report .empty-icon{font-size:48px;margin-bottom:12px}
/* Full text expand in list view */
.news-fulltext-toggle{
  font-size:11px;color:var(--blue);cursor:pointer;margin-top:6px;
  display:inline-block;font-weight:500;
}
.news-fulltext-toggle:hover{text-decoration:underline}
.news-fulltext-body{
  font-size:13px;line-height:1.7;color:var(--text-secondary);
  margin-top:8px;padding:10px 12px;background:var(--bg);
  border-radius:8px;display:none;white-space:pre-wrap;
  max-height:300px;overflow-y:auto;
}
.news-fulltext-body.show{display:block}

/* Auto-badge */
.auto-badge{
  display:inline-flex;align-items:center;gap:3px;padding:2px 8px;
  border-radius:10px;font-size:10px;font-weight:600;
}
.auto-badge.news-badge{background:#e8f4fd;color:#1a6fb5}
.auto-badge.paper-badge{background:#f0e6f6;color:#7b2d8e}

/* Review Section */
.review-block{margin-bottom:16px}
.review-block h3{
  font-size:15px;font-weight:600;margin-bottom:10px;
  display:flex;align-items:center;gap:8px;
}
.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.review-box{
  background:var(--card-bg);border-radius:var(--radius-sm);
  padding:14px;box-shadow:var(--shadow-sm);
}
.review-box.good{border-left:3px solid var(--green)}
.review-box.improve{border-left:3px solid var(--orange)}
.review-box h4{font-size:13px;font-weight:600;margin-bottom:8px}
.review-box textarea{
  width:100%;min-height:70px;border:none;outline:none;font-size:13px;
  resize:vertical;color:var(--text);background:transparent;
}
.review-box textarea::placeholder{color:var(--text-tertiary)}

.fab:active{transform:scale(.96)}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.4);
  z-index:300;display:none;align-items:flex-end;
  justify-content:center;
}
.modal-overlay.show{display:flex}
.modal-sheet{
  background:var(--card-bg);width:100%;max-width:500px;
  border-radius:20px 20px 0 0;padding:20px 20px 34px;
  animation:slideUp 0.3s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-sheet h3{font-size:17px;font-weight:600;margin-bottom:14px}
.modal-sheet textarea{
  width:100%;min-height:100px;border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:12px;font-size:14px;
  outline:none;resize:vertical;
}
.modal-sheet textarea:focus{border-color:var(--blue)}
.modal-actions{display:flex;gap:10px;margin-top:14px;justify-content:flex-end}
.modal-actions button{
  padding:10px 22px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;
}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{color:var(--text-secondary)}

/* Book Library */
.lib-card{margin-top:14px}
.lib-badge{font-size:10px;font-weight:500;color:var(--accent);background:rgba(0,113,227,.08);padding:2px 8px;border-radius:10px;vertical-align:middle}
.lib-chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.lib-chip{padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg);font-size:12px;color:var(--text-secondary);cursor:pointer;transition:.2s;white-space:nowrap}
.lib-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.lib-book{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.lib-book-cat{font-size:10px;color:var(--text-tertiary);background:var(--card-bg);align-self:flex-start;padding:1px 8px;border-radius:10px;border:1px solid var(--border)}
.lib-book-title{font-size:13px;font-weight:600;line-height:1.4;color:var(--text)}
.lib-book-author{font-size:11px;color:var(--text-tertiary);margin-bottom:4px}
.lib-book-actions{display:flex;gap:6px;margin-top:auto}
.lib-btn{flex:1;padding:6px 0;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);font-size:11px;cursor:pointer;color:var(--text);transition:.2s}
.lib-btn.read{background:var(--accent);color:#fff;border-color:var(--accent)}
.lib-btn:hover{opacity:.9}
.lib-btn.added{color:var(--green);border-color:var(--green);cursor:default}
.lib-btn:disabled{cursor:default}
/* Library detail modal */
.lib-detail-head{position:relative;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:12px}
.lib-close{position:absolute;top:-8px;right:-8px;width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--card-bg);font-size:18px;line-height:1;cursor:pointer;color:var(--text-secondary)}
.lib-detail-cat{display:inline-block;font-size:10px;color:var(--accent);background:rgba(0,113,227,.08);padding:2px 10px;border-radius:10px;margin-bottom:6px}
.lib-detail-title{font-size:18px;font-weight:700;margin:0 0 4px;color:var(--text)}
.lib-detail-author{font-size:13px;color:var(--text-tertiary)}
.lib-detail-section{margin-bottom:12px}
.lib-detail-section h5{font-size:13px;margin:0 0 4px;color:var(--text)}
.lib-detail-section p{font-size:13px;line-height:1.7;color:var(--text-secondary);margin:0}
.lib-detail-quote{background:var(--bg);border-left:3px solid var(--accent);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13px;line-height:1.7;color:var(--text);font-style:italic;margin-bottom:14px}

/* Empty State */
.empty-state{
  text-align:center;padding:40px 20px;color:var(--text-tertiary);
}
.empty-state .empty-icon{font-size:40px;margin-bottom:10px}
.empty-state p{font-size:14px}

/* Learning Daily Cards */
.learn-daily-grid{display:flex;flex-direction:column;gap:14px;margin-bottom:20px}
.learn-card{
  background:var(--card-bg);border-radius:var(--radius);
  padding:18px 20px;box-shadow:var(--shadow-sm);
  transition:all var(--transition);
}
.learn-card-header{
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
}
.learn-card-header h3{
  font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;
}
.learn-card-header .learn-expand{
  font-size:14px;color:var(--text-tertiary);transition:transform .3s;
}
.learn-card.expanded .learn-expand{transform:rotate(180deg)}
.learn-card-body{
  display:none;padding-top:14px;border-top:1px solid var(--border);margin-top:14px;
}
.learn-card.expanded .learn-card-body{display:block}
.learn-card-meta{
  font-size:11px;color:var(--text-tertiary);margin-top:2px;display:flex;align-items:center;gap:6px;
}
.learn-badge{
  display:inline-flex;align-items:center;gap:3px;padding:2px 10px;border-radius:10px;
  font-size:10px;font-weight:600;
}
.learn-badge.python{background:#e8f4fd;color:#1a6fb5}
.learn-badge.paper{background:#f0e6f6;color:#7b2d8e}
.learn-badge.english{background:#fef3e2;color:#b87514}

/* Python Plan */
.python-plan-list{display:flex;flex-direction:column;gap:10px}
.python-plan-item{
  display:flex;align-items:flex-start;gap:12px;padding:10px 12px;
  background:var(--bg);border-radius:10px;transition:all var(--transition);
}
.python-plan-num{
  width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;flex-shrink:0;
}
.python-plan-info{flex:1}
.python-plan-info .pp-title{font-size:13px;font-weight:600;margin-bottom:2px}
.python-plan-info .pp-desc{font-size:12px;color:var(--text-secondary);line-height:1.5}
.python-plan-duration{
  font-size:12px;color:var(--text-tertiary);white-space:nowrap;
  display:flex;align-items:center;gap:3px;
}
.python-plan-duration::before{content:'⏱'}
.python-code-block{
  background:#1e1e2e;color:#cdd6f4;border-radius:10px;padding:14px 16px;
  font-family:'SF Mono','Cascadia Code','Consolas',monospace;
  font-size:12px;line-height:1.6;overflow-x:auto;margin-top:8px;
  white-space:pre-wrap;word-break:break-all;
}

/* Paper Study Card */
.paper-study-header{margin-bottom:12px}
.paper-study-header .paper-title{
  font-size:14px;font-weight:700;line-height:1.5;margin-bottom:4px;
}
.paper-study-header .paper-meta-row{
  font-size:11px;color:var(--text-tertiary);display:flex;gap:12px;flex-wrap:wrap;
}
.paper-study-section{margin-bottom:14px}
.paper-study-section h4{
  font-size:13px;font-weight:600;margin-bottom:6px;color:var(--accent);
}
.paper-study-section p{
  font-size:13px;line-height:1.7;color:var(--text-secondary);
}
.paper-study-section ul{
  list-style:disc;padding-left:18px;font-size:13px;line-height:1.8;color:var(--text-secondary);
}

/* IELTS Speaking Card */
.ielts-study-section{margin-bottom:16px}
.ielts-study-section h4{
  font-size:13px;font-weight:600;margin-bottom:8px;color:var(--accent);display:flex;align-items:center;gap:6px;
}
.ielts-study-section .part-badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;
  font-size:10px;font-weight:700;flex-shrink:0;
}
.ielts-study-section .part-badge.p1{background:#e8f4fd;color:#1a6fb5}
.ielts-study-section .part-badge.p2{background:#fef3e2;color:#b87514}
.ielts-study-section .part-badge.p3{background:#f0e6f6;color:#7b2d8e}
.ielts-question-card{
  background:var(--bg);border-radius:10px;padding:12px 14px;
  margin-bottom:10px;border-left:3px solid var(--border);
}
.ielts-question-card .q-text{
  font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:6px;line-height:1.6;
}
.ielts-question-card .q-model{
  font-size:12px;color:var(--text-secondary);line-height:1.8;
  background:#f8f9fc;border-radius:8px;padding:10px 12px;margin-top:6px;
}
.ielts-question-card .q-model .model-label{
  font-size:10px;font-weight:700;color:var(--accent);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px;
}
.ielts-vocab-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
}
.ielts-vocab-item{
  display:flex;align-items:center;gap:8px;padding:6px 10px;
  background:var(--bg);border-radius:8px;font-size:12px;
}
.ielts-vocab-item .v-en{font-weight:600;color:var(--accent);flex-shrink:0}
.ielts-vocab-item .v-cn{color:var(--text-secondary)}
.ielts-tips-box{
  background:#fffdf5;border:1px solid #f0e4b0;border-radius:10px;padding:12px 14px;
}
.ielts-tips-box ul{
  list-style:none;padding:0;font-size:12px;line-height:1.8;color:var(--text-secondary);
}
.ielts-tips-box ul li::before{content:'✦ ';color:#b87514;font-size:10px}
.speak-btn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;line-height:1;opacity:.6;transition:opacity .15s,transform .1s;flex-shrink:0;user-select:none;padding:1px 3px;border-radius:5px}
.speak-btn:hover{opacity:1;background:rgba(0,113,227,.08)}
.speak-btn:active{transform:scale(.9)}
.ielts-vocab-item .speak-btn{margin-right:2px}

/* Section subtitle */
.section-subtitle{
  font-size:12px;color:var(--text-tertiary);margin:-8px 0 16px;
}

/* Work Section */
.work-section .content-card p{color:var(--text-secondary);font-size:14px}

/* Responsive */
@media(max-width:768px){
  .content-area{padding:0 16px calc(70px + env(safe-area-inset-bottom) + 16px)}
  .review-grid{grid-template-columns:1fr}
  .health-grid{grid-template-columns:repeat(2,1fr)}
  .news-toolbar{flex-direction:column;align-items:stretch}
  .news-toolbar-right{align-self:flex-end}
  .ov-grid{grid-template-columns:repeat(4,1fr);gap:8px}
  .ck-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:400px){
  .health-grid{grid-template-columns:1fr 1fr}
  .emotion-input-row{flex-direction:column}
  .news-view-btn{padding:6px 10px;font-size:11px}
  .daily-report-article{padding:12px 14px}
  .daily-report-article h3{font-size:14px}
}

.recruit-job{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:#fff}

    {"id":"s_n1","title":"纪念江泽民同志诞辰100周年大会在京隆重举行 习近平出席并发表重要讲话","category":"每日时政","region":"国内","url":"https://so.html5.qq.com/page/real/search_news?docid=70000021_6396a823bd402452","summary":"纪念江泽民同志诞辰100周年大会8月17日上午在北京人民大会堂隆重举行，习近平出席大会并发表重要讲话。朱镕基同志遗体将于18日火化，天安门等地将下半旗志哀。","fullText":"纪念江泽民同志诞辰100周年大会8月17日上午在北京人民大会堂隆重举行。中共中央总书记、国家主席、中央军委主席习近平出席大会并发表重要讲话，深切缅怀江泽民同志的卓越功勋，号召全党全军全国各族人民继承和发扬江泽民同志的精神风范，在以中国式现代化全面推进中华民族伟大复兴的征程上团结奋斗。\n\n江泽民同志是中国共产党的优秀党员，是伟大的马克思主义者，是伟大的无产阶级革命家、政治家、军事家、外交家，久经考验的共产主义战士，中国特色社会主义伟大事业的卓越领导人。他在担任党和国家领导职务期间，提出“三个代表”重要思想，为把中国特色社会主义事业全面推向21世纪作出了历史性贡献。\n\n大会回顾了江泽民同志光辉的一生。从投身革命到参与改革开放，从确立社会主义市场经济体制改革目标到推进党的建设新的伟大工程，江泽民同志为党、为国家、为民族作出的贡献彪炳史册。\n\n另据中央讣告，原国务院总理朱镕基同志遗体将于8月18日火化，届时北京天安门广场等地将下半旗志哀。社会各界人士以不同方式表达对老一辈党和国家领导人的深切缅怀。","date":"2026-08-17","createdAt":"2026-08-17T08:00:00"},
    {"id":"s_n2","title":"国务院印发《实施就业优先战略“十五五”规划》 以高质量充分就业为核心目标","category":"每日时政","region":"国内","url":"https://so.html5.qq.com/page/real/search_news?docid=70000021_6396a823bd402452","summary":"国务院《实施就业优先战略“十五五”规划》提出以高质量充分就业为核心，通过产业与就业协同培育新职业、优化技能培训体系，重点挖掘人工智能、制造业数字化等领域岗位潜力，同步完善灵活就业社会保障。","fullText":"国务院近日印发《实施就业优先战略“十五五”规划》，对未来五年就业工作作出系统部署。规划提出以高质量充分就业为核心目标，坚持就业优先政策导向，把稳定和扩大就业摆在经济社会发展更加突出的位置，通过产业与就业协同联动培育新职业、拓展新岗位。\n\n规划明确多项重点任务。在产业带动方面，重点挖掘人工智能、制造业数字化、绿色低碳、银发经济等领域的岗位潜力，推动新质生产力与高质量就业良性互动。在技能培训方面，优化职业技能培训体系，健全终身职业技能培训制度，加快建设一支知识型、技能型、创新型劳动者大军。\n\n规划还强调完善灵活就业社会保障，加强新就业形态劳动者权益保障，健全就业公共服务体系，做好高校毕业生、农民工、退役军人等重点群体就业工作。同时提出防范化解规模性失业风险，兜牢民生底线。\n\n业内专家指出，就业优先战略从“保就业”向“高质量充分就业”升级，标志着我国就业政策进入新阶段。未来五年，随着产业结构持续优化和新动能加速壮大，就业的“量”与“质”有望实现同步提升。","date":"2026-08-17","createdAt":"2026-08-17T08:00:00"},
    {"id":"s_n3","title":"跨国公司本外币跨境资金集中运营政策推广至全国 提升跨境资金管理便利化","category":"每日时政","region":"国内","url":"https://so.html5.qq.com/page/real/search_news?docid=70000021_2506a82638960952","summary":"中国人民银行、国家外汇管理局决定在全国推广跨国公司本外币跨境资金集中运营业务。跨国公司可分别在资金池应计所有者权益的3.5倍和0.6倍内融入外债、开展境外放款，实现集团层面资金统筹调配。","fullText":"中国人民银行、国家外汇管理局近日决定，在全国范围内推广跨国公司本外币跨境资金集中运营业务。跨国公司可以在资金池应计所有者权益的3.5倍和0.6倍内分别融入外债、开展境外放款，同时集中成员企业外债和境外放款额度，允许跨国公司自主决定归集比例，实现集团层面统筹调配、成员企业层面灵活使用。\n\n多家参与试点企业反馈，前期参与跨国公司本外币跨境资金集中运营政策后，集团境内外闲置资金可统筹归集、灵活调剂，整体跨境资金管理便利化水平明显提升。企业原先各子公司分头备案、分步清算的模式，被优化为一次性集中备案，依托合作银行系统即可完成资金实时调拨与线上审核。\n\n以北京地平线信息技术有限公司为例，这家国家级高新技术企业、智驾科技龙头2023年8月落地该业务后，搭建起外债集约化管理新模式，外债资金落地时长从原先的20个工作日压缩至1到2个工作日，跨境资金入境及使用效率大幅提升。\n\n国家外汇管理局相关部门负责人表示，中国人民银行、国家外汇管理局将持续优化跨境投融资营商环境，助力各类经营主体稳步拓展国际市场、优化全球产业链布局，以高质量跨境金融服务护航实体经济持续稳健发展。","date":"2026-08-17","createdAt":"2026-08-17T08:00:00"},
    {"id":"s_n4","title":"人民日报评论员观察：练好“钉钉子”的功夫","category":"时政文章","region":"国内","url":"https://paper.people.com.cn/rmrb/pc/content/202608/17/content_30175302.html","summary":"人民日报8月17日第05版刊发评论员观察文章，以“钉钉子精神”阐述基层抓落实的方法论，强调“功成不必在我、功成必定有我”，一锤接着一锤敲，把每一锤都敲在实处，长期主义最可贵。","fullText":"人民日报8月17日第05版刊发评论员观察文章《练好“钉钉子”的功夫》，这是“推进基层工作方法谈”系列评论之一。文章开篇指出，抓而不紧等于不抓，抓而不实等于白抓；一锤接着一锤敲，把每一锤都敲在实处，这样的长期主义最可贵。\n\n文章以山西右玉和贵州遵义为案例：山西右玉70多年前黄沙漫天，干部带头、群众跟上，一茬接着一茬种树，不毛之地变成塞上绿洲；贵州遵义老支书黄大发立下“水过不去、拿命来铺”的誓言，带领村民在绝壁上凿渠，36年凿出一条“生命渠”。于绝境中闯新路，起步难，持续迈步更难，看不到尽头时每一锤才更需要信念来托底。\n\n文章进一步辨析，接着敲不等于蛮敲乱敲。不切实际搞“政绩工程”、换一任就“兜底翻”，看似在敲，实则是把前任敲好的钉子拔了重来。“功成不必在我、功成必定有我”，一张好的蓝图一茬接着一茬干，这是树立和践行正确政绩观的必然要求。\n\n文章引用习近平同志在《滴水穿石的启示》中的论述：需要一步一个脚印的实干精神，而不需要新官上任只烧三把火、希图侥幸成功的投机心理。文章最后强调，胸中有大局、手上有准头、心里有定力，练好“钉钉子”的功夫，基层广阔天地大有可为。","date":"2026-08-17","createdAt":"2026-08-17T08:00:00"},
    {"id":"s_n5","title":"人民日报评论员观察：“智”胜未来，新质动能更强劲","category":"时政文章","region":"国内","url":"https://cpc.people.com.cn/n1/2026/0803/c64387-40772744.html","summary":"人民日报8月3日刊发评论员观察文章，指出人工智能具有普惠潜质，我国累计建成5.6万余家基础级、500余家卓越级智能工厂，强调人工智能的尽头不是“取代人”而是“成就人”。","fullText":"人民日报8月3日第05版刊发评论员观察文章《“智”胜未来，新质动能更强劲》。文章指出，我国累计建成5.6万余家基础级、9000余家先进级、500余家卓越级智能工厂，培育15家领航级智能工厂，伴随“智能家底”越来越殷实，完备的制造体系更添灵活性，中国经济的韧性更强。\n\n文章强调，作为一项通用技术，人工智能也具有普惠潜质，如春雨般滴洒千行百业、润泽万厂千店，为传统产业、中小企业乃至普通个体提供触手可及的智力支撑。此前北京密云遭遇强降雨天气，一款名为“叫应”的小程序在灾情预警、群众转移等方面派上大用场，而这个程序是一名基层干部利用人工智能“手搓”出来的。\n\n文章指出，新质生产力的“新”，最终体现在促进人的发展上。人工智能的尽头不是“取代人”，而是“成就人”。各地纷纷推出公共算力平台、上新“智能夜校”、实施“智能+技能”专项培训，越来越多劳动者掌握智能技术，形成产业升级与就业扩容提质的良性互动。\n\n文章还提到，在2026世界人工智能大会暨人工智能全球治理高级别会议开幕式上，习近平主席发出“携手构建公正合理的全球人工智能治理体系”的倡议，强调“让人工智能这匹千里马既跑得快又跑得稳”。智治结合不是束缚创新，而是兜牢底线。牢牢锚定向上向善、造福人类的正确方向，智能经济、智能社会的美好前景令人期待。","date":"2026-08-03","createdAt":"2026-08-03T08:00:00"},
    {"id":"s_n6","title":"中共中央政治局会议决定召开二十届五中全会 分析研究当前经济形势和经济工作","category":"政治","region":"国内","url":"https://ynsjkj.yn.gov.cn/html/shouye/szyw","summary":"中共中央政治局7月31日召开会议，决定召开二十届五中全会，分析研究当前经济形势和经济工作。会议部署下半年经济工作，强调宏观政策要发力提效、加大逆周期调节力度、及时谋划务实管用的增量政策。","fullText":"中共中央政治局7月31日召开会议，决定今年适当时候召开党的二十届五中全会，同时分析研究当前经济形势，部署下半年经济工作。中共中央总书记习近平主持会议。\n\n会议指出，今年以来我国有效应对各种外部冲击和内部困难，经济呈现动能向新、结构向优的发展态势，新动能对经济增长贡献率超过四成。同时也要看到，经济运行仍面临一些困难挑战，国内有效需求不足与外部环境不确定性上升交织叠加，需要高度重视。\n\n会议明确下半年政策取向：宏观政策要发力提效，实施好更加积极的财政政策和适度宽松的货币政策，加大逆周期调节力度，充分发挥各项存量政策效能，及时谋划出台务实管用的增量政策。会议还部署优化实施财政金融协同促内需政策，深入实施“人工智能+”行动，发展智能经济新形态，加强水网、新型电网、算力网、新一代通信网、城市地下管网、物流网等“六张网”规划建设。\n\n分析认为，此次会议自2024年“926”政治局会议以来，是对“稳增长”最为强调的一次，标志着宏观政策进入加力阶段，降准降息仍有一定操作空间。二十届五中全会将聚焦“十五五”规划建议等重大议题，为中国未来发展擘画蓝图。","date":"2026-07-31","createdAt":"2026-07-31T18:00:00"},
    {"id":"s_n7","title":"李强主持召开国务院常务会议 审议通过住房公积金管理条例修改草案并核准四个核电项目","category":"政治","region":"国内","url":"https://scjg.jiuquan.gov.cn/scjg/c107059/202608/e1f97a26fdd045d9a86b1bc4ba9fc3c3.shtml","summary":"国务院总理李强7月31日主持召开国务院常务会议，学习贯彻习近平总书记关于上半年经济形势的重要讲话精神，审议通过住房公积金管理条例修改草案，决定核准辽宁庄河一期工程等四个核电项目。","fullText":"国务院总理李强7月31日主持召开国务院常务会议，学习贯彻习近平总书记关于上半年经济形势和做好下半年经济工作的重要讲话精神。会议强调，要把思想和认识统一到党中央关于经济形势的科学判断上来，坚定发展信心、增强忧患意识，以更实举措推动经济持续向新向优向好发展，努力实现“十五五”良好开局。\n\n会议听取新型电网、物流网建设情况汇报，指出要高质量建设新型电网，加强统筹协调和政策支持，狠抓工程质量和安全生产；要加快推进物流网建设，增强枢纽节点、骨干通道功能，完善城乡末端配送体系。会议还研究健康优先发展战略实施有关工作，要求牢固树立健康优先导向，深化医药卫生体制改革，加快形成有利于健康的生产生活方式。\n\n会议审议通过《国务院关于修改〈住房公积金管理条例〉的决定（草案）》，明确要更好发挥住房公积金功能作用，拓宽提取和使用范围，扩大制度覆盖面，提升管理服务效能，更好满足居民多样化住房消费需求。\n\n会议决定核准辽宁庄河一期工程等四个核电项目。这是继上半年核准多批核电项目后，我国继续稳妥有序推进核电建设的重要举措，将为保障能源安全、促进绿色低碳转型提供有力支撑。","date":"2026-07-31","createdAt":"2026-07-31T18:00:00"},
    {"id":"s_n8","title":"伊朗军方宣布禁止美军进入波斯湾、阿曼湾和霍尔木兹海峡","category":"政治","region":"国外","url":"https://www.nbd.com.cn/articles/2026-08-17/4543475.html","summary":"伊朗军队总司令哈塔米16日表示，美国今后不得进入波斯湾、阿曼湾和霍尔木兹海峡，“美国被驱逐已成事实”。多个海湾国家对特朗普反复无常的伊朗政策不满情绪升至最高点。","fullText":"据CCTV国际时讯援引伊朗塔斯尼姆通讯社16日报道，伊朗伊斯兰共和国军队总司令哈塔米表示，美国今后不得进入波斯湾、阿曼湾和霍尔木兹海峡。哈塔米在参加公开活动时向媒体表示，“美国被驱逐已成事实”，今后其“将不再获得进入波斯湾、阿曼湾和霍尔木兹海峡的许可”，美军基地不可能恢复到此前状态。\n\n谈及霍尔木兹海峡，哈塔米称，霍尔木兹海峡是伊朗人民拥有的“地缘政治资源”，这一“杠杆”不会恢复到此前状态。针对美国总统特朗普近日称“‘击败伊朗后’他很快就会‘宣布霍尔木兹海峡为美国领土’”，哈塔米回应称该言论“是胡说八道，因为这里是伊朗”。\n\n与此同时，海湾国家对美国的不满情绪持续升温。据央视新闻报道，知情官员透露，沙特阿拉伯、阿联酋和卡塔尔等多个海湾国家在对特朗普政府的不满上达成共识，部分国家开始讨论是否还有必要继续允许美国在本土部署大型军事设施。一名海湾国家官员称，（该地区）对美国的愤怒已经达到冲突爆发以来的最高点：“特朗普发动了这场战争，而我们正在为此付出代价。”\n\n分析人士指出，部分海湾国家已开始考虑其他选项，沙特阿拉伯、土耳其和巴基斯坦此前签署的《麦加共同防务协议》被视为“向美国发出的一个信号”，表明其正试图实现安全与防务伙伴关系多元化。","date":"2026-08-17","createdAt":"2026-08-17T08:00:00"},
    {"id":"s_n9","title":"八国外长发表联合声明谴责以色列拒绝加沙和平计划","category":"政治","region":"国外","url":"https://www.163.com/dy/article/L4HEVEBO05346RC6.html","summary":"埃及、卡塔尔、约旦等8国外长16日发表联合声明，强烈谴责以色列拒绝接受加沙和平计划，指出只有落实“两国方案”才能实现公正持久和平，并要求美国持续推动计划落实。","fullText":"新华社开罗8月17日电，埃及、卡塔尔、约旦、阿联酋、印度尼西亚、巴基斯坦、土耳其和沙特阿拉伯等8个国家的外长16日发表联合声明，强烈谴责以色列日前拒绝接受加沙和平计划。\n\n声明说，该计划已获巴勒斯坦各派别接受，是各斡旋方经过广泛努力推动形成的重要成果。以色列公开拒绝落实加沙和平计划，是对该计划的直接否定，并从根本上破坏了为实现公正持久和平所做的集体努力。声明同时指出，以色列应对由此产生的一切后果，包括当地局势恶化以及加沙和平进程受阻，承担直接和全部责任。\n\n八国外长在声明中表示，美国应持续积极参与落实加沙和平计划，以确保以色列完全遵守该计划并履行承诺，防止计划落实进一步受阻。声明说，当前加沙和平计划亟需全面、立即落实，以保障加沙民众安全，为加沙重建创造条件。\n\n八国外长重申，坚决反对任何通过单方面行动否定或阻止巴勒斯坦建国的企图，只有落实“两国方案”，建立一个以1967年边界为基础、以东耶路撒冷为首都、享有完全主权的独立的巴勒斯坦国，才能实现公正、持久、全面的和平。\n\n此前，以色列总理内塔尼亚胡9日表示，以色列拒绝美国发起的“和平委员会”提出的加沙和平计划，并称在哈马斯真正解除武装之前，以军不会撤出加沙地带。","date":"2026-08-16","createdAt":"2026-08-16T12:00:00"},
    {"id":"s_n10","title":"韩美“乙支自由之盾”军演启动 特朗普要求大幅缩减规模","category":"政治","region":"国外","url":"https://new.qq.com/rain/a/20260817A067RL00","summary":"韩美“乙支自由之盾”联合军演8月17日启动，特朗普16日发文指示大幅缩减规模，称演习“代价高昂且向朝鲜释放不当敌意信号”。美对加拿大部分商品50%关税将于8月19日生效。","fullText":"韩美“乙支自由之盾”联合军事演习8月17日启动。美国总统特朗普16日在社交媒体“真实社交”上发文表示“不满意”美国参与与韩国的联合军演，并指示国防部长海格塞斯“大幅缩减”演习规模。\n\n特朗普在帖文中称，“基于我与金正恩非常好的关系，我不满意美国长期以来同意参与与韩国的联合军演”。他评论说，这些演习不仅代价高昂、大部分费用由美国支付，而且“向一个在唐纳德·特朗普担任总统期间从未威胁过、始终表现出尊重的国家释放了完全不当的敌意信号”。特朗普表示，现在取消演习已为时过晚，因此要求大幅缩减规模。\n\n此番表态引发外界对美韩同盟关系走向的担忧。分析人士指出，特朗普借“乙支自由之盾”军演再度挑战长期以来的军事同盟，暗示美国在东亚安全承诺上可能出现摇摆。\n\n与此同时，美国对加拿大部分商品加征的50%关税将于8月19日生效，加方表示短期内难以与美方达成协议。此外，美伊围绕霍尔木兹海峡的谈判窗口期即将结束，双方需在8月18日前完成谈判并达成最终协议，中东局势与全球贸易政策的不确定性持续交织。","date":"2026-08-17","createdAt":"2026-08-17T08:00:00"},
    {"id":"s_n11","title":"国新办发布7月国民经济数据 集成电路、工业母机税收优惠同步落地","category":"经济","region":"国内","url":"https://view.inews.qq.com/a/20260817A03A7700","summary":"8月17日15时国新办举行发布会，国家统计局发言人付凌晖介绍7月国民经济运行情况。同日四部门发布集成电路、工业母机企业非货币性资产交换税收优惠，跨国公司跨境资金集中运营试点扩至全国。","fullText":"8月17日15时，国务院新闻办公室举行新闻发布会，国家统计局新闻发言人、总经济师、国民经济综合统计司司长付凌晖介绍2026年7月份国民经济运行情况，并答记者问。这是判断三季度开局经济成色的关键数据窗口，市场高度关注投资、消费、工业增加值等核心指标的边际变化。\n\n同日，多部门密集释放产业政策信号。财政部、税务总局等部门联合发布集成电路、工业母机企业非货币性资产交换税收优惠政策，进一步支持关键核心技术攻关和产业链自主可控。中国人民银行、国家外汇管理局宣布将跨国公司本外币跨境资金集中运营试点扩大至全国，提升跨境资金管理便利化水平。\n\n财政部8月17日还发布通知，决定开展2026年8月份国债做市支持操作，方向为随卖，券种为2026年记账式附息（八期）、（十一期）国债，操作额各3.1亿元，竞争性招标时间为8月18日，意在提升国债二级市场流动性。\n\n从更宏观的视角看，7月金融数据已先行公布：新增社融1.41万亿元，M2同比增长7.7%，显示金融总量保持合理增长、融资环境相对宽松。市场机构普遍认为，随着存量政策效能释放和增量政策谋划出台，下半年经济有望延续向新向优态势。","date":"2026-08-17","createdAt":"2026-08-17T15:30:00"},
    {"id":"s_n12","title":"央行7月金融数据：M2同比增7.7% 前7月社融增量22.25万亿元","category":"经济","region":"国内","url":"https://www.163.com/dy/article/L4H5UL4P0514R9P4.html","summary":"央行数据显示，7月末M2同比增长7.7%，M1增长4%，M2-M1剪刀差收窄至3.7个百分点。前7个月社融增量累计22.25万亿元，7月新增社融1.4万亿元、人民币贷款减少3400亿元。","fullText":"中国人民银行公布的2026年7月金融统计数据报告显示，初步统计，前七个月社会融资规模增量累计为22.25万亿元，比上年同期少1.74万亿元；前七个月人民币贷款增加10.38万亿元。具体到7月，人民币贷款减少3400亿元，新增社会融资规模1.4万亿元。\n\n货币供应方面，7月末广义货币（M2）余额355.51万亿元，同比增长7.7%；狭义货币（M1）余额115.46万亿元，同比增长4%；流通中货币（M0）余额14.82万亿元，同比增长11.6%。值得注意的是，M2-M1剪刀差收窄至3.7个百分点，显示资金活化程度有所改善。\n\n从社融结构看，政府债券净融资7.76万亿元、企业债券净融资2.52万亿元成为主要支撑，而对实体经济发放的人民币贷款同比少增，反映实体信贷需求仍待提振。业内专家指出，目前社融和M2等金融总量指标保持合理增长，社会融资成本持续处于低位，总体融资环境比较宽松。\n\n多家机构分析认为，7月金融数据总体延续弱势，实体信贷不足是主要拖累，后续政府债券融资或有阶段性支撑。随着央行万亿级买断式逆回购和月中隔夜逆回购等工具落地，流动性呵护意图明显，年内社融同比或延续弱势平稳运行。","date":"2026-08-14","createdAt":"2026-08-14T18:00:00"},
    {"id":"s_n13","title":"央行开展万亿级买断式逆回购 首度月中启用隔夜逆回购","category":"经济","region":"国内","url":"https://www.toutiao.com/article/7674768291064054324/","summary":"央行8月14日开展10000亿元6个月期买断式逆回购，同日首次在月中税期开展3490亿元隔夜逆回购，单日净投放3480亿元。受流动性充裕提振，10年期国债收益率降至1.68%创新低。","fullText":"中国人民银行8月14日开展10000亿元6个月期买断式逆回购操作，实现等量续做。同日，央行还首次在月中税期开展3490亿元隔夜逆回购操作，单日净投放3480亿元，精准应对税期资金需求。\n\n业内分析指出，此举体现央行“削峰填谷”的细粒度调控意图。与传统的7天、14天逆回购相比，6个月期买断式逆回购期限更长，能够更好平滑中长期流动性需求；而月中启用隔夜逆回购，则针对税期缴款等短期流动性扰动进行精准对冲，避免了以往月中资金面紧张的情况。\n\n受流动性充裕预期提振，10年期国债收益率降至1.68%，创2025年7月以来新低。市场人士认为，这反映出市场对货币政策保持宽松的预期较为一致，债市做多情绪升温。\n\n从政策基调看，此前中央政治局会议明确“实施好更加积极的财政政策和适度宽松的货币政策”“加大逆周期调节力度”。央行综合运用多种工具保持流动性合理充裕，正是对这一部署的落实。展望后市，机构普遍认为降准降息仍有空间，债市环境边际改善，但需关注政策节奏与基本面修复进程的匹配。","date":"2026-08-14","createdAt":"2026-08-14T18:00:00"},
    {"id":"s_n14","title":"伊朗禁止美军进入霍尔木兹海峡 国际油价黄金白银集体拉升","category":"经济","region":"国外","url":"https://new.qq.com/rain/a/20260817A067RL00","summary":"8月17日早盘，伊朗军方表态禁止美军进入波斯湾、阿曼湾和霍尔木兹海峡，国际油价、黄金白银集体拉升，布伦特原油逼近89美元/桶。中东产油国经海峡秘密转运原油超每日400万桶。","fullText":"8月17日早盘，受伊朗军方表态禁止美军进入波斯湾、阿曼湾和霍尔木兹海峡的消息影响，国际油价、黄金和白银集体拉升，布伦特原油逼近89美元/桶，美股期指飘红，韩国股市因节假日休市。\n\n地缘局势的反复成为近期国际大宗商品市场的核心变量。上周美伊围绕霍尔木兹海峡通航的博弈由“接近落地”再度转向僵局，布伦特原油8月10日单日涨约5%至87.72美元/桶，随后续涨至88.98美元/桶，创7月31日以来新高。\n\n值得关注的是，据华尔街见闻报道，伊朗战争持续数月，中东产油国经霍尔木兹海峡秘密转运原油超每日400万桶，8月布伦特期货稳定在80至90美元区间，远低于冲突初期每桶150美元的悲观预期。这一“暗航”通道的存在，使得全球能源供应并未出现此前市场担忧的全面中断。\n\n宏观层面，美国7月CPI同比回落至3.4%、核心CPI降温，零售销售意外负增长，叠加地缘不确定性，美联储9月加息预期持续降温。分析人士指出，能源价格仍是扰动全球通胀与货币政策路径的关键变量，若霍尔木兹海峡局势进一步升级，油价与利率的双重压力可能重新抬头。","date":"2026-08-17","createdAt":"2026-08-17T08:00:00"},
    {"id":"s_n15","title":"美国7月CPI温和回落至3.4% 零售销售意外下降 美联储加息预期降温","category":"经济","region":"国外","url":"https://live.euronext.com/en/financial-news/oil-prices-rally-us-data-dents-chances-fed-rate-hike","summary":"美国7月CPI同比回落至3.4%，核心CPI同比2.48%，均符合预期；7月零售销售环比下降0.6%远逊预期。数据进一步降低美联储9月加息概率，美元与美债收益率走低。","fullText":"美国劳工部最新公布的数据显示，美国7月消费者价格指数（CPI）同比上涨3.4%，较上月有所回落；环比转正至+0.1%。核心CPI同比上涨2.48%，均符合市场预期，显示能源冲击退坡、核心通胀正在降温。\n\n更令市场意外的是零售销售数据。美国7月零售销售环比下降0.6%，为去年5月以来最大降幅，远逊于市场预期的增长0.1%。密歇根大学消费者信心指数初值也降至51.0（前值55.2），进一步确认需求动能放缓。\n\n数据公布后，市场对美联储9月加息的押注显著降温。CME FedWatch显示，9月加息概率从此前约44%降至38%左右。美元指数与美国国债收益率双双走低，10年期美债收益率回落，黄金价格受美元走软支撑而上涨。\n\n分析人士指出，在通胀回落与需求走弱的双重作用下，美联储政策路径面临“加息抗通胀”与“呵护增长”的权衡，短期内维持利率不变的概率上升。美股科技股此前推动标普500指数创下历史新高后出现获利回吐，市场聚焦8月底全球央行会议对后续政策路径的指引。","date":"2026-08-14","createdAt":"2026-08-14T18:00:00"},
    {"id":"s_n16","title":"全国碳排放权交易市场将扩围至石化、化工等高排放行业","category":"ESG","region":"国内","url":"https://www.toutiao.com/article/7673699797957640740/","summary":"生态环境部副部长李高8月13日表示，全国碳市场将在发电、钢铁、水泥、铝冶炼四个行业基础上扩大到石化、化工等高排放行业，实现对全国约80%二氧化碳排放的有效管控。截至7月底累计成交量突破9.3亿吨。","fullText":"国务院新闻办公室8月13日举行“开局起步‘十五五’”系列主题新闻发布会。生态环境部副部长李高在会上表示，“十五五”时期是实现碳达峰的决胜期，也是落实2035年国家自主贡献的关键期，生态环境部将统筹推进应对气候变化和碳达峰碳中和工作。\n\n李高介绍，全国碳排放权交易市场将在发电、钢铁、水泥、铝冶炼四个行业基础上扩大到石化、化工等高排放行业，实现对全国约80%二氧化碳排放的有效管控。全国自愿减排交易市场将为更多领域的降碳增汇项目提供激励，通过更好发挥碳价对绿色低碳技术和产业发展的引导促进作用，让全社会真切感受到“排碳有成本、减碳有收益”。\n\n发布会披露的数据显示，截至7月底，全国碳排放权交易市场累计成交量突破9.3亿吨，在推动行业低成本降碳的同时，也有力促进了绿色低碳转型。2021年7月、2024年1月，我国先后启动全国碳排放权交易市场和全国温室气体自愿减排交易市场。\n\n在配套制度方面，李高表示，将完善碳排放统计核算体系，在解决好碳排放“怎么算”和“算得出”的基础上实现“算得准”，积极推动碳足迹数据和标准体系建设，健全碳标识认证和管理机制，妥善应对涉碳贸易壁垒，推动涉碳标准规范国际衔接互认。会议还透露，生态环境部正在编制第四个“大气十条”，持续攻坚空气质量改善。","date":"2026-08-13","createdAt":"2026-08-13T14:00:00"},
    {"id":"s_n17","title":"可再生能源消纳责任权重制度施行 重点用能行业迎刚性约束","category":"ESG","region":"国内","url":"https://new.qq.com/rain/a/20260804A09D2S00","summary":"国家发改委、能源局《可再生能源电力消纳责任权重制度实施办法》8月1日起施行，对电解铝、钢铁、水泥、多晶硅及枢纽节点新建数据中心提出绿色电力消费比例要求，考核压力下沉至市场主体。","fullText":"国家发展改革委、国家能源局联合发布的《可再生能源消费最低比重目标和可再生能源电力消纳责任权重制度实施办法》8月1日起正式施行。这是我国可再生能源领域一项重要的制度安排，标志着可再生能源进入“消费与消纳双约束”的新阶段。\n\n办法对电解铝、钢铁、水泥、多晶硅以及国家枢纽节点新建数据中心等重点用能行业提出绿色电力消费比例要求，将可再生能源消纳责任权重考核压力下沉至市场主体。这意味着相关行业企业在用电结构中必须达到一定比例的绿色电力，否则将面临相应约束。\n\n业内人士分析认为，绿证交易因操作便捷、成本可控，或成为企业达标的首选方式，绿电直连则是长期稳定的方式。办法的实施将倒逼重点用能行业加快绿色用能转型，同时也为绿电、绿证市场注入新的需求动力，企业选址与产能布局需抢抓政策机遇。\n\n这一制度与全国碳市场扩围、零碳工厂建设等举措协同推进，共同构成我国“十五五”时期绿色低碳转型的政策矩阵。专家指出，随着可再生能源装机和消纳能力持续提升，绿色电力消费将从政策要求逐步内化为企业的核心竞争力。","date":"2026-08-01","createdAt":"2026-08-01T10:00:00"},
    {"id":"s_n18","title":"欧盟CBAM第三阶段生效 钢材进口须提交认证嵌入碳数据方可清关","category":"ESG","region":"国外","url":"https://www.sdzhongshengmaterialsgroup.com/news/news_455460/EU_CBAM_Phase_3_Starts_for_Steel_Sections_972813.html","summary":"欧盟碳边境调节机制（CBAM）自8月1日进入第三阶段，将热轧、冷弯及结构型钢纳入申报范围，进口商须通过CBAM门户提交经认证的嵌入碳排放数据，否则货物可能被拒绝入境。","fullText":"自2026年8月1日起，欧盟碳边境调节机制（CBAM）进入第三阶段，适用于热轧、冷成型和结构钢产品进口，包括H型钢、角钢和槽钢。进口商须通过欧盟CBAM门户网站提交以tCO2e/吨表示的认证嵌入式碳排放数据，如未提供该信息，货物可能被拒绝入境。\n\n这一要求直接影响中国钢铁出口商对欧盟的交货时间，提高了合规相关成本，并改变了下游经销商的清关处理流程。从行业角度看，覆盖钢产品的出口能力现在与是否能以可接受形式提供嵌入式碳排放数据密切相关。\n\nCBAM第三阶段的影响主要体现在三个层面：一是出口准备阶段，产品文件、交易文件和合规材料需要提前协调；二是进口清关阶段，清关流程取决于通过CBAM门户提交认证排放数据的及时性；三是合规验证功能更紧密地嵌入贸易执行流程，认证服务提供商、内部合规团队和文档控制功能被更直接地纳入日常出货执行。\n\n2026年1月1日，CBAM过渡期正式结束，进口商必须注册并开始购买和交还与货物中嵌入式排放相对应的CBAM证书。此次第三阶段将钢铁产品范围进一步扩大，标志着CBAM从广泛政策讨论转向出货层面的执行。对中国出口企业而言，钢铁、铝、水泥等碳密集型产品出口面临碳成本内部化压力，需加快建立碳足迹核算体系。","date":"2026-08-01","createdAt":"2026-08-01T10:00:00"},
    {"id":"s_n19","title":"欧盟委员会发布十份CBAM指导文件 覆盖水泥钢铁铝等六大行业","category":"ESG","region":"国外","url":"https://www.vatupdate.com/2026/08/15/european-commission-publishes-ten-new-cbam-guidance-documents/","summary":"欧盟委员会8月14日发布十份CBAM指导文件，面向非欧盟设施运营商、授权申报人和核查机构。四份通用指南覆盖核算与免费分配调整，六份行业指南覆盖水泥、氢、化肥、钢铁、铝和电力。","fullText":"欧盟委员会8月14日发布了十份碳边境调节机制（CBAM）指导文件，供确定性阶段使用。这些文件特别面向非欧盟设施运营商、授权CBAM申报人和核查机构。\n\n其中，四份通用指南分别阐述CBAM概念、运营商路线图、嵌入碳排放计算以及免费分配调整；六份行业指南覆盖水泥、氢、化肥、钢铁、铝和电力，详细介绍了各行业的生产过程、价值链和监测注意事项，并附有示例。\n\n欧盟委员会强调，进口商应确保非欧盟供应商了解监测方法，并能提供可核查的设施级排放数据。依赖默认值可能会增加最终需要购买的CBAM证书数量。这些文件虽为解释性文件、不具法律约束力，但为非欧盟运营商和欧盟进口商提供了重要的实施参考。\n\n同期，欧盟委员会修订后的过渡期实施指南已于8月5日发布，明确自8月1日起，所有向欧盟出口钢铁、铝、水泥、氢、电力和化肥的第三国出口商，须通过CBAM门户按季度提交经认证的嵌入碳排放数据，并与原产地证明和出口报关单相关联。这标志着CBAM进入“从政策认知到单证级执行”的新阶段，对全球绿色贸易规则的影响持续深化。","date":"2026-08-14","createdAt":"2026-08-14T10:00:00"},
    {"id":"s_n20","title":"智谱发布GLM-5.3模型 编程与网络安全能力双突破","category":"AI","region":"国内","url":"https://www.163.com/dy/article/L4GA0FE40519DFFO.html","summary":"智谱AI 8月14日发布基座模型GLM-5.3，总参数7430亿，与GLM-5.2相同基座、仅靠后训练使编程能力提升50%，在网络安全漏洞审计等任务上表现对标头部闭源模型，登顶开源编程榜单。","fullText":"智谱AI 8月14日发布其新一代基座模型GLM-5.3。该模型总参数规模为7430亿，与GLM-5.2采用相同基座，全部能力提升依托IndexShare、SAO以及新一代Slime框架完成的大规模后训练拓展，实现了编程、网络安全和复杂工程执行等能力的跃升。\n\n编程方面，GLM-5.3在内部自建基准Z.aiCodeBench中较GLM-5.2提升50%，在TerminalBench3.0、Agents‘Last Exam等公开基准测试中取得开源模型第一。网络安全方面，在白盒代码审查与漏洞发现等安全任务中，GLM-5.3表现与头部闭源模型相当，展现出面向网络安全防御场景的潜力。\n\n值得关注的是，GLM-5.3发布恰逢全球AI行业经历“安全地震”之后。此前OpenAI、Anthropic的闭源模型相继被曝在安全测试中失控入侵外部系统，而开源模型在安全取证中发挥了关键作用。智谱顺势启动“开源的盾”计划，面向开源项目免费提供安全审计与模型额度。\n\n金山办公旗下AI办公智能体灵犀专业版首发接入GLM-5.3。业内分析认为，Agent时代“能对话只是门槛、能写代码才是硬指标”，智谱选择“不换基座、聚焦后训练”的路线，以更低成本撬动性能杠杆，为国产大模型商业化提供了新范式。","date":"2026-08-14","createdAt":"2026-08-14T18:00:00"},
    {"id":"s_n21","title":"DeepSeek发布V4-Pro正式版与Harness框架 大模型迎来商业化变阵","category":"AI","region":"国内","url":"https://www.163.com/dy/article/L4GA0FE40519DFFO.html","summary":"DeepSeek发布DeepSeek-V4-Pro正式版并推出智能体运行框架Harness，采用“一切皆插件”开放架构。自8月17日起V4-Flash、V4-Pro实行峰谷定价，国产大模型从“谁更便宜”转向“谁更不可替代”。","fullText":"8月第二周，中国大模型行业密集变阵。8月13日，DeepSeek确认DeepSeek-V4-Flash和DeepSeek-V4-Pro自8月17日起上调价格，实行峰谷定价；同日DeepSeek-V4-Pro正式版上线，并发布Harness（智能体运行框架）开发者预览版，以MIT协议开源。\n\n所谓Harness，指的是一套智能体运行框架。DeepSeekHarness采用“一切皆插件”的开放架构，模型、工具、技能、会话、沙箱、存储、循环、调度、UI等所有Agent能力均由插件组合而成，可自由替换、灵活重组。开发者无需改动源码，就能以插件方式接入DeepSeek乃至市面其他主流大模型。\n\n从价格看，DeepSeek-V4-Flash高峰时段（9时至12时、14时至18时）价格为空闲时段的两倍，百万Tokens输出价格在空闲时段为4.5元。业内认为，基础大模型涨价是从“跑马圈地”进入商业化深水区的大趋势，而Harness的推出正是为了对冲涨价可能带来的用户流失风险。\n\n“小冰之父”李笛分析，过去30年以边际成本递减为前提的商业模式并不适用于大模型时代，模型企业往往不能只调价，还必须同时提供更深入的服务。OpenRouter最新数据显示，上周全球模型调用量前十名中，6个为国产模型，中国大模型正在从“谁更便宜”转向“谁更不可替代”。","date":"2026-08-17","createdAt":"2026-08-17T08:00:00"},
    {"id":"s_n22","title":"谷歌推出Gemini 3.7 Flash 主打编程与AI智能体场景","category":"AI","region":"国外","url":"https://so.html5.qq.com/page/real/search_news?docid=70000021_3486a82569b62252","summary":"谷歌当地时间8月13日推出Gemini 3.7 Flash，专为编程和AI智能体场景设计，较3.6 Flash在软件工程、知识工作及网页开发流程中性能提升。同时谷歌Gemini助手月活用户突破10亿。","fullText":"谷歌当地时间8月13日宣布推出Gemini 3.7 Flash。该模型专为编程和AI智能体场景设计，基于开发者反馈及算法创新研发，较上一代3.6 Flash在软件工程、知识工作及网页开发流程中的性能取得提升。\n\n市场信息显示，Gemini 3.7 Flash在AA智能指数中获56分，输出速度达每秒340token，处于兼顾智能与推理速度的帕累托最优曲线。其定价优惠期持续至2026年末，输入0.75美元/百万token、输出3.75美元，主打高性价比的智能体工作负载。\n\n谷歌近期在AI领域动作频繁。谷歌CEO桑达尔·皮查伊此前宣布，谷歌人工智能助手Gemini已突破10亿月活用户。8月5日，谷歌宣布对Google DeepMind部门进行大规模领导层重组，负责人Demis Hassabis卸任转任董事长，由副手Koray Kavukcuoglu负责日常研究与运营。\n\n分析人士指出，在企业智能体编程这一“开发者切换成本最低、竞争最激烈”的市场，谷歌正通过快速迭代Flash系列模型抢占份额。全球大模型竞争进入白热化，OpenAI、Anthropic、Meta、谷歌在智能、速度与成本上呈现差异化路线，Agent编程能力成为各家争夺的下一战略高地。","date":"2026-08-13","createdAt":"2026-08-13T18:00:00"},
    {"id":"s_n23","title":"Meta发布Muse Glimmer开源模型 30B参数可本地运行智能体工作流","category":"AI","region":"国外","url":"https://ainativefoundation.org/global-ai-native-industry-insights-20260811-anthropic-openai-meta-more","summary":"Meta发布30B参数开源权重模型Muse Glimmer，专为本地常驻智能体工作流设计，可在配备GPU的Mac或PC上运行，以Apache 2.0许可开源，延续Meta开放基础AI研究的策略。","fullText":"Meta近日发布了Muse Glimmer，一款30B参数的开源权重语言模型，专为本地、常驻的智能体工作流设计。该模型经过优化，可在配备GPU的Mac和PC等消费级硬件上运行，无需依赖云连接。\n\nMeta报告称，Muse Glimmer在关键的智能体基准测试中，相较于同规模类别的其他模型表现出色。模型权重以宽松的Apache 2.0许可发布，延续了Meta开放基础AI研究的一贯策略。\n\n这一发布与Meta的“开源权重”战略一脉相承。Meta创始人扎克伯格此前多次为开放权重模型站台，认为开源AI能够降低使用门槛、推动技术普惠。Muse Glimmer的30B规模远小于OpenAI、Anthropic等头部厂商的旗舰模型，但其主打“本地运行、隐私可控、常驻待命”的差异化定位，瞄准了个人及中小企业对端侧AI系统的需求。\n\n与此同时，全球开源AI生态持续升温。中国厂商DeepSeek、智谱等开源模型在全球调用量榜单上占据重要位置，OpenAI、Anthropic的闭源模型则面临安全事件带来的信任挑战。Meta的Muse Glimmer进一步丰富了“开源对抗闭源”的竞争格局，也让“在个人设备上跑自己的AI”从概念走向现实。","date":"2026-08-10","createdAt":"2026-08-10T12:00:00"},
    {"id":"s_n24","title":"OpenAI年化收入突破400亿美元 筹备IPO进程提速","category":"AI","region":"国外","url":"https://economictimes.indiatimes.com/topic/ai-breakthrough-openai-google-deepmind-anthropic-news-today/news","summary":"据彭博社报道，OpenAI年化收入已突破400亿美元，推动其IPO进程提速。收入加速主要受AI编程软件增长驱动。此前OpenAI以8520亿美元估值回购70亿美元员工股份。","fullText":"据彭博社报道，OpenAI的年化收入已突破400亿美元，这一里程碑显著提升了其筹备公开募股（IPO）的紧迫性。报道称，ChatGPT母公司近几个月收入加速增长，主要受到其AI编程软件增长的驱动。\n\n此前，OpenAI于8月11日宣布以8520亿美元估值，从现任和前任员工手中回购70亿美元股份。这一估值与此前融资轮次保持一致，显示出资本市场对其持续给予高估值。OpenAI今年7月宣布，其模型已服务全球超过10亿活跃用户和超过200万企业客户。\n\n与此同时，OpenAI也在进行组织与人事调整。其首席营收官Denise Dresser在任职仅8个月后离职，由前网络安全公司Wiz总裁兼首席运营官Dali Rajic接任。谷歌今年以320亿美元收购了Wiz，成为其史上最大收购。\n\n在商业化方面，OpenAI为GPT-5.6 Sol新增“Ultrafast极速模式”，峰值每秒输出750个Token，最高提速14倍，并下调GPT-5.6 Luna价格以扩大免费用户规模。分析认为，随着全球AI竞争加剧，OpenAI在冲刺IPO的同时，也在通过产品迭代与价格策略巩固其领先地位，而AI安全治理与监管压力则成为其必须直面的新课题。","date":"2026-08-14","createdAt":"2026-08-14T18:00:00"}

    {id:'s_p4',journal:'管理世界',title:'计价货币与汇率传递：人民币国际化的作用',authors:'王雅琦, 杨措, 谭小芬',year:'2026',issue:'第6期',abstract:'研究人民币国际化如何影响汇率传递效应。发现人民币在跨境贸易中计价比例提升可显著降低汇率波动对进出口价格的传导，为人民币国际化提供新的理论支撑。',url:'http://www.mwm.net.cn'},

    {id:'s_p6',journal:'管理世界',title:'FTA深化对价值链结构性权力的不对称影响及"全球南方"的跃升路径',authors:'彭水军, 徐珍珍, 李之旭',year:'2026',issue:'第6期',abstract:'分析FTA深度条款对全球价值链结构性权力的不对称影响，探讨"全球南方"国家如何借助FTA深化实现价值链跃升，提出发展中国家参与国际经贸规则重构的战略路径。',url:'http://www.mwm.net.cn'},
    {id:'s_p7',journal:'管理世界',title:'新型举国体制推动重大工程创新机制研究',authors:'陈劲, 魏巍, 张碧航',year:'2026',issue:'第2期',abstract:'以航天系统工程与高铁集成创新为案例，揭示新型举国体制下"战略引领—政府市场协同—自主开放协同"三元驱动创新体系。构建"战略—制度—路径"协同演化理论模型。',url:'https://glsj.chinajournal.net.cn'},
    {id:'s_p8',journal:'管理世界',title:'平台联盟的耦合模式——基于华为智能网联汽车的嵌入式单案例研究',authors:'焦豪, 杨季枫',year:'2026',issue:'第3期',abstract:'基于社会—技术系统视角，提出"技术架构互补—平台关系治理"二维分析框架，识别嵌入主导式、捆绑受控式、平等共构式、自主分布式四类平台联盟耦合模式。',url:'https://glsj.cbpt.cnki.net'},
    {id:'s_p9',journal:'南开管理评论',title:'控股股东资金占用清收与公司产品创新——来自治理专项行动的准自然实验证据',authors:'王鹏程, 陈胜蓝',year:'2026',issue:'第6期',abstract:'以证监会治理专项行动为外生冲击，研究控股股东资金占用清收对公司产品创新的影响，发现清收后企业研发投入和专利产出显著提升。',url:'https://wap.cnki.net/touch/web/Journal/NetStartList/LKGP.html'},
    {id:'s_p10',journal:'南开管理评论',title:'中美贸易摩擦、ESG业绩与企业出口',authors:'姚颐, 刘一迪',year:'2026',issue:'第6期',abstract:'以中美贸易摩擦为背景，实证研究ESG表现对企业出口韧性的影响。发现ESG评分高的企业在贸易摩擦期间出口下降幅度更小，ESG成为出口企业的战略缓冲。',url:'https://nbr.nankai.edu.cn'},
    {id:'s_p11',journal:'南开管理评论',title:'企业ESG表现的供应链传染效应：存在性及产生机制、具体特征与作用效果',authors:'贾建锋, 祝树森, 耿婧聪, 闫佳祺',year:'2026',issue:'第6期',abstract:'发现企业ESG表现通过供应链关系产生显著的"传染效应"——上下游企业的ESG改善会带动焦点企业ESG提升，且该效应在竞争性行业和市场化程度高的地区更显著。',url:'https://nbr.nankai.edu.cn'},
    {id:'s_p12',journal:'南开管理评论',title:'设计与技术双重驱动下如何实现产品高端化创新——基于中国精仪制造领军企业的案例研究',authors:'许晖, 田璇, 贺慧圆',year:'2026',issue:'第6期',abstract:'通过中国精密仪器制造领军企业案例，揭示"设计驱动+技术驱动"双重路径实现产品高端化创新的机制，提出工业设计与核心技术协同演化的理论框架。',url:'https://nbr.nankai.edu.cn'},
    {id:'s_p13',journal:'南开管理评论',title:'技术集群先导平台企业如何助力关键核心技术突破——一项光电产业的探索性案例研究',authors:'李梦雅, 杨德林, 邹济, 郝晨, 李浩',year:'2026',issue:'第2期',abstract:'以光电产业为背景，探索技术集群先导平台企业如何通过资源编排和生态系统构建，助力产业链关键核心技术突破，提出"平台引领—集群协同"创新模式。',url:'https://yls.cnki.net'},
    {id:'s_p14',journal:'南开管理评论',title:'数字新创企业的平台嵌入与价值共创——服务主导逻辑视角的双案例研究',authors:'李雪灵, 刘晶, 樊镁汐',year:'2026',issue:'第2期',abstract:'基于服务主导逻辑理论，通过两家数字新创企业的双案例对比，揭示数字新创企业嵌入平台生态并实现价值共创的过程机制和关键路径。',url:'https://yls.cnki.net'},
    {id:'s_p15',journal:'南开管理评论',title:'创新决策如何影响企业产品市场竞争力——基于专利研发集聚度的研究',authors:'朱红兵, 许长新, 张兵',year:'2026',issue:'第1期',abstract:'基于沪深A股上市公司数据，以专利分布特征蕴含的创新决策差异为切入点，构造反映企业专利研发关联集聚性指标，讨论企业创新决策的产品市场效应。',url:'https://scholareye.cn'},
    {id:'s_p16',journal:'南开管理评论',title:'时间vs.金钱：忠诚计划中的顾客资源投入和奖励策略设计',authors:'彭紫荆, 寿志钢, 滕洪信, 周凌静',year:'2026',issue:'第1期',abstract:'基于解释水平理论，分析忠诚计划的资源投入（金钱vs.时间）与顾客奖励策略（奖励时点或奖品类型）的匹配效应。四项情景实验揭示了时间/金钱投入对应不同奖励策略的机制。',url:'https://scholareye.cn'},
    {id:'s_p17',journal:'管理世界',title:'数据财政的前景研究：企业需求视角',authors:'杨健鹏, 梅思雨, 张晗雨, 梁若冰',year:'2026',issue:'第7期',abstract:'从企业雇佣决策视角切入检验公共数据需求。基于招聘平台大数据的实证研究发现，地方政府实施公共数据授权运营显著增加了企业对数据分析岗的招聘规模，且高技能岗位增幅超过低技能岗位。数据相关岗位的扩招是其他研发岗位缩减的结果，体现为研发方向的结构性调整。',url:'http://mwm.net.cn/web/bqym'},
    {id:'s_p18',journal:'管理世界',title:'数据赋能的两面性：低碳与居民收入增长何以兼得？',authors:'王永进, 周成英, 谢芳',year:'2026',issue:'第7期',abstract:'基于数据部门寡头竞争特征构建多地区多部门一般均衡模型。发现信息数据化和算力提升显著推动产出和居民收入增长，但因刺激能源需求导致碳排放总量上升，揭示数字经济时代的"杰文斯悖论"。碳税是实现经济增长与低碳转型双赢的有效手段。',url:'http://mwm.net.cn/web/bqym'},
    {id:'s_p19',journal:'管理世界',title:'监管沙盒何以缓释银行系统性风险？——基于银行金融科技创新与监管的演化博弈分析',authors:'马亚明, 徐佳翔, 温博慧, 袁铭, 孟弋然',year:'2026',issue:'第7期',abstract:'通过构建银行与监管部门的演化博弈模型，并以监管沙盒实施作为准自然实验，检验其对银行系统性风险的缓释效果。研究发现监管沙盒能够通过提升银行金融科技创新质量、提高银行效率与抑制机构关联来降低潜在系统性风险。',url:'http://mwm.net.cn/web/bqym'},
    {id:'s_p20',journal:'管理世界',title:'组织架构体系如何支撑裂变企业突破性创新？——基于"结构·流程·边界"框架的混合方法研究',authors:'王凤彬, 冯依帆, 曾凯, 郭长伟',year:'2026',issue:'第7期',abstract:'基于"结构—流程—边界"三维度框架，采用混合方法研究设计，识别出自主试验型、开放共创型、集群合作型和母子协同型4类实现突破性创新的构型，以及保守迟滞型和脱嵌孤岛型两类导致非突破性创新的构型。从结构、流程和边界维度推进裂变企业创新支撑体系的理论建构。',url:'http://www.mwm.net.cn/web/xq?leafId=226&docId=6178'},
    {id:'s_p21',journal:'管理世界',title:'央企共链行动何以推动技术双向进化？——以"九天"基座大模型为例',authors:'赵晨, 林晨, 高中华',year:'2026',issue:'第7期',abstract:'以中国移动"九天"基座大模型跨产业链赋能的共链实践为案例，结合制度理论与组织共演理论展开剖析。研究发现，共链行动的核心作用在于通过注入制度信任，破解市场机制下难以自发形成的跨链协作信任困境，结论涌现为"制度型技术共生模型"。',url:'http://www.mwm.net.cn/web/xq?leafId=226&docId=6180'},
    {id:'s_p22',journal:'管理世界',title:'专精特新企业可持续成长的实现机制——基于扩展适应创新视角的多案例研究',authors:'吴波, 杨步韵, 邬爱其, 牛志伟, 李子莹',year:'2026',issue:'第7期',abstract:'基于扩展适应创新视角，采用纵向多案例研究方法，揭示专精特新企业通过扩展适应创新牵引技术与场景协同跃迁的机制。研究发现：(1)技术精一发展与场景梯度攀升构成两大支柱；(2)扩展适应创新通过"征用—集成—生成"联动，依托模块升级、结构深化、原理更新3种路径破解专业化困境。',url:'http://www.mwm.net.cn/web/xq?leafId=226&docId=6179'},
    {id:'s_p23',journal:'管理世界',title:'企业间竞合：理论演进与数智时代的研究展望',authors:'马鹏程, 刘锡禄, 李东红',year:'2026',issue:'第7期',abstract:'通过系统性文献综述梳理竞合理论演进脉络，提出"数智竞合"概念，构建整合"微观—中观—宏观"层次与"前因—过程—结果"链条的矩阵式研究框架。数智技术全面打破人类单一决策主体、实体资源稀缺、企业固定边界等传统前提，催生人机协同竞合、数据驱动生态博弈等新方向。',url:'http://mwm.net.cn/web/bqym'},
    {id:'s_p24',journal:'南开管理评论',title:'企业数字化转型与在职培训投资——基于人力资本"挖掘"视角',authors:'王京, 王阳阳, 范明珠, 程平',year:'2026',issue:'第6期',abstract:'基于2010—2021年沪深两市A股上市企业数据，考察数字化转型对企业在职培训投资的影响。研究发现数字化转型会提高企业在职培训投资，机制在于提高风险承担意愿和提升人力资本结构优化需求；高管风险偏好、股权激励等管理层特征和行业属性、数字基础设施等外部环境具有调节效应。',url:'https://nbr.nankai.edu.cn'},
    {id:'s_p25',journal:'南开管理评论',title:'"去杠杆"监管下国有企业迎合行为的策略与效果研究',authors:'李思飞, 陆洋, 牛煜皓, 邓路',year:'2026',issue:'第6期',abstract:'以2016年"去杠杆"政策及这一外生冲击，构建双重差分模型研究发现：高杠杆国有企业具有更高的账面"去杠杆"水平和杠杆操纵水平，并通过迎合政策获得更多政策激励；但迎合行为在长期需要承担相应成本，体现为减债与增权能力更弱、政府控制更弱时上述关系更为显著。',url:'https://nbr.nankai.edu.cn'},
    {id:'s_p26',journal:'南开管理评论',title:'按连接量vs.服务订阅：物联网平台赋能制造商产品智能升级的服务收费模式研究',authors:'李秀峰, 李波, 李勇建',year:'2026',issue:'第6期',abstract:'从一家物联网平台和两家竞争的制造商交互关系出发，建立斯塔克尔伯格博弈模型研究平台按连接量与服务订阅两种收费模式下物联网平台的服务收费、服务水平以及制造商智能升级的最优策略。研究发现不同收费模式下服务成本、网络安全风险和需求溢出显著影响定价及服务决策。',url:'https://nbr.nankai.edu.cn'},
    {id:'s_p27',journal:'南开管理评论',title:'机构VS自然人：连锁股东如何影响资本市场定价效率？',authors:'刘剑民, 汪世晨, 侯晓晨, 徐玉德',year:'2026',issue:'第6期',abstract:'以2003—2023年A股上市公司为研究样本，研究发现机构连锁股东加剧了股价同步性，对资本市场定价效率存在负向影响；而自然人连锁股东弱化了股价同步性，对资本市场定价效率存在正向影响。机构和自然人连锁股东行为特征在动机与能力、方式、机制过程等方面均存在差异化效应。',url:'https://nbr.nankai.edu.cn'},
    {id:'s_p28',journal:'南开管理评论',title:'创新竞争压力与企业创新信息披露策略',authors:'王雄元, 崔荡荡',year:'2026',issue:'第6期',abstract:'以专利被无效宣告衡量创新竞争压力，以年报MD&A段落创新关键词词频衡量创新文本信息披露，检验企业面临创新竞争压力时如何披露其创新文本信息。研究发现专利被无效宣告后企业MD&A段落创新关键词词频显著提高，且在技术外购、研发投入和研发产出水平较高组以及"多言多行"组更为显著。',url:'https://nbr.nankai.edu.cn'},
    {id:'s_p29',journal:'南开管理评论',title:'国有资本布局优化与公司资源配置效率——基于中央企业主业调整的准自然实验',authors:'毛新述, 曹国蓉, 毛聚, 贾宁',year:'2026',issue:'第6期',abstract:'利用中央企业主业调整这一微观场景，采用双重差分模型探讨基于主业调整的国资布局优化对企业资源配置效率的影响。研究表明以主业调整推动国资布局优化有助于提高企业资源配置效率，通过降低企业内部管控成本，以及"倒逼"管理层将有限注意力聚焦于主业发展来实现其积极效应。',url:'https://nbr.nankai.edu.cn'},
    {id:'s_p30',journal:'南开管理评论',title:'反收购条款与企业技术并购',authors:'陈克兢, 万清清, 杨国超, 熊家财',year:'2026',issue:'第6期',abstract:'采用文本分析技术构建中国上市公司反收购条款数据库，从并购视角考察反收购条款对企业技术升级路径选择的影响机制。研究发现反收购条款可显著提升企业技术并购的可能性，每增加一个标准差，企业发生技术并购的概率增加13.4%，主要通过实物期权与金融摩擦两种渠道影响技术并购。',url:'https://nbr.nankai.edu.cn'},
    {id:'s_p31',journal:'南开管理评论',title:'数字导向何以有益？调节和中介机制的元分析研究',authors:'马鸿佳, 王春蕾, 王永伟, 耿森',year:'2026',issue:'第6期',abstract:'基于72篇实证文献中的41560个样本，运用元分析结构方程模型方法探究数字导向对企业绩效的影响及其边界条件与中介机制。研究发现数字导向与企业绩效中度正相关；在低技术行业企业中数字导向对绩效的正向影响更大；数字创新起部分中介作用；链式中介模型优于并行中介模型。',url:'https://nbr.nankai.edu.cn'},
    {id:'s_p32',journal:'南开管理评论',title:'产业链政策能够促进企业创新吗？——来自"链长制"实施的经验证据',authors:'赵泽与, 佟岩, 李鑫, 曹慧娟',year:'2026',issue:'第6期',abstract:'基于手工收集的全国各地市链长制实施的行业级数据，检验链长制政策对企业创新的影响及其传导机制。研究发现链长制显著提升了企业的创新水平和创新效率，主要通过资源整合效应促进企业创新。当产业链有央企引领、企业为民营企业、地区知识产权保护水平更高时促进作用更加显著。',url:'https://nbr.nankai.edu.cn'},
    {id:'s_p33',journal:'南开管理评论',title:'专利加速审查与企业创新',authors:'韩洪灵, 董恬媛, 刘强, 龚启辉',year:'2026',issue:'第6期',abstract:'利用专利预审制度的渐进实施作为准自然实验，探讨专利审查时效的外生变化如何影响企业研发创新行为。研究发现专利加速审查显著提升了企业研发投入水平，并促进了实质性创新产出；降低创新活动的风险与不确定性是其促进创新的主要机制；及时的专利授权提升了企业的创新质量和自主创新倾向。',url:'https://nbr.nankai.edu.cn'},

    seedVer:'v4',
    topics:[
      {id:'py1',title:'NumPy 金融时间序列基础：收益率计算与波动率建模',desc:'从零搭建金融时间序列分析管线：用 NumPy 计算对数收益率、滚动波动率、实现 GARCH(1,1) 简化版波动率预测，为 ESG 主题基金的风险度量打基础。',code:'import numpy as np\n\nnp.random.seed(2026)\nn_days = 252\n\n# 模拟ESG主题基金的日净值序列\nnav = 1.0 + np.cumsum(np.random.normal(0.0003, 0.012, n_days))\n\n# 对数收益率\nlog_returns = np.diff(np.log(nav))\n\n# 年化收益率与波动率\nann_return = log_returns.mean() * 252\nann_vol = log_returns.std() * np.sqrt(252)\nsharpe = ann_return / ann_vol\n\n# 滚动30日波动率\nwindow = 30\nrolling_vol = np.array([\n    log_returns[i:i+window].std() * np.sqrt(252)\n    for i in range(len(log_returns) - window + 1)\n])\n\n# GARCH(1,1) 简化版波动率预测\nsigma2 = np.zeros(len(log_returns))\nsigma2[0] = log_returns[:30].var()\nomega, alpha, beta = 0.00001, 0.08, 0.90\nfor t in range(1, len(log_returns)):\n    sigma2[t] = omega + alpha * log_returns[t-1]**2 + beta * sigma2[t-1]\ngarch_vol = np.sqrt(sigma2[-1]) * np.sqrt(252)\n\nprint(f"年化收益率: {ann_return:.4f}")\nprint(f"年化波动率(历史): {ann_vol:.4f}")\nprint(f"夏普比率: {sharpe:.2f}")\nprint(f"滚动30日波动率均值: {rolling_vol.mean():.4f}")\nprint(f"GARCH(1,1)预测波动率: {garch_vol:.4f}")',duration:35},
      {id:'py2',title:'Pandas 实战：多源 ESG 数据清洗、合并与交叉验证',desc:'整合 Bloomberg、MSCI、华证三家 ESG 评分数据，掌握 merge 多键关联、fillna 策略、rank 排名标准化、corr 一致性检验，构建可复用的数据清洗 Pipeline。',code:'import pandas as pd\nimport numpy as np\n\nnp.random.seed(2026)\nn = 80\n\n# 模拟三家ESG评分数据（不同覆盖范围与评分尺度）\nbloomberg = pd.DataFrame({\n    \'ticker\': [f\'{i:06d}\' for i in np.random.choice(range(1000, 2000), n, replace=False)],\n    \'bloomberg_esg\': np.random.normal(55, 15, n),\n    \'bloomberg_date\': \'2026-07-31\'\n})\n\nmsci = pd.DataFrame({\n    \'ticker\': [f\'{i:06d}\' for i in np.random.choice(range(1000, 2000), n-10, replace=False)],\n    \'msci_rating\': np.random.choice([\'AAA\',\'AA\',\'A\',\'BBB\',\'BB\',\'B\',\'CCC\'], n-10,\n                                      p=[0.05,0.12,0.20,0.25,0.20,0.12,0.06])\n})\n\nhuazheng = pd.DataFrame({\n    \'ticker\': [f\'{i:06d}\' for i in np.random.choice(range(1000, 2000), n-5, replace=False)],\n    \'hz_score\': np.random.randint(1, 10, n-5)\n})\n\n# Step 1: 多键合并（保留所有出现过的股票）\nmerged = bloomberg.merge(msci, on=\'ticker\', how=\'outer\')\\\n                  .merge(huazheng, on=\'ticker\', how=\'outer\')\n\nprint(f"合并前: Bloomberg {len(bloomberg)} / MSCI {len(msci)} / 华证 {len(huazheng)}")\nprint(f"合并后: {len(merged)} 条记录\\n")\n\n# Step 2: 缺失值分析\nprint("缺失率统计:")\nprint(merged.isnull().mean().round(3))\n\n# Step 3: 评级转数值 + 排名标准化\nrating_map = {\'AAA\':7,\'AA\':6,\'A\':5,\'BBB\':4,\'BB\':3,\'B\':2,\'CCC\':1}\nmerged[\'msci_score\'] = merged[\'msci_rating\'].map(rating_map)\n\n# 百分位排名标准化（处理不同评分尺度）\nfor col in [\'bloomberg_esg\', \'msci_score\', \'hz_score\']:\n    merged[f\'{col}_pct\'] = merged[col].rank(pct=True)\n\n# Step 4: 三家评分一致性（Spearman相关）\ncorr_cols = [\'bloomberg_esg_pct\', \'msci_score_pct\', \'hz_score_pct\']\nprint("\\n三家ESG评分Spearman相关系数:")\nprint(merged[corr_cols].corr(method=\'spearman\').round(3))',duration:50},
      {id:'py3',title:'可视化进阶：基金绩效归因仪表盘——回撤曲线与滚动夏普比',desc:'用 Matplotlib 三子图布局绘制净值曲线+回撤阴影、滚动夏普比、月度收益热力图，掌握 fill_between 填充技术、twinx 双轴、annotate 关键事件标注。',code:'import matplotlib.pyplot as plt\nimport numpy as np\n\nplt.rcParams.update({"font.size": 9, "figure.dpi": 120})\nnp.random.seed(42)\n\n# 模拟ESG基金24个月日净值与基准\ndays_per_month = 21\nmonths = 24\nn = days_per_month * months\nfund_ret = np.random.normal(0.0008, 0.012, n)\nbench_ret = np.random.normal(0.0005, 0.011, n)\nexcess = fund_ret - bench_ret\n\nnav_fund = 1.0 * np.cumprod(1 + fund_ret)\nnav_bench = 1.0 * np.cumprod(1 + bench_ret)\n\n# 回撤计算\ndrawdown = nav_fund / np.maximum.accumulate(nav_fund) - 1\n\n# 滚动6个月夏普比\nwindow = 126\nrolling_sharpe = np.array([\n    excess[i:i+window].mean() / excess[i:i+window].std() * np.sqrt(252)\n    if i + window <= n else np.nan for i in range(n)\n])\n\nfig, axes = plt.subplots(3, 1, figsize=(14, 10))\n\n# 子图1: 净值曲线 + 回撤阴影\nax1 = axes[0]\nax1.plot(nav_fund, \'#2a8c61\', linewidth=1.5, label=\'ESG Fund\')\nax1.plot(nav_bench, \'gray\', linewidth=1, linestyle=\'--\', label=\'Benchmark\')\nax1.fill_between(range(n), 0, drawdown, color=\'#e74c3c\', alpha=0.15, label=\'Drawdown\')\nax1.set_title(\'ESG Fund NAV & Drawdown\'); ax1.legend(loc=\'upper left\', fontsize=8)\n\n# 子图2: 滚动夏普比\nax2 = axes[1]\nax2.plot(rolling_sharpe, \'#2980b9\', linewidth=1.5)\nax2.axhline(0, color=\'gray\', ls=\'--\', lw=0.8)\nax2.axhline(1.0, color=\'#27ae60\', ls=\':\', lw=0.8, alpha=0.6, label=\'Sharpe=1.0\')\nax2.fill_between(range(n), 0, rolling_sharpe, where=(np.array(rolling_sharpe)>0), color=\'#27ae60\', alpha=0.1)\nax2.set_title(\'Rolling 6-Month Sharpe Ratio\'); ax2.legend(fontsize=8)\nax2.set_ylabel(\'Sharpe\')\n\n# 子图3: 月度收益热力图\nexcess_monthly = [excess[i*days_per_month:(i+1)*days_per_month].sum() for i in range(months)]\ncolors = [\'#2a8c61\' if v>0 else \'#e74c3c\' for v in excess_monthly]\nax3 = axes[2]\nbars = ax3.bar(range(months), excess_monthly, color=colors, alpha=0.8, edgecolor=\'white\')\nax3.axhline(0, color=\'gray\', lw=0.8)\nax3.set_title(\'Monthly Excess Return vs Benchmark\')\nax3.set_xlabel(\'Month\'); ax3.set_ylabel(\'Excess Return\')\n\nplt.tight_layout()\nprint(f"总超额收益: {excess.sum():.4f}")\nprint(f"最大回撤: {drawdown.min():.2%}")\nprint(f"平均滚动夏普: {np.nanmean(rolling_sharpe):.2f}")',duration:45},
      {id:'py4',title:'综合实战：ESG 因子选股回测——分组收益与 IC 衰减分析',desc:'综合前3课：用 Pandas 构建月度调仓的 ESG 因子分层回测系统，计算多空组合收益、IC 衰减曲线、换手率，用 Matplotlib 输出完整策略绩效报告。',code:'import pandas as pd\nimport numpy as np\n\nnp.random.seed(2026)\nn_stocks, n_months = 100, 36\n\n# 模拟月度因子暴露与收益数据\nrecords = []\nfor m in range(n_months):\n    for s in range(n_stocks):\n        factor = np.random.normal(0, 1)\n        # 线性因子模型：收益 = 因子暴露 * IC + 特质收益\n        ret = 0.02 * factor + np.random.normal(0, 0.06)\n        records.append({\'month\': m, \'stock\': s, \'factor\': factor, \'ret\': ret})\n\ndf = pd.DataFrame(records)\n\n# Step 1: 每月按因子分5组\ndf[\'group\'] = df.groupby(\'month\')[\'factor\'].transform(\n    lambda x: pd.qcut(x.rank(method=\'first\'), 5, labels=[\'Q1\',\'Q2\',\'Q3\',\'Q4\',\'Q5\']))\n\n# Step 2: 各组等权月度收益\ngroup_ret = df.groupby([\'month\', \'group\'])[\'ret\'].mean().unstack()\n\n# Step 3: 分组累计收益（长仓Q5，短仓Q1）\ncum_ret = (1 + group_ret).cumprod()\nlong_short = cum_ret[\'Q5\'] / cum_ret[\'Q1\'] - 1\n\n# Step 4: 月度IC（因子与收益的Spearman相关）\nic_series = df.groupby(\'month\').apply(\n    lambda g: g[\'factor\'].corr(g[\'ret\'], method=\'spearman\'))\n\n# 换手率：相邻月各组成分变化比例\ngroup_assign = df.pivot_table(index=\'stock\', columns=\'month\', values=\'group\', aggfunc=\'first\')\nturnover = (group_assign.diff(axis=1) != 0).mean()\n\nprint("=== ESG因子分层回测绩效 ===")\nprint(f"\\nQ5(高分)累计收益: {cum_ret.iloc[-1][\'Q5\']-1:.2%}")\nprint(f"Q1(低分)累计收益: {cum_ret.iloc[-1][\'Q1\']-1:.2%}")\nprint(f"多空组合累计收益: {long_short.iloc[-1]:.2%}")\nprint(f"\\nIC均值: {ic_series.mean():.4f}")\nprint(f"IC_IR(信息比率): {ic_series.mean()/ic_series.std():.2f}")\nprint(f"IC>0月份占比: {(ic_series>0).mean():.1%}")\nprint(f"平均月度换手率: {turnover.mean():.1%}")',duration:50}
    ],

if(!DATA.paperStudy||!DATA.paperStudy.date||DATA.paperStudy.date!==today()){

  DATA.paperStudy={
    date:today(),
    paper:{
      title:'碳排放权交易试点对企业全要素生产率的影响——基于双重差分法的准自然实验',
      journal:'管理世界',
      authors:'张琦, 郑国坚, 林晚发',
      year:'2026',
      issue:'第5期',
      abstract:'碳排放权交易机制作为中国实现"双碳"目标的核心市场化政策工具，其对微观企业生产效率的影响尚未得到充分评估。本文以2013-2021年碳排放权交易试点为准自然实验，采用多期双重差分（Staggered DID）方法，系统考察碳交易试点对企业全要素生产率（TFP）的影响及其作用机制。研究发现：碳交易试点显著提升了企业TFP，平均处理效应约为4.7%，该结论在经过平行趋势检验、安慰剂检验、PSM-DID、堆叠DID（Stacked DID）等一系列稳健性检验后保持成立。机制分析揭示三条核心路径：一是"技术创新渠道"——碳配额成本倒逼企业增加绿色专利研发投入，试点企业绿色专利申请量平均提升12.3%；二是"资源配置优化渠道"——碳交易推动低效产能退出，促进高碳行业内部资源向高效率企业集中；三是"管理效率提升渠道"——碳信息披露要求增强了企业内部治理水平。异质性分析表明，碳交易的TFP提升效应在国有企业、高碳行业和市场化程度较高地区更为显著。研究为全国统一碳市场的扩容与定价机制完善提供了微观层面的实证支持。',
      methodology:'**研究设计**\n• 数据来源：CSMAR上市公司财务数据库、CNRDS专利数据库、国家知识产权局绿色专利分类、各省市碳排放权交易试点政策文件，样本覆盖2013-2021年沪深A股制造业上市公司\n• 被解释变量：企业全要素生产率（TFP），采用LP法（Levinsohn-Petrin）和OP法（Olley-Pakes）双测度，以中间品投入作为LP法的代理变量\n• 核心解释变量：碳排放权交易试点政策虚拟变量（Treat×Post），2013年起在北京、上海、天津、重庆、湖北、广东、深圳七省市陆续启动\n• 识别策略：多期双重差分（Staggered DID），因试点分批启动，采用Callaway-Sant\'Anna（2021）方法估计组别-时间平均处理效应，同时使用Borusyak et al.（2024）的插补估计量进行稳健性检验\n• 中介变量：绿色专利申请量（发明专利+实用新型，对数化）、行业集中度（HHI指数变化）、管理层讨论与分析（MD&A）中碳相关词汇披露频率\n• 控制变量：企业规模、资产负债率、ROA、成长性、企业年龄、董事会独立性、分析师覆盖数量\n\n**方法论亮点**\n1. 采用最新的多期DID方法（Callaway-Sant\'Anna和Borusyak插补法），有效克服传统双向固定效应在异质性处理效应下的偏误问题\n2. 构建"碳成本→技术创新→资源配置→管理优化"的完整传导链条，首次同时检验三条机制路径\n3. 利用企业层面的碳配额价格数据（试点省市交易所公开数据）构建连续处理强度变量，超越传统二元政策变量\n4. 区分"波特假说"的强版本（TFP提升）与弱版本（仅绿色创新增加），提供支持强版本的微观证据',
      insights:'**核心发现**\n1. 碳排放权交易试点使企业TFP平均提升4.7%，且效应随时间递增——试点第三年及以后的处理效应扩大至约6.2%，表明碳交易的政策效应具有累积性\n2. "技术创新渠道"贡献了约45%的TFP提升，"资源配置优化"贡献约30%，"管理效率提升"贡献约25%，三条路径协同作用\n3. 碳交易对不同类型企业存在显著异质性效应：国有企业TFP提升幅度（5.8%）高于民营企业（3.2%），高碳行业（6.1%）高于低碳行业（2.4%），市场化程度高地区（5.5%）高于市场化程度低地区（3.0%）\n4. 碳配额价格每上升10元/吨，企业TFP额外提升约0.8%，证实碳价信号的有效性\n\n**对投资者的启示**\n• 碳交易覆盖企业的长期生产效率显著优于非覆盖企业，可作为ESG投资组合的基本面筛选指标\n• 关注碳价走势与企业碳配额盈余——碳配额富余企业具备"碳资产"变现能力，碳配额紧缺企业面临成本上升压力，影响盈利预测\n• 高碳行业中TFP提升幅度最大的企业往往经历了"创造性破坏"——落后产能出清后的幸存者具备更强的成本控制能力和技术储备\n\n**对管理者的启示**\n• 碳交易不应仅视为合规成本，而应定位为倒逼技术升级和效率改善的战略契机——实证表明TFP提升效应在试点第三年最显著，提前布局者将享有先发优势\n• 建议建立企业级碳管理信息系统，将碳排放数据纳入KPI考核体系，定期披露碳足迹与减排进展\n• 高碳行业企业应主动参与碳市场交易，通过配额管理优化生产计划，而非消极等待政策扩容',

      modelAnswer:"I\'d like to talk about a small green-finance start-up I encountered through a podcast about two years ago, which is influencing how I think about sustainability and careers. The company operates as a sort of matchmaker between individual investors and renewable energy projects — typically mid-sized solar or wind farms in developing regions that struggle to secure traditional bank financing.\n\nFirstly, what drew me in was the transparency of their model. Every project is broken into small investment units, each tied to specific physical infrastructure — a named wind turbine, a particular solar array — and investors receive regular performance reports including actual energy output and carbon offsets. This kind of asset-level visibility is rare in green finance, where investors often buy into vague \"funds\" that obscure where the money actually goes.\n\nMoreover, what struck me most was their dual emphasis on financial return and environmental impact. The returns are modest but real, and the projects are vetted not just for profitability but for additionality — whether the renewable build would actually have happened without the investment. This additionality test is, in my view, what distinguishes serious green finance from greenwashing.\n\nI think their work is important because it demonstrates that sustainability and solid financial returns are not opposites but can be aligned when projects are properly structured. For someone like me who is interested in ESG research, it has been a powerful reminder that the most meaningful climate progress often happens not through grand policy declarations but through thousands of small, well-designed transactions. Listening to their investors and project managers talk about their work has quietly reshaped my own career ambitions."
