<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<!-- PWA: iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Juny">
<link rel="apple-touch-icon" href="icon-192.png">
<!-- PWA: Android / Chrome -->
<meta name="theme-color" content="#2a8c61">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>Juny</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #f3f4f6;
  --card-bg: #ffffff;
  --text: #1d1d1f;
  --text-secondary: #6e6e73;
  --text-tertiary: #aeaeb2;
  --border: #ececf0;
  --accent: #2a8c61;
  --accent-light: #3a9c70;
  --blue: #0071e3;
  --green: #34c759;
  --orange: #ff9500;
  --red: #ff3b30;
  --purple: #af52de;
  --teal: #5ac8fa;
  --lotus: #2e9e6b;
  --lotus-deep: #1f7a54;
  --sidebar-width: 220px;
  --stats-height: 100px;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.04);
  --shadow: 0 2px 8px rgba(0,0,0,.06);
  --shadow-lg: 0 8px 30px rgba(0,0,0,.08);
  --font: -apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',system-ui,sans-serif;
  --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.6;
  background-image:radial-gradient(rgba(0,0,0,.025) 1px,transparent 1px);
  background-size:22px 22px;}
button{-webkit-tap-highlight-color:transparent;font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit}
input,textarea,select{font-family:inherit;font-size:inherit}
.app-container{display:flex;min-height:100vh;min-height:100dvh}

/* Sidebar */
.sidebar{
  width:var(--sidebar-width);min-width:var(--sidebar-width);
  background:var(--card-bg);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:fixed;top:0;left:0;
  height:100vh;height:100dvh;z-index:200;
  transition:left var(--transition);
  padding:0;
  box-shadow:2px 0 20px rgba(0,0,0,.06);
}
.sidebar.closed{left:calc(-1 * var(--sidebar-width))}
.sidebar-header{
  padding:20px 18px 16px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
}
.app-logo{
  width:36px;height:36px;border-radius:10px;
  background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:16px;letter-spacing:-0.5px;
}
.app-logo span{font-weight:400;opacity:.7}
.sidebar-header h2{font-size:15px;font-weight:600;letter-spacing:-0.3px;color:var(--text)}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.sidebar-nav::-webkit-scrollbar{width:0}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 14px;border-radius:var(--radius-sm);
  font-size:14px;font-weight:500;color:var(--text-secondary);
  transition:all var(--transition);position:relative;
  white-space:nowrap;
}
.nav-item:hover{background:rgba(0,0,0,.03);color:var(--text)}
.nav-item.active{background:var(--accent);color:#fff}
.nav-item .nav-icon{font-size:17px;width:22px;text-align:center;flex-shrink:0}
.nav-item .nav-name{flex:1}
.nav-item .nav-remove{
  width:20px;height:20px;border-radius:50%;display:none;
  align-items:center;justify-content:center;
  font-size:12px;color:inherit;opacity:.6;flex-shrink:0;
}
.nav-item:hover .nav-remove{display:flex}
.nav-item.active .nav-remove:hover{opacity:1}
.sidebar-add{padding:10px 14px;border-top:1px solid var(--border)}
.sidebar-add button{
  width:100%;padding:10px;border-radius:var(--radius-sm);
  border:1.5px dashed var(--border);color:var(--text-tertiary);
  font-size:13px;font-weight:500;
  transition:all var(--transition);
}
.sidebar-add button:hover{border-color:var(--accent);color:var(--accent)}
.sidebar-add-row{display:flex;gap:6px;margin-top:6px}
.sidebar-add-row input{
  flex:1;padding:8px 10px;border:1.5px solid var(--border);
  border-radius:8px;font-size:13px;outline:none;
}
.sidebar-add-row input:focus{border-color:var(--blue)}
.sidebar-add-row .btn-confirm,.sidebar-add-row .btn-cancel{
  padding:8px 12px;border-radius:8px;font-size:13px;font-weight:500;
}
.sidebar-add-row .btn-confirm{background:var(--accent);color:#fff}
.sidebar-add-row .btn-cancel{color:var(--text-secondary)}

/* Main Content */
.main-content{
  flex:1;margin-left:0;
  padding:0;min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
}

/* Sidebar Toggle Button (always visible) */
.sidebar-toggle-btn{
  position:fixed;top:14px;left:14px;z-index:210;
  width:44px;height:44px;border-radius:50%;
  background:var(--card-bg);box-shadow:var(--shadow);
  align-items:center;justify-content:center;
  font-size:20px;color:var(--text);display:flex;
  transition:all var(--transition);cursor:pointer;
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.sidebar-toggle-btn:active{background:var(--bg);transform:scale(.92)}
.sidebar-toggle-btn.shifted{left:calc(var(--sidebar-width) + 14px)}

/* Sidebar Overlay */
.sidebar-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.35);
  z-index:190;opacity:0;pointer-events:none;
  transition:opacity var(--transition);
}
.sidebar-overlay.show{opacity:1;pointer-events:auto}

/* Bottom Tab Bar (always visible) */
.bottom-nav{
  display:block;
  position:fixed;left:0;right:0;bottom:0;z-index:180;
  background:var(--card-bg);
  border-top:1px solid var(--border);
  box-shadow:0 -2px 12px rgba(0,0,0,.05);
  overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  scrollbar-width:none;
}
.bottom-nav::-webkit-scrollbar{display:none}
.bottom-nav-inner{display:inline-flex;gap:4px;min-width:100%;align-items:center}
.bottom-nav .nav-item{
  flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:8px 12px;border-radius:10px;
  font-size:11px;font-weight:600;color:var(--text-tertiary);
  min-width:64px;max-width:96px;
  transition:all var(--transition);
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  position:relative;
}
.bottom-nav .nav-item .nav-icon{font-size:20px;line-height:1}
.bottom-nav .nav-item .nav-name{
  font-size:10.5px;line-height:1.1;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.bottom-nav .nav-item.active{background:var(--accent);color:#fff}
.bottom-nav .nav-item:active{background:rgba(0,0,0,.06)}
.bottom-nav .nav-item.active:active{background:var(--accent)}
.bottom-nav .nav-add{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  width:38px;height:38px;border-radius:50%;
  background:var(--bg);color:var(--text-secondary);
  font-size:22px;font-weight:300;
  margin-left:6px;
  cursor:pointer;border:1.5px dashed var(--border);
  -webkit-tap-highlight-color:transparent;
}
.bottom-nav .nav-add:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(min-width:769px){
  .bottom-nav .nav-item{padding:10px 16px;font-size:12px;min-width:76px}
  .bottom-nav .nav-item .nav-icon{font-size:22px}
  .bottom-nav .nav-item .nav-name{font-size:11.5px}
}

/* Content Area */
.content-area{flex:1;padding:0 24px calc(80px + env(safe-area-inset-bottom) + 20px);overflow-y:auto}
.section-title{font-size:20px;font-weight:700;letter-spacing:-0.5px;margin-bottom:16px;color:var(--text);display:flex;align-items:center;gap:10px}
.sec-prog{display:flex;align-items:center;gap:6px;margin-left:auto;flex-shrink:0}
.sec-prog-bar{width:80px;height:6px;border-radius:3px;background:rgba(0,0,0,.07);overflow:hidden}
.sec-prog-fill{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .35s ease}
.sec-prog-count{font-size:12px;color:var(--text-tertiary);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.section-subtitle{font-size:13px;color:var(--text-secondary);margin-bottom:16px;margin-top:-10px}

/* Content Card */
.content-card{
  background:var(--card-bg);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow-sm);margin-bottom:14px;
}
.content-card h3{
  font-size:15px;font-weight:600;margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}
.content-card h3 .card-icon{font-size:18px}

/* Todo / Task Items */
.task-list{display:flex;flex-direction:column;gap:8px}
.task-item{
  display:flex;flex-direction:column;gap:8px;
  padding:12px 14px;border-radius:var(--radius-sm);
  border:1px solid var(--border);transition:all var(--transition);
}
.task-item:hover{border-color:var(--text-tertiary)}
.task-item.done .task-title{text-decoration:line-through;color:var(--text-tertiary)}
.task-header{display:flex;align-items:center;gap:10px}
.task-checkbox{
  width:20px;height:20px;border-radius:50%;border:2px solid var(--text-tertiary);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:all var(--transition);font-size:11px;color:transparent;
}
.task-checkbox.checked{background:var(--green);border-color:var(--green);color:#fff}
.learn-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--text-tertiary);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:transparent;cursor:pointer;transition:all var(--transition);user-select:none}
.learn-check.checked{background:var(--accent);border-color:var(--accent);color:#fff}
.python-plan-item .learn-check{margin-left:auto;margin-top:2px}
.learn-card-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.task-title{flex:1;font-size:14px;line-height:1.5}
.task-review{
  font-size:13px;color:var(--text-secondary);padding:8px 10px;
  background:var(--bg);border-radius:8px;border:none;width:100%;
  outline:none;resize:none;min-height:36px;margin-top:4px;
}
.task-review:focus{background:#fff;box-shadow:inset 0 0 0 1px var(--blue)}
.task-review::placeholder{color:var(--text-tertiary)}
.task-actions{display:flex;gap:8px;align-self:flex-end}
.task-btn{
  font-size:12px;color:var(--text-secondary);padding:4px 10px;
  border-radius:6px;transition:all var(--transition);
}
.task-btn:hover{background:var(--bg);color:var(--text)}
.task-btn.danger:hover{color:var(--red)}
.add-task-row{
  display:flex;gap:8px;margin-top:8px;
}
.add-task-row input{
  flex:1;padding:10px 14px;border:1.5px dashed var(--border);
  border-radius:var(--radius-sm);font-size:14px;outline:none;
  transition:all var(--transition);
}
.add-task-row input:focus{border-color:var(--blue);border-style:solid}
.add-task-row button{
  padding:10px 16px;background:var(--accent);color:#fff;
  border-radius:var(--radius-sm);font-size:13px;font-weight:500;
}

/* Life Section */
.health-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.health-input-card{
  background:var(--card-bg);border-radius:var(--radius-sm);
  padding:14px;box-shadow:var(--shadow-sm);
}
.health-input-card label{
  font-size:12px;color:var(--text-secondary);font-weight:500;
  display:block;margin-bottom:6px;
}
.health-input-card input,.health-input-card select{
  width:100%;padding:8px 10px;border:1px solid var(--border);
  border-radius:8px;font-size:14px;outline:none;
}
.health-input-card input:focus{border-color:var(--blue)}
.chart-tabs{display:flex;gap:6px;margin-bottom:12px}
.chart-tab{
  padding:6px 16px;border-radius:20px;font-size:12px;font-weight:500;
  color:var(--text-secondary);background:var(--bg);
  transition:all var(--transition);
}
.chart-tab.active{background:var(--accent);color:#fff}
.chart-wrap{background:var(--card-bg);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);margin-bottom:14px}
.chart-wrap canvas{max-height:260px}
@media(max-width:560px){.chart-wrap canvas{max-height:200px}}

/* Tips Cards */
.tips-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tip-card{
  background:var(--card-bg);border-radius:var(--radius-sm);
  padding:16px;box-shadow:var(--shadow-sm);
  border-left:3px solid var(--purple);
}
.tip-card h4{font-size:13px;font-weight:600;margin-bottom:6px;color:var(--accent)}
.tip-card p{font-size:12px;color:var(--text-secondary);line-height:1.6}
.tip-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.tip-head h4{flex:1}
.fav-btn{flex-shrink:0;background:none;border:none;font-size:16px;cursor:pointer;color:var(--text-tertiary);padding:0;line-height:1;transition:transform .15s}
.fav-btn:hover{transform:scale(1.2)}
.fav-btn.on{color:#f5a623}
.fav-inline{font-size:13px;padding:3px 8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);cursor:pointer;color:var(--text-tertiary);white-space:nowrap}
.fav-inline:hover{border-color:#f5a623;color:#f5a623}
.fav-inline.on{background:#fff8e8;border-color:#f5a623;color:#f5a623}
.fav-card{background:linear-gradient(135deg,#fffdf5,#fff9ea);border:1px solid #f0d860;border-radius:var(--radius);padding:18px;margin-top:16px}
.fav-card h3{font-size:15px;font-weight:800;color:#b8860b;margin-bottom:12px}
.fav-empty{text-align:center;color:var(--text-tertiary);font-size:13px;padding:16px 0}
.fav-group{margin-bottom:12px}
.fav-group-title{font-size:12px;font-weight:700;color:#b8860b;margin-bottom:6px}
.fav-item{display:flex;align-items:flex-start;gap:8px;background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:6px;box-shadow:var(--shadow-sm)}
.fav-item-body{flex:1;min-width:0}
.fav-item-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
.fav-item-text{font-size:12px;color:var(--text-secondary);line-height:1.5;max-height:60px;overflow:hidden;position:relative}
.fav-item-text::after{content:'';position:absolute;bottom:0;left:0;right:0;height:16px;background:linear-gradient(transparent,#fff)}
.fav-item-del{flex-shrink:0;background:none;border:none;font-size:16px;color:var(--text-tertiary);cursor:pointer;padding:0 4px}
.fav-item-del:hover{color:#e74c3c}

/* 姨妈周期追踪 */
.period-tracker{margin-top:4px}
.period-add-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.period-date-input{padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:#fff}
.period-note-input{flex:1;min-width:100px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:#fff}
.period-add-btn{padding:7px 16px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.period-table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border)}
.period-table{width:100%;border-collapse:collapse;font-size:12px}
.period-table th{background:var(--bg-alt);padding:8px 10px;text-align:left;font-weight:600;color:var(--text-secondary);white-space:nowrap}
.period-table td{padding:7px 10px;border-top:1px solid var(--border)}
.mini-del-btn{background:none;border:none;color:var(--text-tertiary);cursor:pointer;font-size:14px;padding:0 4px}
.mini-del-btn:hover{color:#e74c3c}
.phase-info{margin-top:14px}
.phase-empty{text-align:center;color:var(--text-tertiary);font-size:12px;padding:14px 8px;line-height:1.8;background:var(--bg-alt);border-radius:10px}
.phase-current{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:2px solid;flex-wrap:wrap}
.phase-current-icon{font-size:28px}
.phase-current-text{flex:1;min-width:120px}
.phase-current-name{font-size:15px;font-weight:700;color:var(--text)}
.phase-current-desc{font-size:12px;color:var(--text-secondary);margin-top:2px;line-height:1.5}
.phase-bars{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.phase-bar{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);min-width:56px;opacity:.5;transition:opacity .2s}
.phase-bar.current{opacity:1;background:#fff;box-shadow:var(--shadow-sm)}
.phase-bar-icon{font-size:18px}
.phase-bar-name{font-size:11px;font-weight:600;color:var(--text)}
.phase-bar-days{font-size:10px;color:var(--text-tertiary)}
.phase-next{margin-top:8px;font-size:12px;color:var(--text-secondary);text-align:center}
.phase-tip-group{margin-bottom:14px}
.phase-tip-group-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px}

/* Mood */
.mood-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.mood-chip{
  font-size:13px;padding:8px 14px;border-radius:18px;cursor:pointer;
  border:1px solid var(--border);background:var(--bg);color:var(--text-secondary);
  font-family:inherit;transition:all .15s;
}
.mood-chip:hover{border-color:var(--accent)}
.mood-chip.active{background:rgba(175,82,222,.12);border-color:var(--accent);color:var(--accent);font-weight:600}
.mood-song-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mood-input,.mood-textarea{
  width:100%;padding:9px 12px;border:1px solid var(--border);
  border-radius:var(--radius-sm);font-size:13px;background:var(--bg);
  color:var(--text-primary);font-family:inherit;box-sizing:border-box;
}
.mood-input:focus,.mood-textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(175,82,222,.12)}
.mood-textarea{resize:vertical;min-height:70px;line-height:1.5;margin-top:12px}
.mood-display{display:flex;align-items:center;gap:12px;margin-top:6px}
.mood-emoji{font-size:42px;line-height:1}
.mood-label{font-size:20px;font-weight:700;color:var(--text-primary)}
.mood-song{font-size:13px;color:var(--text-secondary);margin-top:10px}
.mood-note{font-size:13px;color:var(--text-secondary);line-height:1.7;margin-top:10px;white-space:pre-wrap}
.mood-edit-box{margin-top:12px;padding-top:12px;border-top:1px dashed #ecd6e3;}
@media(max-width:768px){ .mood-song-row{grid-template-columns:1fr} }

/* Mental Health science card */
.mh-fact{display:flex;gap:14px;align-items:flex-start;background:#fff;border-radius:12px;padding:14px;margin-top:4px;border-top:3px solid #5ac8fa}
.mh-emoji{font-size:34px;line-height:1;flex-shrink:0;width:42px;text-align:center}
.mh-main{flex:1;min-width:0}
.mh-title{font-size:15px;font-weight:700;color:var(--text-primary);margin-bottom:6px;letter-spacing:-0.2px}
.mh-body{font-size:13px;line-height:1.75;color:var(--text-secondary)}
.mh-action{margin-top:12px;background:rgba(90,200,250,.12);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.7;color:var(--text-secondary)}
.mh-action-label{display:block;font-weight:700;color:#1aa3c8;margin-bottom:3px;font-size:12px}

/* Tree Hole board */
.treehole-box{margin-top:6px;background:#fff;border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.85;color:var(--text-primary);white-space:pre-wrap;border:1px solid rgba(124,92,255,.18);box-shadow:0 1px 3px rgba(124,92,255,.06)}
.th-hist{margin-top:14px;border-top:1px dashed rgba(124,92,255,.25);padding-top:10px}
.th-hist>summary{cursor:pointer;font-size:13px;font-weight:600;color:#7c5cff;list-style:none;user-select:none}
.th-hist>summary::-webkit-details-marker{display:none}
.th-hist>summary::before{content:'▸ ';font-size:11px}
.th-hist[open]>summary::before{content:'▾ '}
.th-hist-item{margin-top:10px;padding:10px 12px;background:#fff;border-radius:10px;border:1px solid rgba(124,92,255,.15)}
.th-hist-date{font-size:11px;color:var(--text-tertiary);margin-bottom:4px}
.th-hist-content{font-size:13px;line-height:1.75;color:var(--text-primary);white-space:pre-wrap}

/* shared mini edit button */
.mini-edit-btn{
  float:right;font-size:11px;font-weight:500;color:var(--accent);
  background:rgba(175,82,222,.08);border:1px solid rgba(175,82,222,.2);
  border-radius:14px;padding:3px 10px;cursor:pointer;margin-top:2px;
}
.mini-edit-btn:hover{background:rgba(175,82,222,.16)}

/* Emotion Section */
.emotion-input-row{
  display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px;
}
.emotion-slider{flex:1;min-width:200px}
.emotion-slider label{font-size:12px;color:var(--text-secondary);display:block;margin-bottom:6px}
.emotion-slider input[type=range]{
  width:100%;-webkit-appearance:none;height:6px;border-radius:3px;
  background:linear-gradient(to right,var(--red),var(--orange),var(--teal),var(--green));
  outline:none;
}
.emotion-slider input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:28px;height:28px;border-radius:50%;
  background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer;
}
.emotion-value{
  font-size:28px;font-weight:700;min-width:40px;text-align:center;
}
.emotion-note{flex:1;min-width:200px}
.emotion-note label{font-size:12px;color:var(--text-secondary);display:block;margin-bottom:6px}
.emotion-note input{
  width:100%;padding:10px 14px;border:1px solid var(--border);
  border-radius:8px;font-size:14px;outline:none;
}
.emotion-note input:focus{border-color:var(--blue)}
.emotion-btn{
  padding:10px 20px;background:var(--accent);color:#fff;
  border-radius:var(--radius-sm);font-size:14px;font-weight:500;
  white-space:nowrap;
}
.md-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px;}
.md-label{font-size:14px;font-weight:500;color:var(--text-primary);}
.md-status{font-size:12.5px;color:var(--text-secondary);margin-top:10px;line-height:1.5;}

/* Hotspots Section */
.news-category{margin-bottom:20px}
.news-category h3{
  font-size:15px;font-weight:600;margin-bottom:10px;
  display:flex;align-items:center;gap:8px;
}
.news-item{
  background:var(--card-bg);border-radius:var(--radius-sm);
  padding:14px 16px;margin-bottom:8px;box-shadow:var(--shadow-sm);
}
.news-item h4{font-size:14px;font-weight:600;margin-bottom:4px;line-height:1.4}
.news-item .news-meta{font-size:11px;color:var(--text-tertiary);margin-bottom:6px}
.news-item .news-analysis{font-size:13px;color:var(--text-secondary);line-height:1.6}
.add-news-row{display:flex;gap:8px;margin-top:8px}
.add-news-row input,.add-news-row textarea{
  flex:1;padding:8px 10px;border:1.5px dashed var(--border);
  border-radius:8px;font-size:13px;outline:none;
}
.add-news-row input:focus,.add-news-row textarea:focus{border-color:var(--blue);border-style:solid}
.add-news-row select{
  padding:8px 10px;border:1px solid var(--border);border-radius:8px;
  font-size:13px;background:#fff;outline:none;
}
.cat-desc{font-size:11px;font-weight:400;color:var(--text-tertiary);margin-left:8px}
.cat-count{font-size:12px;color:var(--text-tertiary);float:right;margin-top:-20px}
.news-region-label{margin:6px 0 4px}
.region-tag{
  display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:600;
}
.region-tag.region-cn{background:#e8f4fd;color:#1a6fb5}
.region-tag.region-intl{background:#fef3e2;color:#b87514}
.btn-add-news{
  padding:8px 16px;background:var(--accent);color:#fff;border-radius:8px;font-size:13px;
  white-space:nowrap;
}
.news-textarea{
  width:100%;margin-top:6px;padding:8px;border:1px solid var(--border);
  border-radius:8px;font-size:13px;min-height:50px;resize:vertical;
}

/* --- News Feed & Papers --- */
.news-date-group{margin-bottom:16px}
.news-date-header{
  font-size:13px;font-weight:600;color:var(--accent);
  padding:6px 0;border-bottom:1px solid var(--border);margin-bottom:8px;
}
.news-source-label{
  font-size:11px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;
  letter-spacing:.5px;margin:6px 0 4px;
}
.news-item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.news-item-top h4{flex:1;margin-bottom:2px}
.news-item-top h4 a{color:var(--text);text-decoration:none;border-bottom:1px solid transparent;transition:border-color var(--transition)}
.news-item-top h4 a:hover{border-bottom-color:var(--blue);color:var(--blue)}
.add-panel{
  background:var(--bg);border-radius:var(--radius-sm);padding:12px 14px;margin-top:8px;
}
.add-panel h4{font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text-secondary)}
.add-panel select{
  padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:#fff;
}
.paper-item{border-left:3px solid var(--blue);padding-left:12px}
.paper-meta{font-size:11px;color:var(--text-tertiary);margin-bottom:4px}

/* --- News Toolbar & Daily Report --- */
.news-toolbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:0 0 16px;flex-wrap:wrap;
}
.news-toolbar-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.news-view-toggle{
  display:flex;border-radius:8px;overflow:hidden;border:1px solid var(--border);
}
.news-view-btn{
  padding:7px 14px;font-size:12px;font-weight:500;color:var(--text-secondary);
  background:var(--card-bg);transition:all var(--transition);white-space:nowrap;
}
.news-view-btn.active{background:var(--accent);color:#fff}
.news-view-btn:not(.active):hover{background:var(--bg)}
.news-refresh-btn{
  padding:7px 14px;font-size:12px;font-weight:500;border-radius:8px;
  background:var(--blue);color:#fff;transition:all var(--transition);white-space:nowrap;
}
.news-refresh-btn:hover{opacity:.85}
.news-refresh-btn:active{transform:scale(.96)}
.update-status{
  font-size:11px;color:var(--text-tertiary);display:flex;align-items:center;gap:4px;
}
.update-status .dot{
  width:6px;height:6px;border-radius:50%;background:var(--green);
  display:inline-block;
}
.update-status .dot.old{background:var(--orange)}
.update-status .dot.auto{background:var(--blue)}
.news-toolbar-right{
  display:flex;align-items:center;gap:8px;
}
/* Daily Report View */
.daily-report{border-top:1px solid var(--border);padding-top:16px}
.daily-report-header{
  text-align:center;padding:20px 0;border-bottom:2px solid var(--accent);margin-bottom:20px;
}
.daily-report-header h2{font-size:22px;font-weight:700;letter-spacing:1px;color:var(--accent)}
.daily-report-header .report-date{font-size:13px;color:var(--text-tertiary);margin-top:4px}
.daily-report-header .report-subtitle{font-size:12px;color:var(--text-tertiary);margin-top:2px}
.daily-report-article{
  background:var(--card-bg);border-radius:var(--radius);padding:18px 20px;
  margin-bottom:12px;box-shadow:var(--shadow-sm);
  border-left:4px solid var(--accent);
}
.daily-report-article .article-cat{
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;
  color:var(--text-tertiary);margin-bottom:4px;
  display:flex;align-items:center;gap:6px;
}
.daily-report-article h3{
  font-size:16px;font-weight:700;line-height:1.5;margin-bottom:6px;color:var(--text);
}
.daily-report-article .article-source{
  font-size:11px;color:var(--text-tertiary);margin-bottom:10px;
}
.daily-report-article .article-source a{color:var(--blue);text-decoration:none}
.daily-report-article .article-body{
  font-size:14px;line-height:1.8;color:var(--text-secondary);
  white-space:pre-wrap;
}
.daily-cat-block{margin-bottom:6px}
.daily-cat-title{
  font-size:17px;font-weight:700;color:var(--text);
  margin:20px 0 10px;padding-left:12px;border-left:4px solid var(--accent);
}
.daily-cat-block .news-region-label{margin:10px 0 6px}
.daily-report .no-report{
  text-align:center;padding:50px 20px;color:var(--text-tertiary);
}
.daily-report .no-report .empty-icon{font-size:48px;margin-bottom:12px}
/* Full text expand in list view */
.news-fulltext-toggle{
  font-size:11px;color:var(--blue);cursor:pointer;margin-top:6px;
  display:inline-block;font-weight:500;
}
.news-fulltext-toggle:hover{text-decoration:underline}
.news-fulltext-body{
  font-size:13px;line-height:1.7;color:var(--text-secondary);
  margin-top:8px;padding:10px 12px;background:var(--bg);
  border-radius:8px;display:none;white-space:pre-wrap;
  max-height:300px;overflow-y:auto;
}
.news-fulltext-body.show{display:block}

/* Auto-badge */
.auto-badge{
  display:inline-flex;align-items:center;gap:3px;padding:2px 8px;
  border-radius:10px;font-size:10px;font-weight:600;
}
.auto-badge.news-badge{background:#e8f4fd;color:#1a6fb5}
.auto-badge.paper-badge{background:#f0e6f6;color:#7b2d8e}

/* Review Section */
.review-block{margin-bottom:16px}
.review-block h3{
  font-size:15px;font-weight:600;margin-bottom:10px;
  display:flex;align-items:center;gap:8px;
}
.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.review-box{
  background:var(--card-bg);border-radius:var(--radius-sm);
  padding:14px;box-shadow:var(--shadow-sm);
}
.review-box.good{border-left:3px solid var(--green)}
.review-box.improve{border-left:3px solid var(--orange)}
.review-box h4{font-size:13px;font-weight:600;margin-bottom:8px}
.review-box textarea{
  width:100%;min-height:70px;border:none;outline:none;font-size:13px;
  resize:vertical;color:var(--text);background:transparent;
}
.review-box textarea::placeholder{color:var(--text-tertiary)}

.fab:active{transform:scale(.96)}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.4);
  z-index:300;display:none;align-items:flex-end;
  justify-content:center;
}
.modal-overlay.show{display:flex}
.modal-sheet{
  background:var(--card-bg);width:100%;max-width:500px;
  border-radius:20px 20px 0 0;padding:20px 20px 34px;
  animation:slideUp 0.3s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-sheet h3{font-size:17px;font-weight:600;margin-bottom:14px}
.modal-sheet textarea{
  width:100%;min-height:100px;border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:12px;font-size:14px;
  outline:none;resize:vertical;
}
.modal-sheet textarea:focus{border-color:var(--blue)}
.modal-actions{display:flex;gap:10px;margin-top:14px;justify-content:flex-end}
.modal-actions button{
  padding:10px 22px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;
}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{color:var(--text-secondary)}

/* Book Library */
.lib-card{margin-top:14px}
.lib-badge{font-size:10px;font-weight:500;color:var(--accent);background:rgba(0,113,227,.08);padding:2px 8px;border-radius:10px;vertical-align:middle}
.lib-chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.lib-chip{padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg);font-size:12px;color:var(--text-secondary);cursor:pointer;transition:.2s;white-space:nowrap}
.lib-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.lib-book{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.lib-book-cat{font-size:10px;color:var(--text-tertiary);background:var(--card-bg);align-self:flex-start;padding:1px 8px;border-radius:10px;border:1px solid var(--border)}
.lib-book-title{font-size:13px;font-weight:600;line-height:1.4;color:var(--text)}
.lib-book-author{font-size:11px;color:var(--text-tertiary);margin-bottom:4px}
.lib-book-actions{display:flex;gap:6px;margin-top:auto}
.lib-btn{flex:1;padding:6px 0;border-radius:8px;border:1px solid var(--border);background:var(--card-bg);font-size:11px;cursor:pointer;color:var(--text);transition:.2s}
.lib-btn.read{background:var(--accent);color:#fff;border-color:var(--accent)}
.lib-btn:hover{opacity:.9}
.lib-btn.added{color:var(--green);border-color:var(--green);cursor:default}
.lib-btn:disabled{cursor:default}
/* Library detail modal */
.lib-detail-head{position:relative;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:12px}
.lib-close{position:absolute;top:-8px;right:-8px;width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--card-bg);font-size:18px;line-height:1;cursor:pointer;color:var(--text-secondary)}
.lib-detail-cat{display:inline-block;font-size:10px;color:var(--accent);background:rgba(0,113,227,.08);padding:2px 10px;border-radius:10px;margin-bottom:6px}
.lib-detail-title{font-size:18px;font-weight:700;margin:0 0 4px;color:var(--text)}
.lib-detail-author{font-size:13px;color:var(--text-tertiary)}
.lib-detail-section{margin-bottom:12px}
.lib-detail-section h5{font-size:13px;margin:0 0 4px;color:var(--text)}
.lib-detail-section p{font-size:13px;line-height:1.7;color:var(--text-secondary);margin:0}
.lib-detail-quote{background:var(--bg);border-left:3px solid var(--accent);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13px;line-height:1.7;color:var(--text);font-style:italic;margin-bottom:14px}

/* Empty State */
.empty-state{
  text-align:center;padding:40px 20px;color:var(--text-tertiary);
}
.empty-state .empty-icon{font-size:40px;margin-bottom:10px}
.empty-state p{font-size:14px}

/* Learning Daily Cards */
.learn-daily-grid{display:flex;flex-direction:column;gap:14px;margin-bottom:20px}
.learn-card{
  background:var(--card-bg);border-radius:var(--radius);
  padding:18px 20px;box-shadow:var(--shadow-sm);
  transition:all var(--transition);
}
.learn-card-header{
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
}
.learn-card-header h3{
  font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;
}
.learn-card-header .learn-expand{
  font-size:14px;color:var(--text-tertiary);transition:transform .3s;
}
.learn-card.expanded .learn-expand{transform:rotate(180deg)}
.learn-card-body{
  display:none;padding-top:14px;border-top:1px solid var(--border);margin-top:14px;
}
.learn-card.expanded .learn-card-body{display:block}
.learn-card-meta{
  font-size:11px;color:var(--text-tertiary);margin-top:2px;display:flex;align-items:center;gap:6px;
}
.learn-badge{
  display:inline-flex;align-items:center;gap:3px;padding:2px 10px;border-radius:10px;
  font-size:10px;font-weight:600;
}
.learn-badge.python{background:#e8f4fd;color:#1a6fb5}
.learn-badge.paper{background:#f0e6f6;color:#7b2d8e}
.learn-badge.english{background:#fef3e2;color:#b87514}

/* Python Plan */
.python-plan-list{display:flex;flex-direction:column;gap:10px}
.python-plan-item{
  display:flex;align-items:flex-start;gap:12px;padding:10px 12px;
  background:var(--bg);border-radius:10px;transition:all var(--transition);
}
.python-plan-num{
  width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;flex-shrink:0;
}
.python-plan-info{flex:1}
.python-plan-info .pp-title{font-size:13px;font-weight:600;margin-bottom:2px}
.python-plan-info .pp-desc{font-size:12px;color:var(--text-secondary);line-height:1.5}
.python-plan-duration{
  font-size:12px;color:var(--text-tertiary);white-space:nowrap;
  display:flex;align-items:center;gap:3px;
}
.python-plan-duration::before{content:'⏱'}
.python-code-block{
  background:#1e1e2e;color:#cdd6f4;border-radius:10px;padding:14px 16px;
  font-family:'SF Mono','Cascadia Code','Consolas',monospace;
  font-size:12px;line-height:1.6;overflow-x:auto;margin-top:8px;
  white-space:pre-wrap;word-break:break-all;
}

/* Paper Study Card */
.paper-study-header{margin-bottom:12px}
.paper-study-header .paper-title{
  font-size:14px;font-weight:700;line-height:1.5;margin-bottom:4px;
}
.paper-study-header .paper-meta-row{
  font-size:11px;color:var(--text-tertiary);display:flex;gap:12px;flex-wrap:wrap;
}
.paper-study-section{margin-bottom:14px}
.paper-study-section h4{
  font-size:13px;font-weight:600;margin-bottom:6px;color:var(--accent);
}
.paper-study-section p{
  font-size:13px;line-height:1.7;color:var(--text-secondary);
}
.paper-study-section ul{
  list-style:disc;padding-left:18px;font-size:13px;line-height:1.8;color:var(--text-secondary);
}

/* IELTS Speaking Card */
.ielts-study-section{margin-bottom:16px}
.ielts-study-section h4{
  font-size:13px;font-weight:600;margin-bottom:8px;color:var(--accent);display:flex;align-items:center;gap:6px;
}
.ielts-study-section .part-badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;
  font-size:10px;font-weight:700;flex-shrink:0;
}
.ielts-study-section .part-badge.p1{background:#e8f4fd;color:#1a6fb5}
.ielts-study-section .part-badge.p2{background:#fef3e2;color:#b87514}
.ielts-study-section .part-badge.p3{background:#f0e6f6;color:#7b2d8e}
.ielts-question-card{
  background:var(--bg);border-radius:10px;padding:12px 14px;
  margin-bottom:10px;border-left:3px solid var(--border);
}
.ielts-question-card .q-text{
  font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:6px;line-height:1.6;
}
.ielts-question-card .q-model{
  font-size:12px;color:var(--text-secondary);line-height:1.8;
  background:#f8f9fc;border-radius:8px;padding:10px 12px;margin-top:6px;
}
.ielts-question-card .q-model .model-label{
  font-size:10px;font-weight:700;color:var(--accent);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px;
}
.ielts-vocab-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
}
.ielts-vocab-item{
  display:flex;align-items:center;gap:8px;padding:6px 10px;
  background:var(--bg);border-radius:8px;font-size:12px;
}
.ielts-vocab-item .v-en{font-weight:600;color:var(--accent);flex-shrink:0}
.ielts-vocab-item .v-cn{color:var(--text-secondary)}
.ielts-tips-box{
  background:#fffdf5;border:1px solid #f0e4b0;border-radius:10px;padding:12px 14px;
}
.ielts-tips-box ul{
  list-style:none;padding:0;font-size:12px;line-height:1.8;color:var(--text-secondary);
}
.ielts-tips-box ul li::before{content:'✦ ';color:#b87514;font-size:10px}
.speak-btn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;line-height:1;opacity:.6;transition:opacity .15s,transform .1s;flex-shrink:0;user-select:none;padding:1px 3px;border-radius:5px}
.speak-btn:hover{opacity:1;background:rgba(0,113,227,.08)}
.speak-btn:active{transform:scale(.9)}
.ielts-vocab-item .speak-btn{margin-right:2px}

/* Section subtitle */
.section-subtitle{
  font-size:12px;color:var(--text-tertiary);margin:-8px 0 16px;
}

/* Work Section */
.work-section .content-card p{color:var(--text-secondary);font-size:14px}

/* Responsive */
@media(max-width:768px){
  .content-area{padding:0 16px calc(70px + env(safe-area-inset-bottom) + 16px)}
  .review-grid{grid-template-columns:1fr}
  .health-grid{grid-template-columns:repeat(2,1fr)}
  .news-toolbar{flex-direction:column;align-items:stretch}
  .news-toolbar-right{align-self:flex-end}
  .ov-grid{grid-template-columns:repeat(4,1fr);gap:8px}
  .ck-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:400px){
  .health-grid{grid-template-columns:1fr 1fr}
  .emotion-input-row{flex-direction:column}
  .news-view-btn{padding:6px 10px;font-size:11px}
  .daily-report-article{padding:12px 14px}
  .daily-report-article h3{font-size:14px}
}

/* ===== 首页：手账封面（日期/星期/天气） ===== */

.jc-welcome{position:relative;z-index:1;margin-top:14px;font-size:18px;font-weight:800;color:var(--lotus-deep);letter-spacing:.5px;line-height:1.4}

/* ===== 首页：分区概览 ===== */
.journal-section{margin:18px 0}

/* ===== 首页：今日打卡 / 进度图 卡片通用 ===== */

.chart-note{font-size:12px;color:var(--text-tertiary);text-align:center;margin-top:8px}

.recruit-stats{font-size:13px;font-weight:600;color:var(--text-secondary);background:rgba(255,149,0,.1);border-radius:10px;padding:8px 12px;margin-bottom:12px}

.recruit-job{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:#fff}

.plog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.plog-item{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1/1;background:var(--bg);cursor:pointer}

@media(max-width:768px){

.recruit-card{border-left:4px solid #ff9500}

.book-add-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}

function ensureNewsSeeds(){

  const userItems = DATA.newsFeed.filter(n=>!String(n.id||'').startsWith('s_n'));
  DATA.newsFeed = userItems.concat(NEWS_SEED_FEED.map(x=>({...x})));
  saveData(DATA);
}

const NEWS_SEED_FEED = [
    // === 每日时政 - 国内重点（排序第一，每日更新）===
    {id:'s_n23',title:'《新型电力系统建设"十五五"规划》发布：到2030年初步建成新型电力系统',category:'每日时政',region:'国内',url:'https://ysxw.cctv.cn/article.html?toc_style_id=feeds_default&item_id=12070437638248267253',summary:'国家发改委、国家能源局联合印发规划，明确非化石能源发电量占比达50%、新型储能规模达3亿千瓦，首次提出"主配微协同"新型电网架构，部署40余项举措。',fullText:'国家发展改革委、国家能源局于8月3日联合印发《新型电力系统建设"十五五"规划》，这是我国首个系统部署新型电力系统建设的五年专项规划。\n\n规划明确提出到2030年初步建成新型电力系统的战略目标，关键指标包括：非化石能源发电量占比达到50%，全国新型储能规模达到3亿千瓦，实现28亿千瓦以上新能源高水平消纳。规划首次系统提出"主配微协同的新型电网"架构，将传统大电网与分布式微电网有机结合。\n\n在具体部署上，规划涵盖绿色低碳电力供给、电网智能化发展、用电侧协同、算电协同等方向，共部署40余项具体举措。其中新能源汽车充电基础设施升级、算力中心绿电直供等成为亮点。\n\n分析认为，该规划标志着我国电力系统从"规模扩张"转向"质量提升"新阶段，将为新能源产业链带来万亿级投资机遇，同时加速能源领域的数字化与智能化转型。',date:'2026-08-03',createdAt:'2026-08-03T08:00:00'},
    {id:'s_n24',title:'国务院公布新修订《集成电路布图设计保护条例》：20余年来首次系统性修订',category:'每日时政',region:'国内',url:'https://cbgc.scol.com.cn/news/7820170',summary:'新修订条例自2026年10月15日起施行，扩展保护范围、完善申请登记程序、加大侵权赔偿力度，同时完善驳回与撤销程序、增加权利恢复程序。',fullText:'国务院近日正式公布新修订的《集成电路布图设计保护条例》，这是该条例自2001年颁布以来20多年来的首次系统性修订，将于2026年10月15日起施行。\n\n修订内容主要涉及三大方面：一是扩展保护范围，将新型半导体器件布图设计纳入保护对象，适应先进制程技术发展需求；二是完善申请登记程序，简化电子申请流程，明确审查时限要求，提升确权效率；三是加大侵权赔偿力度，引入惩罚性赔偿机制，法定赔偿上限大幅提高，同时完善驳回与撤销程序、增加权利恢复程序。\n\n工信部相关负责人表示，此次修订是我国集成电路领域知识产权保护的里程碑事件。在全球芯片竞争日趋激烈的背景下，完善布图设计保护制度将有效激发企业创新积极性，促进集成电路产业高质量发展。\n\n业内分析认为，我国集成电路布图设计年登记量已突破2万件，位居全球前列。修订后的条例将为我国芯片设计企业提供更强有力的法律保障，有望推动国产芯片产业加速追赶。',date:'2026-08-03',createdAt:'2026-08-03T08:00:00'},
    {id:'s_n30',title:'央行定调下半年货币政策：继续实施适度宽松，谋划增量政策举措',category:'每日时政',region:'国内',url:'https://gu.qq.com/resources/shy/news/detail-v2/index.html?t=1#/index?id=SN202608030125239729ea7f',summary:'央行下半年工作会议明确：综合运用并适时调整货币政策工具保持流动性充裕，及时谋划出台务实管用的增量政策，加力扩大内需优化供给，推动经济持续向新向优向好发展。',fullText:'中国人民银行8月1日召开2026年下半年工作会议，系统部署下半年重点工作。会议强调，继续实施好适度宽松的货币政策，充分发挥各项存量政策效能，及时谋划出台务实管用的增量政策。\n\n会议明确，将综合运用并适时调整货币政策工具，保持流动性充裕，引导金融机构增强信贷投放均衡性，使社会融资规模、货币供应量增长同经济增长和价格总水平预期目标相匹配。\n\n在金融服务实体经济方面，会议提出将用好各项结构性货币政策工具，加强与地方财政、产业部门协同。高质量建设债券市场"科技板"，稳妥实施科技创新与民营企业债券风险分担工具。6月末金融"五篇大文章"贷款同比增长11%，明显高于全部贷款增速。\n\n此外，央行表示将支持和便利更多境外机构参与熊猫债发行，支持上海提升跨境金融服务能力，巩固香港离岸人民币业务枢纽地位。分析认为，下半年央行将维持偏宽松的政策基调，降准降息仍有一定空间。',date:'2026-08-01',createdAt:'2026-08-01T08:00:00'},
    // === 时政文章 - 人民日报 / 半月谈 时评（精读）===
    {id:'s_n25',title:'人民日报：加快建设统一开放的交通运输市场',category:'时政文章',region:'国内',url:'https://new.qq.com/rain/a/20260804A04HGA00',summary:'交通运输部等四部门联合印发实施方案，聚焦基础设施联通不足、运输服务融合不够等六大突出问题，推进市场制度规则衔接与资源要素共享，为全国统一大市场建设提供交通支撑。',fullText:'人民日报8月4日刊发报道，近日交通运输部等四部门联合印发《交通运输纵深推进全国统一大市场建设实施方案》，旨在解决基础设施联通不足、运输服务融合不够、制度规则标准不一、资源要素共享不够等突出问题。\n\n方案提出六大重点任务：一是推进市场制度规则衔接，完善交通运输市场准入退出制度，着力整治行业低价无序竞争，推进交通运输政务服务"跨省通办"；二是推进市场基础设施联通，建设现代化高质量国家综合立体交通网，大力发展多式联运；三是推进政府行为尺度统一，着力整治行业招标投标领域突出问题。\n\n方案还明确推进市场监管执法协同，推动交通运输执法标准统一，加强对交通运输平台企业监管；推进市场要素共享，促进综合交通运输数据共享开放；推进市场对内对外开放，积极扩大交通运输领域消费市场，鼓励民营等社会资本参与交通基础设施建设。\n\n评论指出，交通是经济的"大动脉"，统一开放的交通运输市场将有效降低全社会物流成本，畅通国内大循环，为全国统一大市场建设提供坚实的交通运输服务保障。',date:'2026-08-04',createdAt:'2026-08-04T08:00:00'},
    {id:'s_n26',title:'新华社：习近平经济思想指引中国经济高质量发展行稳致远',category:'时政文章',region:'国内',url:'https://touzi.ningbo.gov.cn/col/col1229396854/art/2026/art_40623904d20d4146b06144926641879b.html',summary:'文章系统阐述新质生产力发展的制度保障与实践路径：从科技体制机制改革到法治保障、从高水平对外开放到民生关切，全景展现中国经济在创新驱动下的高质量发展新格局。',fullText:'新华社8月4日刊发长篇述评，系统阐述习近平经济思想指引下中国经济高质量发展的实践路径。文章从改革、法治、开放三个维度全景展现新质生产力加速发展的生动图景。\n\n改革维度，文章指出高效组织实施国家重大科技任务，强化企业主导的产学研用协同攻关，健全多元投入机制。安徽将中试验证纳入服务业政策支持范围，浙江迭代升级"民营经济32条"新增13条激发民间投资活力——各地因地制宜、逐新而行，厚植新质生产力生长的制度沃土。\n\n法治维度，十四届全国人大四次会议审议通过生态环境法典、民族团结进步促进法、国家发展规划法三部法律。出台《国务院关于产业链供应链安全的规定》，加快推进人工智能健康发展综合性立法，着手修订《公平竞争审查条例实施办法》。\n\n开放维度，上半年中国进出口规模历史同期首次突破25万亿元，集成电路、工业机器人、绿色产品成为出口新引擎。从倡议成立世界人工智能合作组织到推动气象智能预警方案"妈祖"在30个国家落地，中国始终致力于与全球共享创新成果。',date:'2026-08-04',createdAt:'2026-08-04T08:00:00'},
    // === 政治 - 国内 ===
    {id:'s_n1',title:'国家发改委明确下半年八项重点任务：加快AI标杆应用、推进AI法立法',category:'政治',region:'国内',url:'https://finance.sina.com.cn/roll/2026-08-04/doc-inimcatv5527981.shtml',summary:'发改委召开上半年发展改革形势通报会，部署下半年八项重点任务：加快建设现代化产业体系、深入实施"东数西算"工程、打造人工智能标杆应用、加快人工智能法立法进程。',fullText:'国家发展改革委近日召开2026年上半年发展改革形势通报会，明确下半年八项重点任务。会议指出，上半年经济社会发展主要目标任务进展顺利，下半年要加大宏观政策调控力度。\n\n在产业体系建设方面，会议提出加快建设现代化产业体系，深入实施"东数西算"工程，统筹布局算力设施。特别强调要加快打造一批人工智能标杆应用，在制造、农业、能源等重点行业加快赋能，推动人工智能与实体经济深度融合。\n\n在制度保障方面，明确将加快人工智能法立法进程，为AI产业健康发展提供法治保障。同时部署推进"十五五"规划编制前期工作，统筹发展与安全。\n\n此外，会议还涉及扩大内需、深化改革、高水平对外开放、区域协调发展、绿色低碳转型、保障改善民生等多项重点任务。分析认为，发改委此次政策部署释放出"稳增长+促创新"双轮驱动的明确信号，AI产业政策红利将持续释放。',date:'2026-08-03',createdAt:'2026-08-03T08:00:00'},
    {id:'s_n2',title:'国务院常务会议：部署新型电网和物流网建设，审议住房公积金管理条例修订',category:'政治',region:'国内',url:'https://c.m.163.com/news/a/L3D2UA2B05198CJN.html',summary:'李强主持国常会，听取新型电网、物流网建设情况汇报，要求高质量建设新型电网、加快推进物流网建设。审议通过住房公积金管理条例修订草案，拓宽提取和使用范围。',fullText:'国务院总理李强8月1日主持召开国务院常务会议，研究部署多项重大议题。会议听取新型电网、物流网建设情况汇报，审议通过《国务院关于修改〈住房公积金管理条例〉的决定（草案）》。\n\n会议指出，要高质量建设新型电网，加强统筹协调和政策支持，狠抓工程质量和安全生产，确保电网建设顺利推进。要加快推进物流网建设，增强枢纽节点、骨干通道功能，完善城乡末端配送体系，推动跨区域跨方式物流规则标准衔接，着力补短板、畅联通、提能级。\n\n住房公积金条例修订方面，明确要拓宽住房公积金提取和使用范围，扩大制度覆盖面，更好满足居民多样化住房消费需求。这是继2024年以来住房公积金制度又一次重大调整，旨在进一步发挥住房公积金的住房保障功能。\n\n分析认为，新型电网与物流网建设属于"两新一重"关键领域，将带动上下游产业链大规模投资。住房公积金提取范围拓宽将有效释放居民消费潜力，助力稳定房地产市场预期。',date:'2026-08-01',createdAt:'2026-08-01T18:00:00'},
    {id:'s_n3',title:'中广核太平岭核电2号机组投产：粤港澳大湾区首个"华龙一号"项目全面建成',category:'政治',region:'国内',url:'https://cbgc.scol.com.cn/news/7820170',summary:'中广核广东太平岭核电项目2号机组正式投产发电，标志着粤港澳大湾区首个"华龙一号"核电项目一期工程全面建成投产，为湾区提供稳定清洁能源供应。',fullText:'中广核广东太平岭核电项目2号机组于8月3日正式投产发电，标志着粤港澳大湾区首个"华龙一号"核电项目一期工程全面建成投产。这是我国自主三代核电技术"华龙一号"在大湾区的首次规模化应用。\n\n太平岭核电项目规划建设6台百万千瓦级核电机组，一期工程建设2台"华龙一号"机组。1号机组已于2025年投入商业运行，2号机组投产后，一期工程年发电量可达约180亿千瓦时，等效减排二氧化碳约1500万吨。\n\n"华龙一号"是我国具有完全自主知识产权的三代核电技术，设计寿命60年，采用"能动+非能动"双重安全系统，满足国际最高安全标准。目前"华龙一号"已在国内外批量建设，成为中国核电"走出去"的国家名片。\n\n业内分析指出，核电具有清洁、稳定、高效的优点，是构建新型电力系统的重要基荷电源。太平岭项目全面建成将有效缓解大湾区电力供应紧张，为区域绿色低碳发展提供可靠支撑。',date:'2026-08-03',createdAt:'2026-08-03T16:00:00'},
    {id:'s_n4',title:'2026年上半年海洋生产总值5.5万亿元 同比增长5.1%',category:'经济',region:'国内',url:'https://gzw.sc.gov.cn/scsgzw/CU2302010/2026/8/4/f8a16d1fba8a4d9f9d3856e3c2f4a749.shtml',summary:'自然资源部发布海洋经济运行情况：上半年海洋生产总值5.5万亿元，同比增长5.1%，高于GDP增速0.4个百分点，占GDP比重7.9%。海洋新兴产业发展强劲。',fullText:'自然资源部8月3日发布2026年上半年海洋经济运行情况。初步核算，上半年全国海洋生产总值5.5万亿元，同比增长5.1%，高于国内生产总值增速0.4个百分点，海洋生产总值占国内生产总值比重为7.9%。\n\n从产业结构看，海洋新兴产业增势强劲。海洋药物和生物制品业、海洋工程装备制造业、海洋可再生能源利用业等新兴产业增加值增速均超过10%。海水淡化规模化应用加速推进，海洋电力业保持较快增长。\n\n传统海洋产业也呈现积极变化。海洋渔业转型升级持续推进，深远海养殖产量同比增长15%；海洋船舶工业新接订单量位居全球首位，高端船型占比进一步提升；海洋交通运输业稳步恢复，沿海港口货物吞吐量同比增长5.8%。\n\n专家指出，海洋经济正成为国民经济新增长极。随着"海洋强国"战略深入推进，海洋生物医药、深海采矿、海洋碳汇等新赛道将为经济发展提供新的增量空间。',date:'2026-08-03',createdAt:'2026-08-03T10:00:00'},
    // === 政治 - 国外 ===
    {id:'s_n5',title:'特朗普同日先后会晤泽连斯基与内塔尼亚胡：美方"打包"应对两场冲突',category:'政治',region:'国外',url:'https://szb.ycfbapp.com/ycwb/pad/con/202608/01/content_112234.html',summary:'7月28日特朗普在同一天先后会见乌克兰总统和以色列总理，被认为是美方将俄乌冲突与中东问题"打包"处理的战略信号，背后有选举考量——民众对中东战事支持率不足三分之一。',fullText:'7月28日，华盛顿白宫呈现罕见外交场景：美国总统特朗普在同一天内先后会晤了以色列总理内塔尼亚胡和乌克兰总统泽连斯基。这种"一日两会"的安排在外交上并不常见，引发国际舆论高度关注。\n\n中国人民大学国家发展与战略研究院副院长刁大明分析认为，特朗普政府主动设置联动议程，表明其可能不再按区域分割处理危机，而是突出"交易思维"，将俄乌冲突与中东问题"打包"成一笔账，来计算美国的整体代价与收益。\n\n值得注意的是，两场会晤均为闭门进行，白宫统一用"积极且富有成效"形容，但未透露任何细节。分析认为，这种信息管控本身也是一种信号：美方不希望过早暴露谈判底牌，意图保留在两场冲突之间灵活腾挪的空间。\n\n从选举角度看，当前美国民众对中东战事支持率不足三分之一，共和党内部支持度持续下滑。战事长期化推高通胀、增加民众生活成本，成为选举负面拖累。特朗普政府主观上希望向选民展示其能掌控两场战争、拥有结束冲突的时间表。',date:'2026-07-28',createdAt:'2026-07-28T16:00:00'},
    {id:'s_n6',title:'乌克兰袭击伊朗商船：俄乌与中东两场冲突首次出现地理交叉',category:'政治',region:'国外',url:'https://www.sohu.com/a/1058356014_162522',summary:'乌克兰出动远程无人机在里海水域袭击伊朗商船致船员伤亡，泽连斯基称乌克兰与伊朗"事实上已处于战争状态"。分析认为这是两场战争在地理上的首次碰撞。',fullText:'7月25日凌晨，乌克兰军方出动远程无人机，对里海水域的一艘伊朗商船发动袭击，造成船只爆炸并导致船员伤亡。这是俄乌冲突爆发以来，乌克兰首次对伊朗目标实施直接军事打击。\n\n乌克兰总统泽连斯基在社交媒体发帖证实，乌方"在里海的远程打击取得了非常有力的成果，包括用于运输涉伊朗军事货物的船只以及一艘军舰"。7月27日，泽连斯基到访英国后对外宣称，乌克兰与伊朗"事实上已处于战争状态"。\n\n伊朗外长阿拉格齐强烈谴责乌克兰袭击民用船舶，称此举公然违反《联合国宪章》。伊朗最高领袖顾问透露，伊朗曾准备袭击乌克兰三个目标，但在乌克兰道歉后取消了袭击计划。\n\n分析人士指出，乌克兰主动介入中东战局有多层外交算计：主动示好美国、深化美乌战略互信；阻止美俄缓和进程、推动美升级对俄制裁；落实美乌军工合作、争取有利和谈条件。然而美、俄、伊等国立场整体审慎，不愿看到冲突向外扩散。',date:'2026-07-25',createdAt:'2026-07-25T16:00:00'},
    {id:'s_n7',title:'美日韩联手实施近30年最大规模协调外汇干预：背后超越单纯汇率维稳',category:'政治',region:'国外',url:'https://new.qq.com/rain/a/20260803A02M1X00',summary:'美国财政部罕见介入汇市，通过纽约联储卖出欧元买入日元，与日韩联手实施近30年最大规模外汇干预。核心在于防止日韩资产市场走弱、降低金融压力向AI产业链传导风险。',fullText:'美国财政部上周罕见介入汇市，通过纽约联储委托华尔街银行卖出欧元、买入日元，与日本和韩国联手实施了近30年来最大规模的协调外汇干预行动。美国总统特朗普表示，美国介入是因为始终支持日本，美国从相关安排中获得经济利益。\n\n分析认为，此次干预背后已超越单纯的汇率维稳。核心关切在于防止日本、韩国资产市场进一步走弱，降低金融压力向AI产业链传导的风险。日本和韩国是全球半导体和AI产业链的关键节点，两国金融市场的剧烈波动可能冲击全球科技供应链。\n\n美国通过非美元交易方式介入日元，也意在转移对美元的压力，避免美元体系承受额外冲击。自美国大规模加征关税以来，美元指数持续波动，国际资本对美国资产的配置信心有所动摇。\n\n市场反应方面，干预消息公布后日元兑美元短线急升约3%，韩国KOSPI指数有所企稳。但分析人士指出，协调干预仅能提供短期缓冲，长期汇率走势仍取决于各国经济基本面与货币政策路径差异。',date:'2026-08-03',createdAt:'2026-08-03T18:00:00'},
    // === 经济 - 国内 ===
    {id:'s_n8',title:'7月股票ETF净流入4778亿元创单月历史新高：较此前峰值增160%',category:'经济',region:'国内',url:'https://c.m.163.com/news/a/L3D2UA2B05198CJN.html',summary:'Wind数据显示7月全市场ETF月度净流入4940.12亿元，其中股票ETF净流入4778.36亿元创单月新高，较此前2025年4月峰值增160%。市场"越跌越买"态势明显。',fullText:'Wind数据显示，截至7月31日，全市场ETF月度净流入4940.12亿元，其中股票ETF净流入4778.36亿元，创下单月历史最高纪录，较此前峰值（2025年4月1835.07亿元）大幅增长160.39%。\n\n从资金流向结构看，宽基ETF依然是吸金主力，沪深300、科创50、中证500等主流宽基ETF合计净流入超过3000亿元。行业ETF方面，半导体、人工智能、新能源等科技类ETF在7月市场回调期间获得大量逆势加仓。\n\n"越跌越买"的态势在7月表现得尤为突出。7月下旬A股出现明显调整，但ETF资金流入反而加速，显示出机构投资者和长期资金对当前A股估值的认可。其中"国家队"资金持续通过ETF入市被认为是重要推手。\n\n市场分析认为，ETF规模快速扩张反映了三方面趋势：一是被动投资理念在中国加速普及；二是市场底部区域机构资金积极布局；三是ETF作为稳定市场的重要工具，其"压舱石"作用日益凸显。截至7月末，全市场ETF总规模已突破4万亿元。',date:'2026-07-31',createdAt:'2026-07-31T18:00:00'},
    {id:'s_n9',title:'全国社会保障基金理事会：地方养老基金2025年投资收益率5.76% 年均收益率5.14%',category:'经济',region:'国内',url:'https://c.m.163.com/news/a/L3D2UA2B05198CJN.html',summary:'2025年地方养老基金投资收益额1420.71亿元，投资收益率5.76%。自2016年受托运营以来累计投资收益额5544.30亿元，年均投资收益率5.14%，超过年均保底收益率2.63%约2.51个百分点。',fullText:'全国社会保障基金理事会8月1日发布2025年度地方养老基金投资运营报告。2025年地方养老基金投资收益额1420.71亿元，投资收益率5.76%。自2016年12月受托运营以来，地方养老基金累计投资收益额5544.30亿元，年均投资收益率5.14%，超过年均保底收益率2.63%约2.51个百分点。\n\n报告显示，截至2025年末，地方养老基金资产总额约2.8万亿元，委托投资规模持续扩大。在资产配置上，固收类资产占比约60%，权益类资产占比约25%，其余为流动性资产和另类投资。\n\n业内人士指出，养老基金年均5.14%的收益率在低利率环境下实属不易，体现了社保基金理事会稳健的投资管理能力。养老金的保值增值直接关系数亿参保人的切身利益，投资回报的持续稳定对增强居民养老保障信心具有重要意义。\n\n展望2026年，社保基金理事会表示将继续坚持长期投资、价值投资、责任投资理念，在确保安全性的前提下优化资产配置，积极把握市场结构性机会，努力实现养老基金保值增值目标。',date:'2026-08-01',createdAt:'2026-08-01T10:00:00'},
    // === 经济 - 国外 ===
    {id:'s_n10',title:'新华社：美国经济"不可能三角"矛盾交织冲击世界',category:'经济',region:'国外',url:'https://finance.sina.com.cn/jjxw/2026-08-03/doc-inikzkkr6040444.shtml',summary:'美国经济政策陷入增长目标、价格稳定和财政可持续性的"不可能三角"：保增长需宽松推高通胀，控通胀需高利率加重财政压力，利率高企推高融资成本。联邦债务已接近40万亿美元。',fullText:'新华社8月3日刊发分析文章指出，美国经济政策正陷入越来越复杂的"不可能三角"——增长目标、价格稳定和财政可持续性之间的长期博弈，三者相互交织、彼此制约。\n\n美联储近日决定维持联邦基金利率目标区间不变，但这一决定罕见遭遇三票反对。同时，美国第二季度经济增长放缓且低于市场预期。在财政赤字持续扩大、通胀压力难以消退、债务负担不断上升的背景下，美国经济面临的深层矛盾正在积聚。\n\n在这个"不可能三角"中：保增长需要金融环境宽松，就可能推高通胀；控制通胀需要收紧金融环境、维持高利率；利率高企则会推高融资成本，加重财政压力。美国联邦债务规模已接近40万亿美元，利息支出快速上升甚至超过国防支出。\n\n国际市场担忧美国国内矛盾通过美元体系向全球传导。美联储维持高利率时，国际资本回流美国，导致新兴市场资本外流、本币承压；美联储转向宽松，又会推高全球通胀、积累新的金融风险。这种"美元周期"的溢出效应正在加剧全球金融体系的脆弱性。',date:'2026-08-03',createdAt:'2026-08-03T14:00:00'},
    {id:'s_n11',title:'特朗普取消对伊朗军事打击：油价早盘跌近7%，美伊各说各话博弈持续',category:'经济',region:'国外',url:'https://new.qq.com/rain/a/20260803A02M1X00',summary:'特朗普称伊朗请求暂缓打击故取消军事行动，伊朗军方否认称这是谎言。霍尔木兹海峡7月31日至8月2日单日船舶通行量从23艘骤降至9艘。国际油价剧烈波动。',fullText:'美伊紧张局势在急剧升温后出现戏剧性逆转。美国总统特朗普当地时间8月2日表示，伊朗及其他中东国家向美方提出请求希望暂缓发动袭击，基于这一请求他同意取消军事打击行动。特朗普还表示，霍尔木兹海峡已有协议，无核化也将达成协议。\n\n但伊朗方面迅速否认。伊朗军方官员称特朗普的说法是"一个新的谎言"，伊朗外交部发言人明确否认与美国进行任何谈判，表示目前仅与阿曼就海峡航运问题进行磋商。\n\n霍尔木兹海峡局势持续紧张。国际市场服务机构克普勒公司数据显示，7月31日至8月2日海峡单日船舶通行量连续下降，分别为23艘、11艘和9艘。作为全球约20%石油运输的必经通道，霍尔木兹海峡的任何波动都直接影响国际油价。\n\n受特朗普言论影响，国际原油价格8月3日早盘一度暴跌近7%，随后有所回升。能源市场分析师认为，尽管短期战争风险有所缓和，但中东局势的根本性矛盾并未解决，油价仍将维持高波动率。对于中国等能源进口大国而言，能源供应安全和战略储备建设显得尤为紧迫。',date:'2026-08-03',createdAt:'2026-08-03T18:00:00'},
    // === ESG - 国内 ===
    {id:'s_n12',title:'三部门首次开展碳效领跑者企业遴选：推动行业对标降碳',category:'ESG',region:'国内',url:'https://cbgc.scol.com.cn/news/7820170',summary:'工信部等三部门联合印发通知，组织开展2026年度重点行业能效、碳效领跑者企业推荐工作，这是我国首次开展碳效领跑者企业遴选，将推动高耗能行业对标降碳。',fullText:'工业和信息化部、国家发展改革委、市场监管总局三部门日前联合印发通知，组织开展2026年度重点行业能效、碳效领跑者企业推荐工作。这是我国首次将"碳效"纳入领跑者遴选指标体系，标志着碳管理从"总量控制"向"效率对标"的精细化管理转变。\n\n通知明确，2026年度遴选覆盖钢铁、水泥、电解铝、石化化工、数据中心等高耗能高排放行业。遴选标准包括单位产品综合能耗、单位产品碳排放强度、可再生能源使用比例、碳管理体系建立情况等多项指标。入围企业将获得政策支持，包括优先参与碳市场交易、绿色信贷优惠等。\n\n三部门表示，碳效领跑者制度借鉴了能效"领跑者"的成功经验，旨在通过标杆引领推动全行业对标提升。将定期发布行业碳效领跑者名单和行业平均碳效水平，形成"有标杆、有目标、有压力"的降碳激励格局。\n\n业内认为，碳效领跑者制度的建立是碳排放双控制度体系建设的重要一环。它将碳排放绩效从"合规底线"升级为"竞争优势"，有望形成市场化的减排激励机制，加速高碳行业的绿色转型。',date:'2026-08-03',createdAt:'2026-08-03T09:00:00'},
    {id:'s_n13',title:'银行业多维度推进转型金融：全国首单钢铁行业碳配额质押贷款落地',category:'ESG',region:'国内',url:'https://www.163.com/dy/article/L3G08M3E05568W0A.html',summary:'兴业银行为河钢集团办理全国首单钢铁行业碳配额质押贷款，建行投放绿色贷款支持零碳工厂建设，中行落地纺织行业"转型金融+碳足迹"双挂钩贷款。绿色金融向纵深推进。',fullText:'随着"双碳"战略向纵深推进，银行业绿色金融正从传统的绿色信贷向更加精细化的转型金融加速演进，首单业务、创新项目纷纷落地。\n\n兴业银行近期为河钢集团办理全国碳市场碳配额（CEA）质押贷款，这是钢铁行业2025年3月正式纳入全国碳市场以来，全国首单钢铁行业碳配额质押贷款，专项用于河钢集团低碳转型相关生产经营。建行安徽池州分行今年2月为安徽九华新材料新增4.2亿元授信，绿色专项贷款占比超过60%，重点支持余热余压回收、分布式光伏等项目。\n\n结构性创新产品也在加速落地。中国银行创新落地福建省首笔纺织行业"转型金融+碳足迹"双挂钩贷款，将贷款利率与"企业碳排放量""产品碳足迹数据"直接挂钩，经第三方认证减排达标后可享受50个基点的利率优惠。\n\n从"零碳达标"到"高碳转身"，银行业绿色金融服务边界持续拓宽。业内人士指出，下一阶段转型金融将成为绿色金融的主战场——如何为高碳行业提供低成本、长周期的转型资金支持，是金融业服务实体经济绿色转型的核心命题。',date:'2026-08-04',createdAt:'2026-08-04T09:00:00'},
    // === ESG - 国外 ===
    {id:'s_n14',title:'数字人民币智能合约赋能绿电交易：长三角完成首笔小时级绿电自动结算',category:'ESG',region:'国外',url:'https://xh.xhby.net/pad/con/202608/03/content_1577902.html',summary:'江苏盐城大丰港零碳产业园完成长三角首笔基于物理可溯源体系的小时级绿电交易，并完成首笔数字人民币智能合约绿电电费自动结算，为欧盟碳边境调节机制应对提供新路径。',fullText:'江苏盐城市大丰港零碳产业园6月完成了长三角首笔基于物理可溯源体系的小时级绿电交易。60兆瓦时的绿色电力从金风天润风电场出发，精准匹配博汇纸业的实际用电需求，实现了从"买得到绿电"到"用得清绿电"的关键一跃。\n\n与传统按月、按年开展的绿电交易不同，小时级绿电交易将交易颗粒度细化到每一个小时，使新能源发电曲线与企业实际用电曲线逐小时对应。通过精细匹配，实现了绿色电力消费的时段认证和来源追溯——企业能够清晰掌握所使用绿电的发电场站、发电时段和电量流向。\n\n更具创新意义的是，5月份该园区完成首笔基于数字人民币智能合约的绿电电费自动结算。这一模式将数字人民币的可编程性与绿电交易结合，实现了"即用即付"，大幅降低了结算成本和时间。\n\n随着欧盟碳边境调节机制（CBAM）等国际绿色贸易规则加速演进，外向型企业对绿电消费认证的要求日益严苛。小时级交易与物理可溯源体系的结合，有效消除了时段和来源的双重模糊，为中国出口企业应对国际绿色贸易规则提供了可行路径。',date:'2026-08-03',createdAt:'2026-08-03T10:00:00'},
    {id:'s_n15',title:'ESG信披数字化加速：多家银行上线AI智能体破解"多标并行"审核难题',category:'ESG',region:'国外',url:'https://www.163.com/dy/article/L3FQ0RIF05199NHJ.html',summary:'天津农商银行上线"可持续金融智能助手"实现多标准融合智能识别，华夏银行落地绿色金融智能体与ESG报告智能体。AI智能体有望成为解决可持续金融信贷审核的基础设施。',fullText:'在可持续金融标准林立的背景下，银行正面临一道棘手的必答题：当绿色、蓝色、生物多样性等多套标准交叉并存，一笔业务往往需耗费数日进行人工识别与贴标。2026年，银行在ESG领域应用AI智能体的探索正在逐步落地。\n\n在中国人民银行天津市分行指导下，天津农商银行"可持续金融智能助手"正式上线运行，实现多标准融合智能识别。系统可一次性完成绿色金融、蓝色金融、生物多样性金融等多标准并行认定，大幅降低了传统人工研判的重复评审成本。\n\n华夏银行与百融智能签约绿色金融信息化二阶段项目，落地绿色金融智能体与ESG报告智能体，推动绿金业务流程智能化升级。建行辽宁省分行此前也上线"绿贷判断智能辅助助手"，通过文本抓取分析存量贷款的"绿色属性"，同时构建ESG红黄灯预警模型监控信贷风险。\n\n中央财经大学欧阳日辉教授认为，AI智能体是破解标准碎片化困局的关键技术路径，具备标准语义对齐与动态映射、多智能体协同的交叉验证机制等优势。随着AI技术的成熟，ESG金融有望从"合规审核"迈向"实质影响评估"。',date:'2026-08-04',createdAt:'2026-08-04T09:00:00'},
    // === AI - 国内 ===
    {id:'s_n16',title:'阿里发布Qwen3.8旗舰大模型：总参数2.4万亿 激活参数950亿',category:'AI',region:'国内',url:'https://finance.sina.com.cn/roll/2026-08-04/doc-inimcatv5527981.shtml',summary:'阿里正式发布新一代基座大模型Qwen3.8，采用稀疏MoE架构总参数2.4万亿、激活参数950亿，支持100万Token上下文。在Arena权威榜单中综合表现仅次于Claude系列。同步推出企业级Agent产品"千问办公"。',fullText:'阿里巴巴8月3日正式发布新一代基座大模型Qwen3.8，这是中国AI大模型赛道的又一重磅产品。Qwen3.8总参数量达2.4万亿，采用稀疏MoE（混合专家）架构，激活参数950亿，支持100万Token上下文窗口。\n\n在国际权威评测平台Arena的最新榜单中，Qwen3.8综合表现仅次于Anthropic的Claude系列，位居全球第二阵营前列。在中文能力、代码生成、数学推理等多个专项评测中表现突出，刷新了多个国产模型的SOTA纪录。\n\n同步发布的还有企业级Agent产品"千问办公"（QwenWork），整合了QoderWork编程助手、悟空创意助手和MuleRun自动化工具三款产品。目前网页版和独立PC客户端已开放公测，钉钉PC端和手机端内置入口近期也将开放。\n\nQwen3.8的发布标志着中国大模型进入万亿参数时代，且强调"实用主义"而非单纯的参数竞赛。阿里方面表示，Qwen3.8将优先面向企业级应用场景，帮助企业在客户服务、文档处理、代码开发等领域实现AI赋能。',date:'2026-08-03',createdAt:'2026-08-03T10:00:00'},
    {id:'s_n17',title:'DeepSeek V4-Flash调用量登顶全球：单日处理8万亿Token',category:'AI',region:'国内',url:'https://finance.sina.com.cn/roll/2026-08-04/doc-inimcatv5527981.shtml',summary:'OpenRouter与OpenCode平台数据显示，DeepSeek V4-Flash上周以7.22万亿Token周调用量位居全球第一，单日处理达8万亿Token。模型通过统一API映射实现思考/非思考模式智能切换。',fullText:'8月3日，国际权威的模型调用统计平台OpenRouter与OpenCode联合发布的数据显示，深度求索（DeepSeek）推出的V4-Flash模型上周以7.22万亿Token的周调用量位居全球第一，单日处理量达到8万亿Token，超越了包括GPT系列在内的所有竞品模型。\n\nDeepSeek V4-Flash是DeepSeek推出的轻量级高效推理模型，通过统一API映射至deepseek-v4-flash的思考/非思考模式。用户可以根据任务复杂度和成本预算，在"深度推理"和"快速响应"两种模式之间灵活切换。\n\n该模型的成功折射出大模型服务的"大宗商品化"趋势——不再单纯追求参数规模，而是通过精细化运营和成本优化实现规模效应。DeepSeek V4-Flash的API调用价格仅为同级别模型的1/5至1/3，极高的性价比是其调用量飙升的核心驱动力。\n\n行业分析认为，DeepSeek在全球调用量登顶是中国AI产业走向成熟的重要标志。从"跟跑"到"并跑"再到局部"领跑"，中国大模型在全球应用生态中的话语权正在快速提升。但也需关注算力瓶颈和地缘政治风险对可持续增长的约束。',date:'2026-08-03',createdAt:'2026-08-03T10:00:00'},
    // === AI - 国外 ===
    {id:'s_n18',title:'白宫召集AI企业审议监管框架终稿：自愿机制下要求模型发布前主动报备',category:'AI',region:'国外',url:'https://finance.sina.com.cn/stock/usstock/c/2026-08-04/doc-inimeefm2013889.shtml',summary:'特朗普政府邀请OpenAI、谷歌、Anthropic等企业赴白宫审议AI监管框架终稿。框架设立自愿报备机制，要求AI实验室在向公众发布模型前主动提交模型信息。此前白宫对Fable模型施加出口管制。',fullText:'据五位知情人士透露，特朗普政府已向OpenAI、谷歌、Anthropic等头部科技企业发出邀请，于8月4日前往白宫审议定稿后的人工智能监管框架。会议由国家网络总监办公室（ONCD）主办。\n\n这套AI监管框架将设立一套自愿流程：AI实验室在向合作伙伴及公众发布模型前，可主动向政府提交相关模型信息。框架旨在搭建自愿协作机制，让AI企业配合识别新模型风险，同时维持相对宽松的AI监管姿态。该框架的出台源于Anthropic推出前沿模型Mythos引发的安全争议。\n\n然而自行政令签署以来，特朗普政府对头部AI企业采取了更强硬的手段——针对Anthropic面向公众推出的Mythos公开版本Fable施加出口管制，同时要求OpenAI对最新模型GPT-5.6实施分阶段发布。这些措施招致企业与政策专家普遍批评。\n\n据报道，框架一大争议焦点是是否加入针对开源模型的专项表述。OpenAI的山姆·奥尔特曼上周已前往华盛顿会晤白宫高层官员，议题涵盖监管框架以及新模型Astra。行业观察人士指出，AI监管正处于"自愿与强制"的十字路口，框架的最终版本将决定美国AI治理的方向。',date:'2026-08-04',createdAt:'2026-08-04T10:00:00'},
    {id:'s_n19',title:'英伟达与SK集团扩大AI战略合作：规模超5000亿美元 覆盖AI工厂与HBM供应',category:'AI',region:'国外',url:'https://new.qq.com/rain/a/20260804A07K0Q00',summary:'围绕AI工厂建设与下一代HBM存储供应的合作规模被报道达超5000亿美元量级。费城半导体指数大幅拉升，二级市场用真金白银确认：在AGI全面盈利之前，基础设施确定性最高。',fullText:'7月底全球AI产业迎来最震撼的资本运作：英伟达与韩国SK集团宣布扩大战略合作，围绕AI工厂建设与下一代高带宽存储（HBM）供应的合作规模被报道达到超过5000亿美元的量级。这一数字直观地向市场宣告，算力、存储与电力数据中心依然是整个大模型产业链最硬、最深、资金消耗最恐怖的"重资产战场"。\n\n合作内容涵盖多个维度：SK海力士将为英伟达提供下一代HBM4芯片的优先供应权；双方将在北美和亚洲联合建设超大规模AI数据中心；英伟达将向SK集团提供最新的GPU集群技术用于训练下一代大模型。\n\n市场映射方面，消息公布后费城半导体指数大幅拉升，存储芯片相关股票剧烈波动。二级市场正在用真金白银投票——在AGI真正全面盈利之前，"卖水人"（基础设施、硬件芯片、内存供应）依旧是确定性最高的投资主线。\n\n与此同时，国内AI基建也在加速。"十五五"期间算力网建设将新增直接投资4万亿元，智能算力规模同比实现2.8倍增长。方正证券研报指出，算力网建设将显著拉动高速光模块、光芯片及交换机需求，国产替代空间广阔。',date:'2026-08-04',createdAt:'2026-08-04T10:00:00'}

    {id:'s_p17',journal:'管理世界',title:'数据财政的前景研究：企业需求视角',authors:'杨健鹏, 梅思雨, 张晗雨, 梁若冰',year:'2026',issue:'第7期',abstract:'从企业雇佣决策视角切入检验公共数据需求。基于招聘平台大数据的实证研究发现，地方政府实施公共数据授权运营显著增加了企业对数据分析岗的招聘规模，且高技能岗位增幅超过低技能岗位。数据相关岗位的扩招是其他研发岗位缩减的结果，体现为研发方向的结构性调整。',url:'http://mwm.net.cn/web/bqym'},
    {id:'s_p18',journal:'管理世界',title:'数据赋能的两面性：低碳与居民收入增长何以兼得？',authors:'王永进, 周成英, 谢芳',year:'2026',issue:'第7期',abstract:'基于数据部门寡头竞争特征构建多地区多部门一般均衡模型。发现信息数据化和算力提升显著推动产出和居民收入增长，但因刺激能源需求导致碳排放总量上升，揭示数字经济时代的"杰文斯悖论"。碳税是实现经济增长与低碳转型双赢的有效手段。',url:'http://mwm.net.cn/web/bqym'},
    {id:'s_p19',journal:'管理世界',title:'监管沙盒何以缓释银行系统性风险？——基于银行金融科技创新与监管的演化博弈分析',authors:'马亚明, 徐佳翔, 温博慧, 袁铭, 孟弋然',year:'2026',issue:'第7期',abstract:'通过构建银行与监管部门的演化博弈模型，并以监管沙盒实施作为准自然实验，检验其对银行系统性风险的缓释效果。研究发现监管沙盒能够通过提升银行金融科技创新质量、提高银行效率与抑制机构关联来降低潜在系统性风险。',url:'http://mwm.net.cn/web/bqym'},
    {id:'s_p20',journal:'管理世界',title:'组织架构体系如何支撑裂变企业突破性创新？——基于"结构·流程·边界"框架的混合方法研究',authors:'王凤彬, 冯依帆, 曾凯, 郭长伟',year:'2026',issue:'第7期',abstract:'基于"结构—流程—边界"三维度框架，采用混合方法研究设计，识别出自主试验型、开放共创型、集群合作型和母子协同型4类实现突破性创新的构型，以及保守迟滞型和脱嵌孤岛型两类导致非突破性创新的构型。从结构、流程和边界维度推进裂变企业创新支撑体系的理论建构。',url:'http://www.mwm.net.cn/web/xq?leafId=226&docId=6178'},
    {id:'s_p21',journal:'管理世界',title:'央企共链行动何以推动技术双向进化？——以"九天"基座大模型为例',authors:'赵晨, 林晨, 高中华',year:'2026',issue:'第7期',abstract:'以中国移动"九天"基座大模型跨产业链赋能的共链实践为案例，结合制度理论与组织共演理论展开剖析。研究发现，共链行动的核心作用在于通过注入制度信任，破解市场机制下难以自发形成的跨链协作信任困境，结论涌现为"制度型技术共生模型"。',url:'http://www.mwm.net.cn/web/xq?leafId=226&docId=6180'},
    {id:'s_p22',journal:'管理世界',title:'专精特新企业可持续成长的实现机制——基于扩展适应创新视角的多案例研究',authors:'吴波, 杨步韵, 邬爱其, 牛志伟, 李子莹',year:'2026',issue:'第7期',abstract:'基于扩展适应创新视角，采用纵向多案例研究方法，揭示专精特新企业通过扩展适应创新牵引技术与场景协同跃迁的机制。研究发现：(1)技术精一发展与场景梯度攀升构成两大支柱；(2)扩展适应创新通过"征用—集成—生成"联动，依托模块升级、结构深化、原理更新3种路径破解专业化困境。',url:'http://www.mwm.net.cn/web/xq?leafId=226&docId=6179'},
    {id:'s_p23',journal:'管理世界',title:'企业间竞合：理论演进与数智时代的研究展望',authors:'马鹏程, 刘锡禄, 李东红',year:'2026',issue:'第7期',abstract:'通过系统性文献综述梳理竞合理论演进脉络，提出"数智竞合"概念，构建整合"微观—中观—宏观"层次与"前因—过程—结果"链条的矩阵式研究框架。数智技术全面打破人类单一决策主体、实体资源稀缺、企业固定边界等传统前提，催生人机协同竞合、数据驱动生态博弈等新方向。',url:'http://mwm.net.cn/web/bqym'},
    {id:'s_p24',journal:'南开管理评论',title:'企业数字化转型与在职培训投资——基于人力资本"挖掘"视角',authors:'王京, 王阳阳, 范明珠, 程平',year:'2026',issue:'第6期',abstract:'基于2010—2021年沪深两市A股上市企业数据，考察数字化转型对企业在职培训投资的影响。研究发现数字化转型会提高企业在职培训投资，机制在于提高风险承担意愿和提升人力资本结构优化需求；高管风险偏好、股权激励等管理层特征和行业属性、数字基础设施等外部环境具有调节效应。',url:'https://nbr.nankai.edu.cn'},
    {id:'s_p25',journal:'南开管理评论',title:'"去杠杆"监管下国有企业迎合行为的策略与效果研究',authors:'李思飞, 陆洋, 牛煜皓, 邓路',year:'2026',issue:'第6期',abstract:'以2016年"去杠杆"政策及这一外生冲击，构建双重差分模型研究发现：高杠杆国有企业具有更高的账面"去杠杆"水平和杠杆操纵水平，并通过迎合政策获得更多政策激励；但迎合行为在长期需要承担相应成本，体现为减债与增权能力更弱、政府控制更弱时上述关系更为显著。',url:'https://nbr.nankai.edu.cn'},
    {id:'s_p26',journal:'南开管理评论',title:'按连接量vs.服务订阅：物联网平台赋能制造商产品智能升级的服务收费模式研究',authors:'李秀峰, 李波, 李勇建',year:'2026',issue:'第6期',abstract:'从一家物联网平台和两家竞争的制造商交互关系出发，建立斯塔克尔伯格博弈模型研究平台按连接量与服务订阅两种收费模式下物联网平台的服务收费、服务水平以及制造商智能升级的最优策略。研究发现不同收费模式下服务成本、网络安全风险和需求溢出显著影响定价及服务决策。',url:'https://nbr.nankai.edu.cn'},
    {id:'s_p27',journal:'南开管理评论',title:'机构VS自然人：连锁股东如何影响资本市场定价效率？',authors:'刘剑民, 汪世晨, 侯晓晨, 徐玉德',year:'2026',issue:'第6期',abstract:'以2003—2023年A股上市公司为研究样本，研究发现机构连锁股东加剧了股价同步性，对资本市场定价效率存在负向影响；而自然人连锁股东弱化了股价同步性，对资本市场定价效率存在正向影响。机构和自然人连锁股东行为特征在动机与能力、方式、机制过程等方面均存在差异化效应。',url:'https://nbr.nankai.edu.cn'},
    {id:'s_p28',journal:'南开管理评论',title:'创新竞争压力与企业创新信息披露策略',authors:'王雄元, 崔荡荡',year:'2026',issue:'第6期',abstract:'以专利被无效宣告衡量创新竞争压力，以年报MD&A段落创新关键词词频衡量创新文本信息披露，检验企业面临创新竞争压力时如何披露其创新文本信息。研究发现专利被无效宣告后企业MD&A段落创新关键词词频显著提高，且在技术外购、研发投入和研发产出水平较高组以及"多言多行"组更为显著。',url:'https://nbr.nankai.edu.cn'},
    {id:'s_p29',journal:'南开管理评论',title:'国有资本布局优化与公司资源配置效率——基于中央企业主业调整的准自然实验',authors:'毛新述, 曹国蓉, 毛聚, 贾宁',year:'2026',issue:'第6期',abstract:'利用中央企业主业调整这一微观场景，采用双重差分模型探讨基于主业调整的国资布局优化对企业资源配置效率的影响。研究表明以主业调整推动国资布局优化有助于提高企业资源配置效率，通过降低企业内部管控成本，以及"倒逼"管理层将有限注意力聚焦于主业发展来实现其积极效应。',url:'https://nbr.nankai.edu.cn'},
    {id:'s_p30',journal:'南开管理评论',title:'反收购条款与企业技术并购',authors:'陈克兢, 万清清, 杨国超, 熊家财',year:'2026',issue:'第6期',abstract:'采用文本分析技术构建中国上市公司反收购条款数据库，从并购视角考察反收购条款对企业技术升级路径选择的影响机制。研究发现反收购条款可显著提升企业技术并购的可能性，每增加一个标准差，企业发生技术并购的概率增加13.4%，主要通过实物期权与金融摩擦两种渠道影响技术并购。',url:'https://nbr.nankai.edu.cn'},
    {id:'s_p31',journal:'南开管理评论',title:'数字导向何以有益？调节和中介机制的元分析研究',authors:'马鸿佳, 王春蕾, 王永伟, 耿森',year:'2026',issue:'第6期',abstract:'基于72篇实证文献中的41560个样本，运用元分析结构方程模型方法探究数字导向对企业绩效的影响及其边界条件与中介机制。研究发现数字导向与企业绩效中度正相关；在低技术行业企业中数字导向对绩效的正向影响更大；数字创新起部分中介作用；链式中介模型优于并行中介模型。',url:'https://nbr.nankai.edu.cn'},
    {id:'s_p32',journal:'南开管理评论',title:'产业链政策能够促进企业创新吗？——来自"链长制"实施的经验证据',authors:'赵泽与, 佟岩, 李鑫, 曹慧娟',year:'2026',issue:'第6期',abstract:'基于手工收集的全国各地市链长制实施的行业级数据，检验链长制政策对企业创新的影响及其传导机制。研究发现链长制显著提升了企业的创新水平和创新效率，主要通过资源整合效应促进企业创新。当产业链有央企引领、企业为民营企业、地区知识产权保护水平更高时促进作用更加显著。',url:'https://nbr.nankai.edu.cn'},
    {id:'s_p33',journal:'南开管理评论',title:'专利加速审查与企业创新',authors:'韩洪灵, 董恬媛, 刘强, 龚启辉',year:'2026',issue:'第6期',abstract:'利用专利预审制度的渐进实施作为准自然实验，探讨专利审查时效的外生变化如何影响企业研发创新行为。研究发现专利加速审查显著提升了企业研发投入水平，并促进了实质性创新产出；降低创新活动的风险与不确定性是其促进创新的主要机制；及时的专利授权提升了企业的创新质量和自主创新倾向。',url:'https://nbr.nankai.edu.cn'},
    {id:'s_p34',journal:'南开管理评论',title:'"引以为鉴"还是"因势乘便"：财务退市冲击与同行企业风险承担',authors:'刘柏, 谢文萱',year:'2026',issue:'第6期',abstract:'使用双重差分法研究财务退市事件是否影响同行公司风险承担。研究发现退市事件发生后同行公司风险承担显著提高，且在高管无海外背景、非资本密集型以及非高技术行业的公司中该正向影响更显著。退市冲击通过改善信息环境、缓解代理问题和加剧竞争程度三种途径促使同行公司承担风险。',url:'https://nbr.nankai.edu.cn'},
    {id:'s_p35',journal:'南开管理评论',title:'国有企业薪资市场化改革提高智能制造水平了吗？',authors:'马永强, 阳鹏, 陈伟忠',year:'2026',issue:'第6期',abstract:'以2018年国务院印发的《关于改革国有企业工资决定机制的意见》为政策冲击，实证检验国有企业薪资市场化改革对智能制造的影响。研究发现薪资市场化改革显著提高了企业的智能制造水平，通过激发国有企业提升劳动生产率的需求、以及优化人力资本结构进而提高智能制造水平。',url:'https://nbr.nankai.edu.cn'}
  ];

    topics:[
      {id:'py1',title:'NumPy 进阶：多资产组合协方差矩阵与风险分解',desc:'用 NumPy 构建多资产日收益率矩阵，计算协方差矩阵、相关性热力值、组合波动率及边际风险贡献（MRC），为 ESG 主题投资组合的风险管理打基础。',code:'import numpy as np\nnp.random.seed(42)\nn_assets, n_days = 5, 252\n\n# 模拟5只ESG主题股票的一年日收益率\nreturns = np.random.normal(0.0005, 0.015, (n_days, n_assets))\n\n# 协方差矩阵（年化）\ncov_matrix = np.cov(returns, rowvar=False) * 252\n\n# 等权重组合\nweights = np.ones(n_assets) / n_assets\nport_vol = np.sqrt(weights @ cov_matrix @ weights)\n\n# 边际风险贡献\nmrc = (cov_matrix @ weights) / port_vol\nrisk_pct = weights * mrc / port_vol\n\nprint("组合年化波动率: {:.2%}".format(port_vol))\nprint("各资产风险贡献占比:", np.round(risk_pct * 100, 1))\nprint("协方差矩阵行列式: {:.2e}".format(np.linalg.det(cov_matrix)))',duration:40},
      {id:'py2',title:'Pandas 实战：ESG 评级迁移矩阵与面板数据分析',desc:'处理 Wind CSMAR 格式的 ESG 评级面板数据，掌握 groupby+shift 构建评级迁移矩阵、pivot_table 长宽表转换、rolling 窗口计算评级变化趋势。',code:'import pandas as pd\nimport numpy as np\n\nnp.random.seed(2026)\nn_firms, n_quarters = 100, 8\n\n# 模拟 ESG 评级面板（AAA=1 ~ CCC=7）\ndf = pd.DataFrame({\n  \'firm_id\': np.repeat(range(n_firms), n_quarters),\n  \'quarter\': np.tile(range(n_quarters), n_firms),\n  \'rating\': np.random.choice([1,2,3,4,5,6,7], n_firms*n_quarters, p=[0.05,0.15,0.25,0.30,0.15,0.07,0.03])\n})\n\n# 评级迁移矩阵：上一期 → 当前期\ndf[\'prev_rating\'] = df.groupby(\'firm_id\')[\'rating\'].shift(1)\nmigration = pd.crosstab(df[\'prev_rating\'], df[\'rating\'], normalize=\'index\')\n\n# 行业平均 ESG 趋势\ndf[\'industry\'] = np.random.choice([\'能源\',\'制造\',\'金融\',\'科技\'], n_firms*n_quarters)\ntrend = df.groupby([\'quarter\',\'industry\'])[\'rating\'].mean().unstack()\n\nprint("评级迁移矩阵(概率):")\nprint(migration.round(3))\nprint("\\n行业ESG趋势:")\nprint(trend.diff().round(2))',duration:45},
      {id:'py3',title:'可视化进阶：ESG 因子收益归因与 IC 序列分析',desc:'用 Matplotlib+ Seaborn 绘制因子 IC 热力图、累计收益曲线和行业暴露散点图，学习 subplots 复杂布局、双 Y 轴、annotate 标注关键数据点。',code:'import matplotlib.pyplot as plt\nimport numpy as np\n\nplt.rcParams["font.size"] = 10\nnp.random.seed(42)\nmonths = np.arange(1, 25)\n\n# 模拟 ESG 因子月度 IC 序列\nic = np.random.normal(0.03, 0.08, 24)\ncum_ic = np.cumsum(ic)\n\n# 模拟 ESG 组合累计超额收益\nexcess_ret = np.cumsum(np.random.normal(0.008, 0.04, 24))\n\nfig, (ax1, ax2) = plt.subplots(1, 2, figsize=(12, 4.5))\n\n# 左：IC 序列\ncolors = [\'#2a8c61\' if v > 0 else \'#e74c3c\' for v in ic]\nax1.bar(months, ic, color=colors, alpha=0.7)\nax1.plot(months, cum_ic, \'k-\', linewidth=2, label=\'Cumulative IC\')\nax1.axhline(0, color=\'gray\', linestyle=\'--\', linewidth=0.8)\nax1.set_title(\'ESG Factor IC Series\')\nax1.set_xlabel(\'Month\'); ax1.set_ylabel(\'IC\')\nax1.legend()\n\n# 右：累计超额收益\nax2.fill_between(months, 0, excess_ret, alpha=0.3, color=\'#2a8c61\')\nax2.plot(months, excess_ret, \'o-\', color=\'#1f7a54\', markersize=3)\nax2.set_title(\'ESG Long-Short Portfolio: Cumulative Excess Return\')\nax2.set_xlabel(\'Month\'); ax2.set_ylabel(\'Cumulative Return\')\nax2.axhline(0, color=\'gray\', linestyle=\'--\', linewidth=0.8)\n\nplt.tight_layout()\nplt.savefig("esg_factor_analysis.png", dpi=150, bbox_inches=\'tight\')\nprint("IC均值: {:.3f}, IR: {:.2f}".format(ic.mean(), ic.mean()/ic.std()*np.sqrt(12)))',duration:40},
      {id:'py4',title:'综合实战：绿色债券信用利差影响因素——多元回归与模型诊断',desc:'综合前3课知识：用 Pandas 清洗真实绿色债券数据，用 statsmodels 跑多元回归分析信用利差影响因素，进行 VIF 多重共线性、Breusch-Pagan 异方差、残差正态性全套诊断。',code:'import numpy as np\nimport pandas as pd\nimport statsmodels.api as sm\nfrom statsmodels.stats.outliers_influence import variance_inflation_factor\n\nnp.random.seed(2026)\nn = 120\n\n# 模拟绿色债券数据\ndf = pd.DataFrame({\n  \'spread_bps\': np.random.normal(85, 25, n),  # 信用利差(bp)\n  \'esg_score\': np.random.normal(65, 12, n),    # ESG评分\n  \'duration\': np.random.normal(4.5, 2.0, n),   # 久期\n  \'leverage\': np.random.normal(0.55, 0.18, n), # 资产负债率\n  \'size_log\': np.random.normal(23, 1.5, n)     # 资产规模(log)\n})\n\n# OLS 回归\nX = sm.add_constant(df[[\'esg_score\',\'duration\',\'leverage\',\'size_log\']])\ny = df[\'spread_bps\']\nmodel = sm.OLS(y, X).fit()\n\nprint(model.summary().tables[1])\nprint("\\nR-squared: {:.4f}, Adj R-squared: {:.4f}".format(model.rsquared, model.rsquared_adj))\n\n# VIF 多重共线性诊断\nvif_data = pd.DataFrame({\n  \'Variable\': X.columns,\n  \'VIF\': [variance_inflation_factor(X.values, i) for i in range(X.shape[1])]\n})\nprint("\\nVIF 诊断:")\nprint(vif_data.round(2))\n\n# Breusch-Pagan 异方差检验\nfrom statsmodels.stats.diagnostic import het_breuschpagan\nbp = het_breuschpagan(model.resid, model.model.exog)\nprint("\\nBreusch-Pagan p-value: {:.4f}".format(bp[1]))',duration:50}

    paper:{
      title:'ESG评级分歧对企业绿色创新的影响——基于信号传递与融资约束的双重视角',
      journal:'经济研究',
      authors:'李青原, 肖泽华, 王晓宇',
      year:'2026',
      issue:'第7期',
      abstract:'以2018-2024年A股上市公司为样本，实证检验ESG评级分歧（不同评级机构对同一企业ESG评分差异）对企业绿色创新的影响及其传导机制。研究发现：ESG评级分歧显著抑制企业绿色专利申请量，平均效应约为-8.3%，且该抑制效应在信息透明度低、融资约束高的企业中更为显著。机制检验揭示两条核心路径：一是"信号扭曲渠道"——评级分歧加剧外部投资者对企业绿色承诺真实性的质疑，降低ESG溢价的融资红利；二是"管理层短视渠道"——面对不一致的外部评价，管理者倾向于削减回报周期长的绿色研发投入以维持短期财务表现。横截面分析表明，高质量环境信息披露和机构投资者持股可有效缓解评级分歧的负面影响。研究为统一ESG评级标准、完善绿色金融信息披露制度提供了实证依据。',
      methodology:'**研究设计**\n• 数据来源：CSMAR、Wind、CNRDS、商道融绿、华证ESG评级数据库，样本覆盖2018-2024年A股上市公司，剔除金融类、ST和PT企业\n• 被解释变量：企业绿色专利申请量（发明专利+实用新型，对数化处理），区分实质性绿色创新与策略性绿色创新\n• 核心解释变量：ESG评级分歧度 = 华证ESG评分与商道融绿ESG评级的标准化差异绝对值\n• 识别策略：固定效应面板模型+工具变量法（同行业-同地区其他企业平均ESG分歧度作为IV）\n• 中介变量：信息不对称程度（分析师预测分歧度）、融资约束（SA指数）、管理层短视（研发投入资本化比例）\n• 控制变量：企业规模、资产负债率、ROA、成长性、董事会独立性、机构投资者持股比例\n\n**方法论亮点**\n1. 从"ESG评级分歧"这一新的制度摩擦视角切入，拓展ESG研究从"评分高低"到"评分一致性"的分析维度\n2. 构建"信号扭曲—融资约束—绿色创新"的理论框架，弥补现有研究只关注ESG水平而忽略评级质量的不足\n3. 采用工具变量法缓解评级分歧与绿色创新之间的内生性问题\n4. 区分实质性绿色创新与策略性绿色创新，揭示评级分歧的差异化影响路径',

// 根据日期+餐次类型稳定选择一份菜谱（每日轮换）
function pickDietMeal(type,dateKey){
  const poolMap={breakfast:DIET_BREAKFAST_POOL,lunch:DIET_LUNCH_POOL,dinner:DIET_DINNER_POOL,snack:DIET_SNACK_POOL,principles:DIET_PRINCIPLES_POOL};
  const pool=poolMap[type];
  if(!pool||!pool.length) return '';
  let h=0;
  const s=(type||'')+'_'+(dateKey||'');
  for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}
  return pool[Math.abs(h)%pool.length];
}

function today(){ return new Date().toISOString().split('T')[0]; }
function now(){ return new Date().toISOString(); }

// 按日期确定性轮换科普池：同一天结果稳定，跨天自动刷新
function dailyRotate(pool, count, offset){
  const n=parseInt(today().replace(/-/g,''),10);
  const start=((n+(offset||0))%pool.length+pool.length)%pool.length;
  const rotated=[...pool.slice(start),...pool.slice(0,start)];
  return rotated.slice(0,count);
}

/* ============================================
   每周健康打卡（饮食 / 护肤 / 锻炼 / 早睡）
   - 数据按「周」组织，周一自动重置并归档上周
   - 月末 / 年末自动形成统计图（见 renderHealthStatsCard）
   ============================================ */
const WEEK_DAYS=['一','二','三','四','五','六','日'];
const DIET_MEALS=[{key:'breakfast',label:'🌅 早餐'},{key:'lunch',label:'☀️ 午餐'},{key:'dinner',label:'🌙 晚餐'}];
const SKIN_ITEMS=[{key:'eye',label:'👁️ 眼膜'},{key:'clean',label:'🧼 清洁'},{key:'massage',label:'💆 按摩'},{key:'hydrate',label:'💧 补水'}];

function fmtYMD(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const da=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${da}`;
}
function getMondayDate(){
  const d=new Date();
  const day=(d.getDay()+6)%7; // 周一=0
  d.setDate(d.getDate()-day);
  d.setHours(0,0,0,0);
  return d;
}
function getMonday(){ return fmtYMD(getMondayDate()); }
function getWeekdayIdx(){ const d=new Date(); return (d.getDay()+6)%7; } // 周一=0..周日=6

function defaultHealth(weekStart){
  return {
    weekStart,
    diet:{breakfast:Array(7).fill(false),lunch:Array(7).fill(false),dinner:Array(7).fill(false)},
    skin:{eye:Array(7).fill(false),clean:Array(7).fill(false),massage:Array(7).fill(false),hydrate:Array(7).fill(false)},
    exercise:Array(7).fill(false),
    earlySleep:Array(7).fill(false),
    quality:Array(7).fill('')
  };
}
function weekLabelOf(ws){
  const d=new Date(ws+'T00:00:00');
  const onejan=new Date(d.getFullYear(),0,1);
  const week=Math.ceil((((d-onejan)/86400000)+onejan.getDay()+1)/7);
  return d.getFullYear()+'-W'+String(week).padStart(2,'0');
}
function healthWeekSummary(h){
  const dietTotal=3*7;
  const dietDone=['breakfast','lunch','dinner'].reduce((s,k)=>s+(h.diet[k]||[]).filter(Boolean).length,0);
  const skinCount=['eye','clean','massage','hydrate'].reduce((s,k)=>s+(h.skin[k]||[]).filter(Boolean).length,0);
  const exerciseCount=(h.exercise||[]).filter(Boolean).length;
  const earlySleepCount=(h.earlySleep||[]).filter(Boolean).length;
  const qualityGood=(h.quality||[]).filter(q=>q==='good').length;
  return {weekStart:h.weekStart,weekLabel:weekLabelOf(h.weekStart),dietDone,dietTotal,dietPct:Math.round(dietDone/dietTotal*100),skinCount,exerciseCount,earlySleepCount,qualityGood};
}
function archiveHealthWeek(){
  const h=DATA.health; if(!h) return;
  const s=healthWeekSummary(h);
  if(s.dietDone+s.skinCount+s.exerciseCount+s.earlySleepCount===0) return; // 跳过空周
  DATA.healthArchive=DATA.healthArchive||[];
  if(!DATA.healthArchive.some(a=>a.weekStart===s.weekStart)) DATA.healthArchive.push(s);
}
function ensureHealth(){
  if(!DATA.health || DATA.health.weekStart!==getMonday()){
    if(DATA.health && DATA.health.weekStart!==getMonday()) archiveHealthWeek();
    DATA.health=defaultHealth(getMonday());
  }
  const h=DATA.health;
  ['breakfast','lunch','dinner'].forEach(k=>{ if(!h.diet) h.diet={}; if(!h.diet[k]) h.diet[k]=Array(7).fill(false); });
  ['eye','clean','massage','hydrate'].forEach(k=>{ if(!h.skin) h.skin={}; if(!h.skin[k]) h.skin[k]=Array(7).fill(false); });
  if(!Array.isArray(h.exercise)) h.exercise=Array(7).fill(false);
  if(!Array.isArray(h.earlySleep)) h.earlySleep=Array(7).fill(false);
  if(!Array.isArray(h.quality)) h.quality=Array(7).fill('');
  if(!Array.isArray(DATA.healthArchive)) DATA.healthArchive=[];
  if(!DATA.healthMonthly) DATA.healthMonthly={};
  if(!DATA.healthYearly) DATA.healthYearly={};
}
function ensureHealthPeriods(){
  ensureHealth();
  const now=new Date();
  const monthKey=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const yearKey=`${now.getFullYear()}`;
  const s=healthWeekSummary(DATA.health);
  if(!DATA.healthMonthly[monthKey]) DATA.healthMonthly[monthKey]={weeks:[]};
  if(!DATA.healthMonthly[monthKey].weeks.includes(s.weekStart)) DATA.healthMonthly[monthKey].weeks.push(s.weekStart);
  if(!DATA.healthYearly[yearKey]) DATA.healthYearly[yearKey]={weeks:[]};
  if(!DATA.healthYearly[yearKey].weeks.includes(s.weekStart)) DATA.healthYearly[yearKey].weeks.push(s.weekStart);
}

/* ============================================
   读书打卡（每日读书勾选，按月重置，年末统计图）
   - 数据按「月」组织，跨月自动归档上月并清零
   - 年末自动按 12 个月汇总读书天数（见 renderReadingStatsCard）
   ============================================ */
function monthKeyOf(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function ensureReadingCheckin(){
  if(!DATA.libRead) DATA.libRead={};
  if(!DATA.readingMonths) DATA.readingMonths={};
  const mk=monthKeyOf(new Date());
  if(!DATA.readingCheckin || DATA.readingCheckin.monthKey!==mk){
    if(DATA.readingCheckin && DATA.readingCheckin.monthKey!==mk){
      const prev=DATA.readingCheckin;
      const cnt=Object.keys(prev.days||{}).length;
      if(cnt>0 || (prev.note&&prev.note.trim())) DATA.readingMonths[prev.monthKey]={readDays:cnt,note:prev.note||''};
    }
    DATA.readingCheckin={monthKey:mk,days:{},note:''};
  }
  if(!DATA.readingCheckin.days) DATA.readingCheckin.days={};
}

/* ============================================
   情绪趋势（每周一统计，依次形成月统计、年统计）
   - 每周一归档上一周情绪均值（avgScore/count/label）
   - 把本周归入当前月/年桶，月末/年末自动聚合出月/年统计（见 renderEmotionChart）
   ============================================ */
function emotionWeekAvg(weekStart){
  const em=DATA.emotions||[];
  const start=new Date(weekStart+'T00:00:00');
  const end=new Date(start.getTime()+7*86400000); // 下周一
  const inWeek=em.filter(e=>e.date>=weekStart && e.date<fmtYMD(end) && e.score);
  const count=inWeek.length;
  const avg=count? Math.round(inWeek.reduce((s,r)=>s+(r.score||0),0)/count*10)/10 : null;
  return {weekStart, label:weekLabelOf(weekStart), avgScore:avg, count};
}
function ensureEmotionPeriods(){
  if(!Array.isArray(DATA.emotionWeeks)) DATA.emotionWeeks=[];
  if(typeof DATA.emotionMonthly!=='object'||!DATA.emotionMonthly) DATA.emotionMonthly={};
  if(typeof DATA.emotionYearly!=='object'||!DATA.emotionYearly) DATA.emotionYearly={};
  const monday=getMonday();
  const prevMondayDate=new Date(getMondayDate());
  prevMondayDate.setDate(prevMondayDate.getDate()-7);
  const prevMonday=fmtYMD(prevMondayDate);
  // 每周一归档上一周（不重复、非空才存）
  if(!DATA.emotionWeeks.some(w=>w.weekStart===prevMonday)){
    const w=emotionWeekAvg(prevMonday);
    if(w.count>0) DATA.emotionWeeks.push(w);
  }
  // 把本周（含进行中）归入当前月/年桶，供月/年视图聚合（桶 key 取周一所在月/年，避免跨月错位）
  const monthKey=monday.slice(0,7);
  const yearKey=monday.slice(0,4);
  if(!DATA.emotionMonthly[monthKey]) DATA.emotionMonthly[monthKey]={weeks:[]};
  if(!DATA.emotionMonthly[monthKey].weeks.includes(monday)) DATA.emotionMonthly[monthKey].weeks.push(monday);
  if(!DATA.emotionYearly[yearKey]) DATA.emotionYearly[yearKey]={weeks:[]};
  if(!DATA.emotionYearly[yearKey].weeks.includes(monday)) DATA.emotionYearly[yearKey].weeks.push(monday);
}
function emotionAggBy(list,gran){
  const map={};
  list.forEach(w=>{
    const key=gran==='month'?w.weekStart.slice(0,7):w.weekStart.slice(0,4);
    if(!map[key]) map[key]={sum:0,cnt:0};
    if(w.count>0){ map[key].sum+=w.avgScore*w.count; map[key].cnt+=w.count; }
  });
  const avg=k=>map[k].cnt? Math.round(map[k].sum/map[k].cnt*10)/10 : null;
  return Object.keys(map).sort().map(k=>({label:k, avg:avg(k)}));
}

// 学习分区完成度：聚合四张卡各自「具体计划」的勾选（按条目计，而非整卡）
function learnModuleState(){
  const pym=DATA.pythonPlan||{}, eng=DATA.englishStudy||{}, pap=DATA.paperStudy||{}, cpa=DATA.cpaStudy||{};
  const pTopics=(pym.topics||[]);
  const pDone=pTopics.filter(t=>t.done).length, pTotal=pTopics.length;
  const eItems=[...(eng.part1Questions||[]), eng.part2Task?[eng.part2Task]:[], ...(eng.part3Questions||[])].filter(Boolean);
  const eDone=eItems.filter(x=>x.done).length, eTotal=eItems.length;
  const papHas=!!pap.paper && pap.date===today();
  const papDone=papHas&&pap.done?1:0, papTotal=papHas?1:0;
  let cTotal=0,cDone=0;
  (cpa.subjects||[]).forEach(s=>(s.tasks||[]).forEach(t=>{cTotal++; if(t.done)cDone++;}));
  const total=pTotal+eTotal+papTotal+cTotal;
  const done=pDone+eDone+papDone+cDone;
  return {total,done,percent: total?Math.round(done/total*100):0};
}

/* ===== IELTS 语音朗读 (Web Speech API / TTS) ===== */
function escAttr(s){ return esc(s==null?'':String(s)).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
let _speakToken=0;
function pickEnVoice(){
  try{ const vs=window.speechSynthesis.getVoices(); return vs.find(x=>/en[-_]US/i.test(x.lang))||vs.find(x=>/^en/i.test(x.lang))||null; }catch(e){ return null; }
}
function speakText(text,btn){
  try{ window.speechSynthesis.cancel(); }catch(e){}
  const myToken=++_speakToken;
  resetSpeakBtns();
  const chunks=(text||'').match(/[^\n.!?]+[.!?]+|\S+/g)||[text||''];
  let i=0;
  const speakNext=()=>{
    if(myToken!==_speakToken) return;
    if(i>=chunks.length){ if(btn){ btn.dataset.speaking='0'; btn.textContent='🔊'; } return; }
    const u=new SpeechSynthesisUtterance((chunks[i]||'').trim());
    u.lang='en-US'; u.rate=0.95; u.pitch=1;
    const v=pickEnVoice(); if(v) u.voice=v;
    u.onend=speakNext;
    try{ window.speechSynthesis.speak(u); }catch(e){}
    i++;
  };
  speakNext();
  if(btn){ btn.dataset.speaking='1'; btn.textContent='⏹'; }
}
function resetSpeakBtns(){ document.querySelectorAll('.speak-btn').forEach(b=>{ b.dataset.speaking='0'; b.textContent='🔊'; }); }
function speakFromBtn(btn){
  if(!('speechSynthesis' in window)){ alert('当前浏览器不支持语音朗读，建议使用 Chrome / Edge / Safari 打开本页面。'); return; }
  if(btn.dataset.speaking==='1'){ try{ window.speechSynthesis.cancel(); }catch(e){} _speakToken++; resetSpeakBtns(); return; }
  speakText(btn.dataset.text, btn);
}

  body+=`</div>`;
  return body;
