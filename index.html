    // === 每日时政 - 国内重点（排序第一，每日更新）===
    {id:'s_n23',title:'全国科技创新大会在京召开：部署"十五五"科技强国建设重点任务',category:'每日时政',region:'国内',url:'',summary:'大会明确到2030年关键核心技术自主可控取得决定性进展，量子信息、人工智能、集成电路等被列为攻关优先方向，新型举国体制再升级。',fullText:'全国科技创新大会近日在北京召开，会议系统部署"十五五"时期科技强国建设重点任务，明确提出到2030年关键核心技术自主可控取得决定性进展的总体目标。\n\n会议将量子信息、人工智能、集成电路、生物制造、空天科技等列为攻关优先方向，要求充分发挥新型举国体制优势，统筹国家战略科技力量、高水平研究型大学与科技领军企业协同攻关。\n\n针对当前"卡脖子"问题，会议提出实施一批具有前瞻性、战略性的国家重大科技项目，完善"揭榜挂帅""赛马"等机制，赋予科学家更大技术路线决定权和经费使用权。同时强调基础研究投入占研发经费比重到2030年达到8%以上。\n\n分析认为，此次大会释放出强烈信号：在外部技术封锁加剧背景下，科技自立自强已从战略口号转为系统性制度安排，相关产业链将迎来政策与资金双重加持。',date:'2026-07-31',createdAt:'2026-07-31T08:00:00'},
    {id:'s_n24',title:'国务院印发《关于促进服务消费高质量发展的意见》：19条举措提振内需',category:'每日时政',region:'国内',url:'',summary:'意见提出放宽服务业准入、培育数字消费与服务消费新场景，目标到2030年服务消费成为扩大内需重要引擎，银发、文旅、体育消费获重点支持。',fullText:'国务院办公厅近日印发《关于促进服务消费高质量发展的意见》，提出19条具体举措，旨在把服务消费打造为扩大内需的重要引擎。\n\n意见明确，要放宽服务业市场准入，合理缩减外商投资准入负面清单，率先在金融、电信、医疗、教育等领域推出一批开放举措。同时鼓励发展数字消费、绿色消费、健康消费等新场景，支持"服务+制造""服务+农业"融合业态。\n\n针对重点群体，意见专门部署银发消费（适老化改造、老年文旅）、文旅消费（演出赛事进景区、夜间经济）、体育消费（赛事经济、健身休闲）等专项行动。\n\n专家指出，我国服务消费占居民消费比重已超45%但仍低于发达国家60%左右的水平，提升空间巨大。在商品消费趋于饱和、外部需求不确定的背景下，服务消费扩容提质是稳定经济增长的关键抓手。',date:'2026-07-31',createdAt:'2026-07-31T08:00:00'},
    // === 每日时政 - 补充内容（每日更新，自动化每日8:00采集）===
    {id:'s_n27',title:'国务院常务会议：部署稳增长一揽子举措，加力支持设备更新与消费品以旧换新',category:'每日时政',region:'国内',url:'',summary:'会议确定加大财政货币政策调控力度，统筹安排3000亿元超长期特别国债资金支持设备更新和消费品以旧换新，并将补贴范围扩围至服务消费领域。',fullText:'国务院常务会议8月1日召开，研究部署稳增长、稳就业、稳预期一揽子举措。会议指出，当前经济延续回升向好态势，但有效需求不足、部分行业企业经营压力较大，要加大宏观调控力度。\n\n会议确定，统筹安排3000亿元超长期特别国债资金，加力支持大规模设备更新和消费品以旧换新。在原有汽车、家电基础上，将补贴范围进一步扩围至家居、数码产品及部分服务消费场景，并简化申领流程、提升资金拨付效率。\n\n同时，会议要求加快专项债发行使用，推动在建项目尽快形成实物工作量；落实落细结构性减税降费政策，重点支持科技创新和制造业发展。会议强调，要持续优化营商环境，提振民间投资信心。\n\n分析认为，此举是对7月中央政治局会议"宏观政策要持续用力、更加给力"要求的具体落实，有望在下半年有效托底内需、稳定经济增长大盘。',date:'2026-08-01',createdAt:'2026-08-01T08:00:00'},
    {id:'s_n28',title:'央行宣布全面降准0.5个百分点 释放长期资金约1万亿元',category:'每日时政',region:'国内',url:'',summary:'中国人民银行决定下调金融机构存款准备金率0.5个百分点，并同步下调7天期逆回购操作利率，引导社会综合融资成本稳中有降。',fullText:'中国人民银行8月1日宣布，自即日起下调金融机构存款准备金率0.5个百分点（不含已执行5%存款准备金率的金融机构），预计向市场释放长期流动性约1万亿元。\n\n与此同时，央行同步下调7天期逆回购操作利率10个基点，并推动贷款市场报价利率（LPR）随之下行，以降低实体经济融资成本。这是年内第二次全面降准，释放出加大逆周期调节、支持实体经济回升的明确信号。\n\n央行有关负责人表示，此次降准旨在保持银行体系流动性合理充裕，引导金融机构加大对重大战略、重点领域和薄弱环节的信贷支持，特别是科技创新、绿色转型、普惠小微和设备更新改造。\n\n市场机构普遍认为，降准将改善商业银行负债成本，为后续信贷扩张打开空间，对稳住下半年经济增长、提振市场信心具有积极作用。',date:'2026-08-01',createdAt:'2026-08-01T08:00:00'},
    {id:'s_n29',title:'国新办发布会：上半年GDP同比增长5.0% 经济运行总体平稳',category:'每日时政',region:'国内',url:'',summary:'国家统计局数据显示，上半年国内生产总值同比增长5.0%，规模以上工业增加值、服务业生产指数稳步回升，新质生产力加快培育，就业形势总体稳定。',fullText:'国务院新闻办公室7月31日举行新闻发布会，国家统计局介绍2026年上半年国民经济运行情况。初步核算，上半年国内生产总值（GDP）同比增长5.0%，增速较一季度持平，经济运行总体平稳、稳中有进。\n\n分产业看，第一产业增加值同比增长3.6%，第二产业增长5.4%，第三产业增长4.8%。规模以上工业增加值同比增长6.0%，服务业生产指数增长5.2%，均较一季度有所回升。高技术制造业、装备制造业增加值增速明显快于规模以上工业平均水平。\n\n新动能持续壮大，新能源汽车、锂离子电池、太阳能电池"新三样"出口保持较快增长，人工智能、低空经济、生物制造等新赛道投资活跃。上半年城镇调查失业率平均值为5.1%，就业形势总体稳定。\n\n专家指出，在外部环境复杂严峻、内部结构调整阵痛仍存的背景下，5.0%的增速彰显经济韧性，但需求不足仍是主要矛盾，需进一步加力扩内需、优结构。',date:'2026-07-31',createdAt:'2026-07-31T08:00:00'},
    {id:'s_n30',title:'国家发改委：新版《市场准入负面清单》缩减至106项 放宽民企准入',category:'每日时政',region:'国内',url:'',summary:'2026年版市场准入负面清单事项由117项缩减至106项，取消一批区域性、阶段性准入限制，进一步放宽民营企业市场准入，激发各类经营主体活力。',fullText:'国家发展改革委、商务部7月30日联合发布《市场准入负面清单（2026年版）》，将准入禁止和许可事项由2025年的117项缩减至106项，取消了一批区域性、阶段性准入管理措施。\n\n新版清单进一步放宽民营企业市场准入，明确"非禁即入"原则，凡清单之外的行业、领域、业务，各类市场主体均可依法平等进入。重点放开了新能源、新型储能、智能网联汽车、低空经济等新兴领域的准入限制。\n\n同时，清单强化了公平竞争审查，要求各地区、各部门不得在清单之外违规设置准入障碍，严禁以备案、注册、年检等形式变相设置门槛。对金融、电信、医疗等民生领域，在风险可控前提下稳步推进有序开放。\n\n业内认为，负面清单持续"瘦身"是建设全国统一大市场、提振民企信心的关键举措，有助于打破隐性壁垒、让各类资本平等参与竞争。',date:'2026-07-30',createdAt:'2026-07-30T08:00:00'},
    // === 时政文章 - 人民日报 / 半月谈 时评（精读）===
    {id:'s_n25',title:'人民日报评论员：以高质量发展扎实推进中国式现代化建设',category:'时政文章',region:'国内',url:'http://www.people.com.cn',summary:'文章指出，高质量发展是全面建设社会主义现代化国家的首要任务，必须把实施扩大内需战略同深化供给侧结构性改革有机结合，在转方式、调结构、提质量、增效益上积极进取。',fullText:'人民日报评论员文章强调，高质量发展是全面建设社会主义现代化国家的首要任务，是体现新发展理念的发展，是能够很好满足人民日益增长的美好生活需要的发展。\n\n文章指出，当前我国经济恢复仍处在关键阶段，必须把实施扩大内需战略同深化供给侧结构性改革有机结合，统筹扩大内需和深化供给侧结构性改革，形成需求牵引供给、供给创造需求的更高水平动态平衡。\n\n评论认为，要在转方式、调结构、提质量、增效益上积极进取，推动经济实现质的有效提升和量的合理增长。一方面要巩固和增强经济回升向好态势，另一方面要以科技创新引领现代化产业体系建设，加快形成新质生产力。\n\n文章最后强调，中国式现代化是干出来的，唯有迎难而上、真抓实干，才能把宏伟蓝图变为美好现实。',date:'2026-07-30',createdAt:'2026-07-30T08:00:00'},
    {id:'s_n26',title:'半月谈：基层减负不能止步于"表格瘦身"',category:'时政文章',region:'国内',url:'http://www.banyuetan.org',summary:'文章剖析基层治理"指尖上的形式主义"顽疾，指出减负须从考核指挥棒改起，减少留痕管理，让干部把精力真正用在为群众办实事上。',fullText:'半月谈刊发评论指出，近年来各地为基层减负出台不少举措，文山会海、报表台账有所减少，但"指尖上的形式主义"仍未根治——各类APP打卡、工作群轰炸、层层转发让基层干部疲于应付。\n\n文章认为，减负不能止步于"表格瘦身"，更要从考核指挥棒改起。一些地方考核过度依赖"留痕"，导致基层把大量精力花在"做给人看"上，而非解决实际问题。\n\n评论建议，应建立以实绩为导向的考核体系，能合并的考核坚决合并，能通过数据共享获取的信息不再要求基层重复填报，切实为基层松绑减负。\n\n文章最后呼吁，要让干部从"围着表格转"回归"围着群众转"，把时间和精力真正用在为群众办实事、解难题上。',date:'2026-07-29',createdAt:'2026-07-29T08:00:00'},
    // === 政治 - 国内 ===
    {id:'s_n1',title:'国务院常务会议部署扩大养老服务消费，补贴惠及约200万名失能老年人',category:'政治',region:'国内',url:'',summary:'民政部披露，向中度以上失能老年人发放消费补贴项目全国累计核销消费券1079.92万次，核销金额65.12亿元，带动养老服务消费290.93亿元。',fullText:'国务院常务会议近日审议通过了《关于扩大养老服务消费的若干措施》，部署多项举措全面激活银发经济市场。最受关注的是面向中度以上失能老年人的消费补贴项目——截至7月底，全国已累计核销养老服务消费券1079.92万次，核销金额65.12亿元，直接带动养老服务消费290.93亿元，杠杆效应约4.5倍。\n\n民政部相关负责人介绍，该补贴项目覆盖全国约200万名中度以上失能老年人，涵盖居家照护、社区日间照料、专业机构护理等多类服务。从区域分布看，东部沿海省份消费券使用率最高，中西部地区增长势头更为强劲。\n\n会议还提出，将进一步放宽养老服务市场准入，鼓励社会资本参与社区嵌入式养老设施建设，目标到2027年实现每个街道至少有一个具备全托、日托、上门服务等功能的综合养老服务中心。同时，将推动长期护理保险制度从49个试点城市向全国推开，建立统一的失能等级评估标准。\n\n业内分析认为，在人口老龄化加速背景下，养老服务已从"补短板"转向"促消费"新阶段。以消费补贴撬动市场、以制度保障稳定预期，将成为中国应对老龄化挑战的核心路径。',date:'2026-07-31',createdAt:'2026-07-31T08:00:00'},
    {id:'s_n2',title:'吴政隆湖北湖南调研：持续增强内生动力，推动经济向新向优向好发展',category:'政治',region:'国内',url:'',summary:'强调因地制宜发展新质生产力，推动制造业高端化、智能化、绿色化发展，培育壮大新兴产业和未来产业，促进AI赋能千行百业。',fullText:'国务院副总理吴政隆近日赴湖北、湖南两省调研经济运行情况，深入武汉东湖高新区、长沙经开区等地，实地考察新能源汽车、集成电路、生物医药等重点产业。\n\n调研中强调，要因地制宜发展新质生产力，不能"一哄而上"搞同质化竞争。中部地区要立足制造业基础优势，推动传统产业向高端化、智能化、绿色化转型，同时培育壮大新兴产业和未来产业。特别指出要促进人工智能赋能千行百业，加快工业大模型在制造、质检、物流等环节的落地应用。\n\n湖北方面，正在推进"光芯屏端网"万亿产业集群建设，长江存储扩产项目预计年底投产；湖南方面，工程机械产业集群智能化改造完成率已超过60%，三一重工、中联重科等龙头企业灯塔工厂建设进展顺利。\n\n吴政隆要求两省在稳定经济基本盘的同时，积极扩内需、促消费，落实好"两新"政策，推动经济向新向优向好发展。',date:'2026-07-05',createdAt:'2026-07-05T08:00:00'},
    {id:'s_n3',title:'斯洛伐克总统访华，习近平：打造稳定坚韧的中斯战略伙伴关系',category:'政治',region:'国内',url:'',summary:'斯洛伐克总统Pellegrini应邀访华3天。习近平表示双方要巩固战略互信、深化互利合作。中国是斯洛伐克在欧盟外最大贸易伙伴，H1双边贸易额40.09亿美元。',fullText:'斯洛伐克总统彼得·佩列格里尼（Peter Pellegrini）应邀对中国进行为期3天的国事访问。7月27日，国家主席习近平在人民大会堂与佩列格里尼举行会谈，双方就深化双边关系及共同关心的国际和地区问题深入交换意见。\n\n习近平表示，中斯传统友谊深厚，双方要巩固战略互信，深化互利合作，打造稳定坚韧的中斯战略伙伴关系。他指出，中国是斯洛伐克在欧盟外最大贸易伙伴，今年上半年双边贸易额达40.09亿美元，同比增长超过7%。双方在汽车制造、新能源、数字经济等领域合作潜力巨大。\n\n佩列格里尼表示，斯洛伐克坚定奉行一个中国政策，愿同中方加强在经贸、投资、科技创新等领域的务实合作，欢迎更多中国企业赴斯投资兴业。\n\n会谈后，两国元首共同见证了共建"一带一路"、经贸、农业、教育等领域多项双边合作文件的签署。分析人士认为，作为欧盟成员国和"一带一路"沿线重要节点，斯洛伐克有望成为中欧经贸合作的新支点。',date:'2026-07-27',createdAt:'2026-07-27T16:00:00'},
    // === 政治 - 国外 ===
    {id:'s_n4',title:'美国白宫宣布对约60个贸易伙伴加征10%-12.5%关税，覆盖99.4%进口商品',category:'政治',region:'国外',url:'',summary:'依据301条款对约60个贸易伙伴加征关税，覆盖美国99.4%进口商品，涉及商品价值超3万亿美元。对中国大陆、日韩等41个贸易伙伴施行12.5%税率。',fullText:'美国白宫于7月24日正式宣布，依据《1974年贸易法》301条款，对约60个贸易伙伴全面加征10%至12.5%不等的进口关税。这将是自1930年《斯穆特-霍利关税法》以来美国最大规模的单边关税行动。\n\n根据公布的清单，新关税覆盖美国99.4%的进口商品，涉及商品价值超过3万亿美元。其中对中国大陆、日本、韩国、德国等41个贸易伙伴施行最高12.5%的税率，对其他约20个国家施行10%的基础税率。\n\n白宫声明称此举旨在"纠正长期存在的贸易不平衡，保护美国工人和制造业"。但经济学家普遍警告，全面关税将推高美国国内通胀，预计CPI可能因此在未来12个月内额外上升1.5-2个百分点。\n\n中国商务部第一时间回应称"坚决反对"，将采取必要反制措施，维护中国企业合法权益。欧盟、日本、韩国等也纷纷表达严重关切，WTO总干事警告此举可能引发全球贸易体系的系统性危机。全球金融市场对此反应剧烈，美股三大指数当日跌幅均超过2%。',date:'2026-07-24',createdAt:'2026-07-24T16:00:00'},
    {id:'s_n5',title:"CNN Poll: 73% of Americans Say Trump Not Focused on Country's Most Important Problems",category:'政治',region:'国外',url:'https://edition.cnn.com',summary:"CNN-SSRS民调显示，创纪录73%美国成年人认为特朗普未足够关注国家最重要问题，总体支持率34%追平生涯低点。仅28%认可伊朗局势处理、25%认可通胀应对。",fullText:"A new CNN poll conducted by SSRS reveals that a record 73% of American adults believe President Donald Trump is not paying enough attention to the country's most important problems — the highest level of dissatisfaction recorded for any president in CNN polling history.\n\nThe survey, released July 29, shows Trump's overall approval rating has slipped to 34%, matching his career low. On specific issues, only 28% approve of his handling of the Iran situation, 25% approve of his inflation response, and 31% approve of his economic management.\n\nThe poll highlights growing frustration over tariff policy, with 62% saying the recent tariffs have hurt their household finances. Among independent voters — a crucial bloc — Trump's approval stands at just 27%. The poll surveyed 1,212 adults with a margin of error of ±3.2 percentage points.\n\nRepublican strategists are increasingly concerned that the tariff-heavy agenda is alienating swing voters ahead of the midterm elections, with consumer prices continuing to rise and job growth slowing in manufacturing-heavy states.",date:'2026-07-29',createdAt:'2026-07-29T20:00:00'},
    {id:'s_n6',title:"CNN Exclusive: Ukraine's AI-Commanded Drone System PRISMA Strikes Russian Targets",category:'政治',region:'国外',url:'https://edition.cnn.com',summary:"CNN罕入乌克兰国防部秘密指挥中心，披露PRISMA AI系统实时指挥数百架无人机对俄本土与后方实施定点清除，命中率已升至80%以上。",fullText:"In a rare exclusive access, CNN entered Ukraine's classified defense ministry command center to document PRISMA — an artificial intelligence system now commanding hundreds of drones simultaneously in strikes against Russian territory and rear positions.\n\nPRISMA, developed by Ukraine's Delta technology division in partnership with Western AI companies, uses machine learning to process real-time satellite imagery, signals intelligence, and drone feeds to identify, prioritize, and assign targets autonomously. Military officials told CNN the system's hit rate has improved to over 80%, a dramatic increase from approximately 45% for manually-operated drone strikes.\n\nThe system can coordinate swarm attacks of up to 200 drones simultaneously, overwhelming Russian air defense systems through sheer volume and adaptive flight patterns. Ukrainian commanders credit PRISMA with destroying dozens of ammunition depots, fuel storage facilities, and command posts deep inside Russian territory over the past three months.\n\nThe report raises significant ethical questions about autonomous weapons systems and the accelerating role of AI in modern warfare, with human rights organizations calling for immediate international regulation of AI-commanded lethal systems.",date:'2026-07-29',createdAt:'2026-07-29T20:00:00'},
    // === 经济 - 国内 ===
    {id:'s_n7',title:'年中经济观察：算电协同绿电直供项目投运，1千瓦时电实现22倍价值跃升',category:'经济',region:'国内',url:'',summary:'我国首个大规模"算电协同"绿电直供项目——中国大唐中卫云基地50万千瓦光伏电站投运。在广东汕头，0.5元的1千瓦时电通过AI算力加工成词元出海，价值跃升至11元。',fullText:'我国首个大规模"算电协同"绿电直供项目——中国大唐中卫云基地50万千瓦光伏电站正式投运，标志着"绿色电力+智算中心"融合发展模式迈入商业化运营阶段。\n\n该项目位于宁夏中卫西部云基地，年发电量约9亿千瓦时，直接供给周边多家数据中心，实现绿电就地消纳。与传统"电网购电"模式相比，绿电直供使算力中心用电成本下降约30%，且碳排放趋近于零。\n\n更具深远意义的是"1度电的22倍价值跃升"：在广东汕头华侨试验区，一度0.5元的绿电通过AI算力加工为高质量训练语料（词元/token）后出口，其市场价值可达11元，实现约22倍的增值。这种"算电协同+AI出海"模式正在被多个省份复制。\n\n国家发改委表示，将推动在西部风光资源富集区规划建设10个以上国家级算电协同示范区，到2028年实现绿电直供算力占比超过50%。这一战略既解决了AI算力的能源瓶颈，又为西部可再生能源找到高附加值消纳途径。',date:'2026-07-24',createdAt:'2026-07-24T08:00:00'},
    {id:'s_n8',title:'年中经济观察：民生保障扎实有力，育儿补贴全面开放申领',category:'经济',region:'国内',url:'',summary:'育儿补贴全面开放申领，每孩每年3600元；今年将新增普惠托位15万个。新版国家医保药品目录新增114种药品，居民医保人均财政补助标准进一步提高。',fullText:'在国家"扩内需、促消费"的战略部署下，多项重量级民生保障政策于近日集中落地。最受年轻家庭关注的是育儿补贴全面开放申领——每孩每年可领取3600元，覆盖0-3岁婴幼儿家庭，不受户籍限制，通过"掌上12333"APP即可自主申领。\n\n托育方面，国家卫健委宣布今年将新增普惠托位15万个，重点布局在人口流入量大的城市新城区和产业园区周边。同时提高托育机构建设补贴标准，鼓励用人单位为职工提供福利性托育服务。\n\n医疗领域，2026版国家医保药品目录于7月1日正式执行，新增114种药品，包括17种罕见病用药和23种儿童用药。居民医保人均财政补助标准再提高30元，达到每人每年670元。\n\n央行数据显示，上半年住户存款增加8.2万亿元，居民消费意愿有所回升但仍有待提振。专家认为，在当前外需不确定性加大的背景下，织密扎牢民生保障网既是发展目的，也是扩内需、稳增长的关键支撑。',date:'2026-07-25',createdAt:'2026-07-25T08:00:00'},
    {id:'s_n9',title:"China's H1 GDP Grows 4.7%, Remaining Well Within Annual Target",category:'经济',region:'国内',url:'https://www.globaltimes.cn',summary:"China's GDP expanded by 4.7% YoY to 69.57 trillion yuan ($10.28 trillion) in H1 2026. China-US goods trade hit 2 trillion yuan in H1, with Q2 growing 13.7%.",fullText:"China's economy demonstrated resilience in the first half of 2026, with GDP expanding 4.7% year-on-year to reach 69.57 trillion yuan (approximately $10.28 trillion), according to data released by the National Bureau of Statistics on July 28.\n\nThe growth rate positions China comfortably within its annual target range, driven by strong performances in high-tech manufacturing (+9.2%), digital economy sectors (+11.4%), and a rebounding services sector. Retail sales grew 5.1% in June, the fastest pace in 15 months, signaling improving consumer confidence.\n\nNotably, China-US goods trade hit 2 trillion yuan in H1 2026, with Q2 alone growing 13.7% year-on-year despite ongoing tariff tensions. Analysts attribute the surge partly to front-loading of orders ahead of the new US tariff implementation.\n\nFixed-asset investment grew 4.8%, with infrastructure investment up 7.2% boosted by accelerated special bond issuance. The surveyed urban unemployment rate stood at 5.1%, relatively stable. However, the property sector continued to contract (-3.2%) though at a slower pace than in 2025.\n\nLooking ahead, economists expect a modest acceleration in H2 driven by fiscal stimulus measures and potential monetary easing, with full-year GDP growth forecast at 4.8-5.0%.",date:'2026-07-28',createdAt:'2026-07-28T10:00:00'},
    {id:'s_n10',title:"China's New Quality Productive Forces Show Strong H1 Growth",category:'经济',region:'国内',url:'https://www.globaltimes.cn',summary:"最新税收数据反映中国新质生产力H1强劲增长态势。中欧班列累计开行超13万列，货值超5200亿美元。",fullText:"Latest tax revenue data released by the State Taxation Administration reveals the robust growth trajectory of China's 'new quality productive forces' in the first half of 2026, painting a picture of accelerating industrial upgrading and innovation-driven economic transformation.\n\nHigh-tech manufacturing sectors including integrated circuits, new energy vehicles, and advanced robotics recorded tax revenue growth exceeding 15% year-on-year, significantly outpacing the broader manufacturing average of 5.2%. R&D expenditure tax credits claimed by enterprises surged 23%, indicating sustained corporate investment in innovation.\n\nOn the trade front, the China-Europe Railway Express reached a cumulative milestone of over 130,000 train trips, with total cargo value exceeding $520 billion. The service now connects 223 cities across 25 European countries, with train frequency up 12% year-on-year.\n\nMeanwhile, China's 'AI Plus' initiative is gaining momentum — the number of enterprises deploying industrial AI applications rose 67% compared to the same period last year, with manufacturing firms leading adoption in quality inspection, predictive maintenance, and supply chain optimization.\n\nThe data underscores that despite external headwinds, China's push for high-quality development is producing measurable results, with innovation-intensive sectors becoming increasingly important drivers of economic growth.",date:'2026-07-28',createdAt:'2026-07-28T10:00:00'},
    // === 经济 - 国外 ===
    {id:'s_n11',title:'日韩股市熔断暴跌：KOSPI跌逾10%，日经跌近4%',category:'经济',region:'国外',url:'',summary:'韩国KOSPI盘中触发熔断，收盘跌10.84%报6023点；日经跌3.95%报62364点。主要受隔夜美股暴跌和科技股遭大幅抛售影响。日经较6月高点跌约14%，KOSPI较高点跌逾35%。',fullText:'亚洲股市7月28日遭遇"黑色星期一"，韩国KOSPI指数盘中触发熔断机制，收盘暴跌10.84%至6023点，创下2020年3月以来最大单日跌幅。日本日经225指数重挫3.95%至62364点，东证指数（TOPIX）下跌4.2%。\n\n暴跌的主要触发因素包括：隔夜美国三大股指暴跌（纳斯达克跌逾3%），投资者对全球经济衰退的担忧急剧升温，以及对AI科技股估值泡沫的恐慌性去杠杆。\n\n韩国市场方面，三星电子单日暴跌13.2%，SK海力士下跌15.6%，两大权重股市值一日蒸发超过1200亿美元。韩国金融委员会紧急召开会议，宣布启动股市稳定基金。\n\n日本方面，日经指数较6月创下的历史高点已累计下跌约14%，KOSPI较年初高点跌幅更超过35%，已进入技术性熊市。半导体、汽车出口等权重板块领跌。\n\n分析师指出，美国新一轮关税的不确定性叠加全球科技股估值调整，短期内亚洲市场可能继续承压，但部分机构认为急跌也创造了结构性买入机会，尤其是基本面扎实的半导体设备与电动车供应链标的。',date:'2026-07-28',createdAt:'2026-07-28T16:00:00'},
    {id:'s_n12',title:'比亚迪日本发售纯电微型车Racco，上半年在日销量同比增长43%',category:'经济',region:'国外',url:'',summary:'比亚迪推出首款为日本K-Car标准设计的电动轻型车Racco，最低售价214.5万日元(约1.3万美元)。2026年上半年比亚迪在日销量2334台，同比增长43%。',fullText:'中国新能源汽车巨头比亚迪正式在日本市场推出纯电微型车"Racco"（日规名称），这是首款严格遵循日本K-Car标准设计的中国品牌电动轻型车，标志着中国EV制造商在日本本土化战略的重大突破。\n\nRacco凭借紧凑车身（长3.4米、宽1.48米）完美适配日本狭窄街道和停车空间，搭载比亚迪自研刀片电池，续航里程达280公里（WLTC标准），最低售价214.5万日元（约合1.3万美元），显著低于日本本土同级别电动K-Car。\n\n比亚迪日本公司披露，2026年上半年在日累计销量达2334台，同比增长43%，主要得益于ATTO 3（元PLUS海外版）和DOLPHIN的持续热销。Racco的加入预计将大幅扩大比亚迪在日本的价格带覆盖范围——从高端SUV到经济型城市通勤车。\n\n日本是全球第三大汽车市场，K-Car年销量约150万台，占总市场的35%以上。此前这一领域几乎被日本本土品牌垄断。比亚迪的入局被日本媒体称为"K-Car市场的黑船来航"，预计将加速日本汽车产业电动化转型，同时也面临售后网络与品牌信任度的持续挑战。',date:'2026-07-28',createdAt:'2026-07-28T16:00:00'},
    // === ESG - 国内 ===
    {id:'s_n13',title:'生态环境部发布《2026年全国碳市场发展报告》：碳价突破120元/吨',category:'ESG',region:'国内',url:'',summary:'全国碳市场累计成交量突破8亿吨，碳价年内涨幅达35%突破120元/吨。钢铁、水泥、电解铝行业将于Q4正式纳入碳市场交易，覆盖排放量将翻倍至约80亿吨。',fullText:'生态环境部7月30日正式发布《2026年全国碳市场发展报告》，披露了一系列关键数据和重大政策进展。截至7月底，全国碳排放权交易市场累计成交量突破8亿吨，累计成交额超过600亿元。更引人注目的是碳价走势——年内涨幅已达35%，7月30日收盘价突破120元/吨，创历史新高。\n\n报告确认，钢铁、水泥、电解铝三大行业将于今年第四季度正式纳入全国碳市场交易。这将使碳市场覆盖的碳排放总量从目前的约50亿吨翻倍至约80亿吨，占全国碳排放总量的70%以上，届时中国碳市场将成为全球覆盖排放量最大的碳排放权交易体系。\n\n报告还首次提出"碳金融"发展路线图：将有序推出碳期货、碳远期等衍生品，研究引入合格境外投资者参与碳市场交易。碳价上涨趋势叠加碳金融工具丰富，预计将加速企业低碳转型的资本投入。\n\n中国碳市场自2021年7月启动以来，已从单一电力行业扩展至多行业覆盖，碳价从启动初期的48元/吨稳步攀升至今。分析认为，碳价突破120元意味着碳成本开始对企业投资决策产生实质性影响。',date:'2026-07-30',createdAt:'2026-07-30T09:00:00'},
    {id:'s_n14',title:'三大交易所同步发布《上市公司可持续发展报告编制指南》',category:'ESG',region:'国内',url:'',summary:'沪深北交易所联合发布ESG报告编制指南，要求上证180、科创50、深证100成分股公司2027年起强制披露。指南对标ISSB准则，细化气候情景分析和社会责任量化指标。',fullText:'上海证券交易所、深圳证券交易所、北京证券交易所于7月29日同步发布《上市公司可持续发展报告编制指南》，这是中国ESG信息披露制度建设的里程碑事件。\n\n指南明确要求：上证180指数、科创50指数、深证100指数成分股公司自2027年起强制披露可持续发展报告，其他上市公司鼓励自愿披露但须遵循"不披露即解释"原则。指南全面对标国际可持续准则理事会（ISSB）的IFRS S1和S2准则，在保持国际接轨的同时兼顾中国国情。\n\n尤其值得关注的是，指南首次细化了气候情景分析的披露要求——要求公司披露在1.5°C和2°C升温情景下的转型风险与物理风险评估，包括碳定价假设、技术替代成本、极端天气对资产的影响等量化指标。\n\n社会责任维度，指南要求量化披露员工培训投入、供应链审计覆盖率、社区投资金额等指标并在行业内进行对标比较。指南还设置了三年过渡期，允许企业逐步提升披露的精细化水平。\n\n市场人士认为，强制ESG披露将重塑A股估值体系，ESG表现优异的公司将获得更低的融资成本和更高的估值溢价。',date:'2026-07-29',createdAt:'2026-07-29T09:00:00'},
    {id:'s_n15',title:'国务院办公厅印发《加快构建碳排放双控制度体系工作方案》',category:'ESG',region:'国内',url:'',summary:'明确"十五五"时期将碳排放指标纳入国民经济和社会发展规划，建立碳预算管理制度。到2027年初步建成碳排放双控制度体系，碳强度降低目标完成率纳入地方政府考核。',fullText:'国务院办公厅近日印发《加快构建碳排放双控制度体系工作方案》，标志着中国碳排放管理从"能耗双控"向"碳排放双控"的全面转型正式进入制度化建设阶段。\n\n方案核心要点包括：一是将碳排放指标纳入"十五五"国民经济和社会发展规划纲要，作为约束性指标分解至各省份和重点行业；二是建立碳预算管理制度，在试点省份率先实施碳排放总量预算管理，设定年度排放上限；三是到2027年初步建成覆盖国家、省、市三级的碳排放双控制度体系，碳强度降低目标完成率正式纳入地方政府绩效考核。\n\n方案还提出将建立碳排放"红黄绿"分区管控机制，碳排放强度高于全国平均水平30%以上的区域将被划为"红灯区"，暂停新增高碳项目审批。同时，推动碳排放评价纳入固定资产投资项目节能审查和环评体系。\n\n业内认为，这一制度安排将从根本上改变地方政府的经济发展逻辑——"碳排放空间"将成为与土地指标、能耗指标同等甚至更为稀缺的发展要素，倒逼产业结构和能源结构的加速转型。',date:'2026-07-22',createdAt:'2026-07-22T09:00:00'},
    // === ESG - 国外 ===
    {id:'s_n16',title:'EU正式实施碳边境调节机制(CBAM)第二阶段，覆盖范围扩大至有机化学品和聚合物',category:'ESG',region:'国外',url:'',summary:'CBAM第二阶段于7月1日生效，新增覆盖有机化学品和聚合物品类，进口商需按季度报告嵌入碳排放。预计2030年前将覆盖所有EU-ETS行业，对中国化工出口影响显著。',fullText:'欧盟碳边境调节机制（CBAM）第二阶段于7月1日正式生效，在原有钢铁、铝、水泥、化肥、电力、氢六个行业基础上，新增覆盖有机化学品和聚合物（塑料初级形态）两大品类。进口商须按季度向CBAM登记系统报告产品的嵌入碳排放数据。\n\n这意味着中国对欧出口的化工产品将首次面临碳关税成本。据中国石油和化学工业联合会估算，第二阶段覆盖的中国对欧化工出口年价值约180亿欧元，按当前EU-ETS碳价（约85欧元/吨）计算，CBAM证书成本可能占到出口额的5%-8%，对中小化工企业冲击尤大。\n\n欧盟委员会同时公布了第三阶段路线图：2028年起将CBAM覆盖范围扩展至所有EU-ETS行业（包括炼油、造纸、玻璃等），并取消目前的间接排放豁免，届时中国几乎全部工业品对欧出口都将受CBAM约束。\n\n中国商务部表示正在密切跟踪CBAM实施进展，支持国内企业建立产品碳足迹核算能力。生态环境部已启动CBAM应对专项工作，覆盖碳核算方法、数据库建设和国际互认谈判三大领域。长远来看，CBAM将加速中国碳市场与欧盟碳市场的制度对接，推动全球碳定价体系的协调。',date:'2026-07-20',createdAt:'2026-07-20T14:00:00'},
    {id:'s_n17',title:'日本熊本7.1级强地震：18人死亡，约1万人紧急疏散',category:'ESG',region:'国外',url:'',summary:'7月28日熊本县发生7.1级地震并触发海啸预警，为2016年以来最强。日本防卫省已派出4600名自卫队员参与救援。气象厅预计未来一周可能再次发生同等规模强震。',fullText:'7月28日下午，日本九州熊本县发生里氏7.1级强烈地震，震源深度约12公里，属浅源地震。地震触发海岸线海啸预警（预计浪高1-3米），约1万人被紧急疏散至避难所。截至29日，已确认至少18人死亡、超过200人受伤。\n\n这是自2016年熊本大地震以来九州地区遭受的最强地震。日本防卫省已紧急派遣4600名陆上自卫队员及多架直升机参与救援，重点搜救倒塌建筑物下的被困人员。熊本机场一度关闭进行跑道安全检查，九州新干线全线暂停运行。\n\n台积电位于熊本县的JASM晶圆厂（日本先进半导体制造公司）宣布部分产线暂停运转进行安全检测，预计将影响约2周的产能输出，对全球车用芯片供应链形成短期扰动。\n\n日本气象厅发出警告：未来一周内该区域有约30%概率再次发生里氏7级左右的强震，呼吁民众保持高度警惕。此外，地震引发的山体滑坡造成多处道路中断，救援物资运输面临困难。\n\n对于关注半导体供应链和保险行业的投资者而言，此次地震可能推高再保险费率并短期内利好存储芯片价格，建议持续跟踪JASM复产进度。',date:'2026-07-28',createdAt:'2026-07-28T16:00:00'},
    // === AI - 国内 ===
    {id:'s_n18',title:'全球下载量突破100亿次：中国开源AI模型海外影响力持续攀升',category:'AI',region:'国内',url:'',summary:'工信部披露，中国开源AI模型全球累计下载量超100亿次，AI技术在全国主要企业渗透率超30%。全国已研发超400款人形机器人产品，AI赋能千行百业加速推进。',fullText:'工信部在最新发布的《中国人工智能产业发展报告（2026年上半年）》中披露，中国开源AI模型全球累计下载量已突破100亿次，来自Hugging Face等国际平台的数据显示，阿里通义千问、智谱GLM、深度求索DeepSeek等国产模型跻身全球下载量前20。\n\n报告指出，AI技术在全国主要企业中的渗透率已超过30%，其中制造业AI采用率增长最快（+12pp YoY），主要应用于质量检测（覆盖率达43%）、设备预测性维护（31%）和智能排产（27%）。\n\n人形机器人方面，全国已研发超过400款产品，宇树科技（Unitree）、优必选（UBTECH）、智元机器人等企业加速量产，成本已降至10-30万元区间。预计2027年中国人形机器人市场规模将突破500亿元。\n\n工信部明确下一步将重点推进AI在新型工业化中的深度应用，强化算力基础设施建设（全国智算中心总算力已超过500 EFLOPS），同时加强AI安全治理，推动AI立法进程。\n\n国际观察人士指出，中国开源AI的崛起正在改变全球AI竞争格局——从模型能力竞赛转向应用生态和产业渗透的全面竞争。',date:'2026-07-20',createdAt:'2026-07-20T10:00:00'},
    {id:'s_n19',title:'我国IC出口H1同比增88.7%；月之暗面Kimi K3暂停新订阅',category:'AI',region:'国内',url:'',summary:'全球AI需求旺盛推动中国IC出口H1同比增88.7%。月之暗面Kimi K3(2.8T参数)因访问量暴增算力告急暂停新订阅，创始团队紧急部署万卡集群扩容。',fullText:'海关总署最新数据显示，2026年上半年中国集成电路出口额同比暴增88.7%，达到历史新高。AI芯片、存储芯片和电源管理IC是三大增长极，其中AI推理芯片出口量增长尤为突出，反映出全球AI算力基础设施建设的巨大需求缺口。\n\n与此同时，国内大模型赛道出现标志性事件：月之暗面（Moonshot AI）旗下2.8万亿参数旗舰模型Kimi K3因访问量暴增导致算力严重不足，被迫暂停新用户订阅。公司CEO杨植麟发布全员信致歉，称"低估了市场对超大规模MoE模型的真实需求"，团队正紧急部署万卡GPU集群进行扩容，预计8月中旬恢复服务。\n\nKimi K3是目前全球参数规模最大的开源大语言模型之一，在多项国际基准测试中表现出色，上线一个月即积累超过3000万用户。此次"幸福的烦恼"也折射出中国大模型产业的算力瓶颈——尽管国产AI芯片性能快速提升，但在大规模训练和推理场景中仍高度依赖英伟达等进口GPU。\n\n业内分析认为，IC出口暴增与K3算力告急两则消息从供需两端说明：AI产业的"烧卡"速度远超算力建设速度，算力将在未来2-3年内持续成为最稀缺的AI基础设施资源。',date:'2026-07-20',createdAt:'2026-07-20T10:00:00'},
    {id:'s_n20',title:'工信部印发《人工智能赋能新型工业化行动方案(2026-2028)》',category:'AI',region:'国内',url:'',summary:'提出到2028年建成50个以上AI赋能新型工业化标杆园区，培育100个以上行业大模型，AI在制造业关键工序渗透率提升至40%。重点攻关工业大模型训练框架和边缘推理芯片。',fullText:'工信部正式印发《人工智能赋能新型工业化行动方案（2026-2028年）》，这是继"人工智能+"行动之后，中国推动AI与制造业深度融合的纲领性文件。\n\n方案提出三大核心目标：到2028年，建成50个以上AI赋能新型工业化标杆园区，覆盖装备制造、电子信息、新材料等重点领域；培育100个以上面向垂直行业的工业大模型，在研发设计、生产制造、经营管理、产品服务等全流程嵌入AI能力；将AI在制造业关键工序的渗透率从当前的30%提升至40%以上。\n\n技术攻关方面，方案明确重点突破工业大模型训练框架（支持国产芯片适配）、边缘推理芯片（功耗低于5W、算力超过40 TOPS）、工业多模态数据融合等核心短板。同时设立"AI+工业软件"专项，推动AI与国产CAD/CAE/EDA等工业软件的深度融合。\n\n投资界对此反应积极——工业AI被视为继消费互联网后最大的软件市场。据测算，中国工业AI市场规模将在2028年突破2000亿元。工业视觉检测、预测性维护、智能排产等环节将率先受益。高确定性投资关注的方向包括：工业AI平台厂商、工业机器视觉、边缘计算芯片。\n\n注：该政策对于比亚迪（智能制造标杆工厂）、宁德时代（AI驱动材料研发）等制造业龙头具有重要赋能力。',date:'2026-07-25',createdAt:'2026-07-25T10:00:00'},
    // === AI - 国外 ===
    {id:'s_n21',title:"White House Launches AI Cybersecurity Clearinghouse 'Gold Eagle'",category:'AI',region:'国外',url:'https://edition.cnn.com',summary:"白宫设立Gold Eagle AI网络安全协调平台，由财政部、国土安全部和五角大楼共同运作。AI和网络安全公司通过该平台与关键基础设施提供商协调漏洞发现与修补。",fullText:"The White House has officially launched 'Gold Eagle,' a first-of-its-kind AI cybersecurity clearinghouse designed to protect America's critical infrastructure from AI-powered cyber threats. The platform is jointly operated by the Treasury Department, Department of Homeland Security, and the Pentagon.\n\nGold Eagle will serve as a real-time information sharing hub where AI companies and cybersecurity firms can coordinate vulnerability discovery and patching with critical infrastructure providers — including power grids, water systems, financial networks, and telecommunications. The platform employs AI itself to triage threat intelligence, automatically matching discovered vulnerabilities with affected infrastructure operators.\n\nTreasury Secretary emphasized the financial sector's vulnerability: 'A coordinated AI-powered attack on our payment systems could have cascading effects across the global economy. Gold Eagle ensures we detect and neutralize threats before they materialize.'\n\nMajor AI labs including OpenAI, Anthropic, Google DeepMind, and Microsoft have committed to sharing model vulnerability data through the platform. The initiative also includes a $500 million fund for upgrading legacy infrastructure cybersecurity, with priority given to smaller municipal utilities that lack dedicated security teams.\n\nCritics note that the platform's effectiveness depends on voluntary participation from the private sector, and question whether the framework adequately addresses AI supply chain risks — particularly vulnerabilities in widely-used open-source AI models.",date:'2026-07-12',createdAt:'2026-07-12T20:00:00'},
    {id:'s_n22',title:"Microsoft CEO Nadella Warns Against Over-Reliance on Single AI",category:'AI',region:'国外',url:'https://edition.cnn.com',summary:"微软CEO纳德拉警告：完全依赖专有AI实验室的企业终将难以为继。呼吁企业保留自身数据元数据、部署AI网关隔离提示词与模型，避免将'思考'外包。",fullText:"In a high-profile keynote at the Aspen Ideas Festival, Microsoft CEO Satya Nadella issued a stark warning to enterprises: companies that become entirely dependent on proprietary AI labs will ultimately find themselves unsustainable. His remarks represent one of the most candid assessments yet from a leader of a major AI provider about the risks of AI vendor lock-in.\n\nNadella outlined three strategic imperatives for enterprise AI adoption: First, companies must retain full ownership and metadata of their proprietary data — 'Your data ontology is your competitive moat; never hand it over.' Second, deploy AI gateways that isolate prompts from models, enabling switching between providers without rebuilding the entire AI stack. Third, avoid 'outsourcing thinking' — AI should augment human decision-making, not replace it.\n\nThe speech comes amid growing corporate anxiety about over-dependence on a handful of AI providers. Recent research by Gartner suggests that 65% of Fortune 500 companies now use AI models from three or fewer providers, creating significant concentration risk.\n\nNadella's comments also signal Microsoft's strategic positioning: the company is betting that enterprises will prefer multi-model, multi-cloud AI architectures over single-vendor lock-in — a strategy that differentiates Azure's AI platform from vertically integrated competitors. The remarks may also be read as a subtle critique of OpenAI's growing direct enterprise ambitions.",date:'2026-07-28',createdAt:'2026-07-28T20:00:00'}

function today(){ return new Date().toISOString().split('T')[0]; }
function now(){ return new Date().toISOString(); }

// 按日期确定性轮换科普池：同一天结果稳定，跨天自动刷新
function dailyRotate(pool, count, offset){
  const n=parseInt(today().replace(/-/g,''),10);
  const start=((n+(offset||0))%pool.length+pool.length)%pool.length;
  const rotated=[...pool.slice(start),...pool.slice(0,start)];
  return rotated.slice(0,count);
}

/* ============================================
   每周健康打卡（饮食 / 护肤 / 锻炼 / 早睡）
   - 数据按「周」组织，周一自动重置并归档上周
   - 月末 / 年末自动形成统计图（见 renderHealthStatsCard）
   ============================================ */
const WEEK_DAYS=['一','二','三','四','五','六','日'];
const DIET_MEALS=[{key:'breakfast',label:'🌅 早餐'},{key:'lunch',label:'☀️ 午餐'},{key:'dinner',label:'🌙 晚餐'}];
const SKIN_ITEMS=[{key:'eye',label:'👁️ 眼膜'},{key:'clean',label:'🧼 清洁'},{key:'massage',label:'💆 按摩'},{key:'hydrate',label:'💧 补水'}];

function fmtYMD(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const da=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${da}`;
}
function getMondayDate(){
  const d=new Date();
  const day=(d.getDay()+6)%7; // 周一=0
  d.setDate(d.getDate()-day);
  d.setHours(0,0,0,0);
  return d;
}
function getMonday(){ return fmtYMD(getMondayDate()); }
function getWeekdayIdx(){ const d=new Date(); return (d.getDay()+6)%7; } // 周一=0..周日=6

function defaultHealth(weekStart){
  return {
    weekStart,
    diet:{breakfast:Array(7).fill(false),lunch:Array(7).fill(false),dinner:Array(7).fill(false)},
    skin:{eye:Array(7).fill(false),clean:Array(7).fill(false),massage:Array(7).fill(false),hydrate:Array(7).fill(false)},
    exercise:Array(7).fill(false),
    earlySleep:Array(7).fill(false),
    quality:Array(7).fill('')
  };
}
function weekLabelOf(ws){
  const d=new Date(ws+'T00:00:00');
  const onejan=new Date(d.getFullYear(),0,1);
  const week=Math.ceil((((d-onejan)/86400000)+onejan.getDay()+1)/7);
  return d.getFullYear()+'-W'+String(week).padStart(2,'0');
}
function healthWeekSummary(h){
  const dietTotal=3*7;
  const dietDone=['breakfast','lunch','dinner'].reduce((s,k)=>s+(h.diet[k]||[]).filter(Boolean).length,0);
  const skinCount=['eye','clean','massage','hydrate'].reduce((s,k)=>s+(h.skin[k]||[]).filter(Boolean).length,0);
  const exerciseCount=(h.exercise||[]).filter(Boolean).length;
  const earlySleepCount=(h.earlySleep||[]).filter(Boolean).length;
  const qualityGood=(h.quality||[]).filter(q=>q==='good').length;
  return {weekStart:h.weekStart,weekLabel:weekLabelOf(h.weekStart),dietDone,dietTotal,dietPct:Math.round(dietDone/dietTotal*100),skinCount,exerciseCount,earlySleepCount,qualityGood};
}
function archiveHealthWeek(){
  const h=DATA.health; if(!h) return;
  const s=healthWeekSummary(h);
  if(s.dietDone+s.skinCount+s.exerciseCount+s.earlySleepCount===0) return; // 跳过空周
  DATA.healthArchive=DATA.healthArchive||[];
  if(!DATA.healthArchive.some(a=>a.weekStart===s.weekStart)) DATA.healthArchive.push(s);
}
function ensureHealth(){
  if(!DATA.health || DATA.health.weekStart!==getMonday()){
    if(DATA.health && DATA.health.weekStart!==getMonday()) archiveHealthWeek();
    DATA.health=defaultHealth(getMonday());
  }
  const h=DATA.health;
  ['breakfast','lunch','dinner'].forEach(k=>{ if(!h.diet) h.diet={}; if(!h.diet[k]) h.diet[k]=Array(7).fill(false); });
  ['eye','clean','massage','hydrate'].forEach(k=>{ if(!h.skin) h.skin={}; if(!h.skin[k]) h.skin[k]=Array(7).fill(false); });
  if(!Array.isArray(h.exercise)) h.exercise=Array(7).fill(false);
  if(!Array.isArray(h.earlySleep)) h.earlySleep=Array(7).fill(false);
  if(!Array.isArray(h.quality)) h.quality=Array(7).fill('');
  if(!Array.isArray(DATA.healthArchive)) DATA.healthArchive=[];
  if(!DATA.healthMonthly) DATA.healthMonthly={};
  if(!DATA.healthYearly) DATA.healthYearly={};
}
function ensureHealthPeriods(){
  ensureHealth();
  const now=new Date();
  const monthKey=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const yearKey=`${now.getFullYear()}`;
  const s=healthWeekSummary(DATA.health);
  if(!DATA.healthMonthly[monthKey]) DATA.healthMonthly[monthKey]={weeks:[]};
  if(!DATA.healthMonthly[monthKey].weeks.includes(s.weekStart)) DATA.healthMonthly[monthKey].weeks.push(s.weekStart);
  if(!DATA.healthYearly[yearKey]) DATA.healthYearly[yearKey]={weeks:[]};
  if(!DATA.healthYearly[yearKey].weeks.includes(s.weekStart)) DATA.healthYearly[yearKey].weeks.push(s.weekStart);
}

/* ============================================
   读书打卡（每日读书勾选，按月重置，年末统计图）
   - 数据按「月」组织，跨月自动归档上月并清零
   - 年末自动按 12 个月汇总读书天数（见 renderReadingStatsCard）
   ============================================ */
function monthKeyOf(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function ensureReadingCheckin(){
  if(!DATA.libRead) DATA.libRead={};
  if(!DATA.readingMonths) DATA.readingMonths={};
  const mk=monthKeyOf(new Date());
  if(!DATA.readingCheckin || DATA.readingCheckin.monthKey!==mk){
    if(DATA.readingCheckin && DATA.readingCheckin.monthKey!==mk){
      const prev=DATA.readingCheckin;
      const cnt=Object.keys(prev.days||{}).length;
      if(cnt>0 || (prev.note&&prev.note.trim())) DATA.readingMonths[prev.monthKey]={readDays:cnt,note:prev.note||''};
    }
    DATA.readingCheckin={monthKey:mk,days:{},note:''};
  }
  if(!DATA.readingCheckin.days) DATA.readingCheckin.days={};
}

/* ============================================
   情绪趋势（每周一统计，依次形成月统计、年统计）
   - 每周一归档上一周情绪均值（avgScore/count/label）
   - 把本周归入当前月/年桶，月末/年末自动聚合出月/年统计（见 renderEmotionChart）
   ============================================ */
function emotionWeekAvg(weekStart){
  const em=DATA.emotions||[];
  const start=new Date(weekStart+'T00:00:00');
  const end=new Date(start.getTime()+7*86400000); // 下周一
  const inWeek=em.filter(e=>e.date>=weekStart && e.date<fmtYMD(end) && e.score);
  const count=inWeek.length;
  const avg=count? Math.round(inWeek.reduce((s,r)=>s+(r.score||0),0)/count*10)/10 : null;
  return {weekStart, label:weekLabelOf(weekStart), avgScore:avg, count};
}
function ensureEmotionPeriods(){
  if(!Array.isArray(DATA.emotionWeeks)) DATA.emotionWeeks=[];
  if(typeof DATA.emotionMonthly!=='object'||!DATA.emotionMonthly) DATA.emotionMonthly={};
  if(typeof DATA.emotionYearly!=='object'||!DATA.emotionYearly) DATA.emotionYearly={};
  const monday=getMonday();
  const prevMondayDate=new Date(getMondayDate());
  prevMondayDate.setDate(prevMondayDate.getDate()-7);
  const prevMonday=fmtYMD(prevMondayDate);
  // 每周一归档上一周（不重复、非空才存）
  if(!DATA.emotionWeeks.some(w=>w.weekStart===prevMonday)){
    const w=emotionWeekAvg(prevMonday);
    if(w.count>0) DATA.emotionWeeks.push(w);
  }
  // 把本周（含进行中）归入当前月/年桶，供月/年视图聚合（桶 key 取周一所在月/年，避免跨月错位）
  const monthKey=monday.slice(0,7);
  const yearKey=monday.slice(0,4);
  if(!DATA.emotionMonthly[monthKey]) DATA.emotionMonthly[monthKey]={weeks:[]};
  if(!DATA.emotionMonthly[monthKey].weeks.includes(monday)) DATA.emotionMonthly[monthKey].weeks.push(monday);
  if(!DATA.emotionYearly[yearKey]) DATA.emotionYearly[yearKey]={weeks:[]};
  if(!DATA.emotionYearly[yearKey].weeks.includes(monday)) DATA.emotionYearly[yearKey].weeks.push(monday);
}
function emotionAggBy(list,gran){
  const map={};
  list.forEach(w=>{
    const key=gran==='month'?w.weekStart.slice(0,7):w.weekStart.slice(0,4);
    if(!map[key]) map[key]={sum:0,cnt:0};
    if(w.count>0){ map[key].sum+=w.avgScore*w.count; map[key].cnt+=w.count; }
  });
  const avg=k=>map[k].cnt? Math.round(map[k].sum/map[k].cnt*10)/10 : null;
  return Object.keys(map).sort().map(k=>({label:k, avg:avg(k)}));
}

  // Ensure base categories exist
  DEFAULT_SIDEBAR.forEach(d=>{
    if(!DATA.sidebarCategories.find(c=>c.id===d.id)){
      DATA.sidebarCategories.push({...d});
    }
  });
  // Reorder: base categories follow DEFAULT_SIDEBAR order, custom ones keep relative order at the end
  const baseOrder=DEFAULT_SIDEBAR.map(d=>d.id);
  const custom=DATA.sidebarCategories.filter(c=>!baseOrder.includes(c.id));
  DATA.sidebarCategories=baseOrder.map(id=>DATA.sidebarCategories.find(c=>c.id===id)).filter(Boolean).concat(custom);
  // Remove duplicates
  const seen=new Set();
  DATA.sidebarCategories=DATA.sidebarCategories.filter(c=>{
    if(seen.has(c.id)) return false;
    seen.add(c.id);
    return true;
  });
  saveData(DATA);
  renderSidebar();
}

function toggleSidebar(){

  const isMobile=window.innerWidth<=768;

/* ===== IELTS 语音朗读 (Web Speech API / TTS) ===== */
function escAttr(s){ return esc(s==null?'':String(s)).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
let _speakToken=0;
function pickEnVoice(){
  try{ const vs=window.speechSynthesis.getVoices(); return vs.find(x=>/en[-_]US/i.test(x.lang))||vs.find(x=>/^en/i.test(x.lang))||null; }catch(e){ return null; }
}
function speakText(text,btn){
  try{ window.speechSynthesis.cancel(); }catch(e){}
  const myToken=++_speakToken;
  resetSpeakBtns();
  const chunks=(text||'').match(/[^\n.!?]+[.!?]+|\S+/g)||[text||''];
  let i=0;
  const speakNext=()=>{
    if(myToken!==_speakToken) return;
    if(i>=chunks.length){ if(btn){ btn.dataset.speaking='0'; btn.textContent='🔊'; } return; }
    const u=new SpeechSynthesisUtterance((chunks[i]||'').trim());
    u.lang='en-US'; u.rate=0.95; u.pitch=1;
    const v=pickEnVoice(); if(v) u.voice=v;
    u.onend=speakNext;
    try{ window.speechSynthesis.speak(u); }catch(e){}
    i++;
  };
  speakNext();
  if(btn){ btn.dataset.speaking='1'; btn.textContent='⏹'; }
}
function resetSpeakBtns(){ document.querySelectorAll('.speak-btn').forEach(b=>{ b.dataset.speaking='0'; b.textContent='🔊'; }); }
function speakFromBtn(btn){
  if(!('speechSynthesis' in window)){ alert('当前浏览器不支持语音朗读，建议使用 Chrome / Edge / Safari 打开本页面。'); return; }
  if(btn.dataset.speaking==='1'){ try{ window.speechSynthesis.cancel(); }catch(e){} _speakToken++; resetSpeakBtns(); return; }
  speakText(btn.dataset.text, btn);
}

function addLearningTask(){
  const input=document.getElementById('newLearningTask');
  if(!input) return;
  const title=input.value.trim();
  if(!title) return;
  DATA.learningCustomTasks.push({id:'cl_'+Date.now(),title,review:'',done:false});
  saveData(DATA);
  renderLearningTasks();
  input.value='';
}
function toggleLearningTask(id){
  const all=[...DATA.learningTasks,...DATA.learningCustomTasks];
  const t=all.find(a=>a.id===id);
  if(t) t.done=!t.done;
  saveData(DATA);
  renderLearningTasks();
}
function updateLearningReview(id,val){
  const all=[...DATA.learningTasks,...DATA.learningCustomTasks];
  const t=all.find(a=>a.id===id);
  if(t) t.review=val;
  saveData(DATA);
}
function deleteLearningTask(id){
  if(!confirm('删除此学习任务？')) return;
  DATA.learningTasks=DATA.learningTasks.filter(t=>t.id!==id);
  DATA.learningCustomTasks=DATA.learningCustomTasks.filter(t=>t.id!==id);
  saveData(DATA);
  renderLearningTasks();
}

  const sel=dailyRotate(pool,4,0);

async function importHealthFromClipboard(){
  let raw='';
  try{
    raw=await navigator.clipboard.readText();
  }catch(e){
    // Fallback: ask user to paste
    raw=prompt('请将健康App数据粘贴到此处（先在iPhone上运行快捷指令复制数据）');
    if(!raw) return;
  }
  try{
    const data=JSON.parse(raw);
    let filled=[];
    // Health: steps, weight, calories
    if(data.steps){ document.getElementById('lifeSteps').value=data.steps; filled.push('步数 '+data.steps); }
    if(data.weight){ document.getElementById('lifeWeight').value=data.weight; filled.push('体重 '+data.weight+'kg'); }
    if(data.activeEnergy){ document.getElementById('lifeCalories').value=Math.round(data.activeEnergy); filled.push('卡路里 '+Math.round(data.activeEnergy)+'kcal'); }
    if(data.exercise){ document.getElementById('lifeExercise').value=data.exercise; filled.push('锻炼'); }
    // Sleep: start time, end time, quality
    if(data.sleepStart){ document.getElementById('sleepTime').value=data.sleepStart; filled.push('入睡 '+data.sleepStart); }
    if(data.sleepEnd){ document.getElementById('wakeTime').value=data.sleepEnd; filled.push('起床 '+data.sleepEnd); }
    if(data.sleepQuality){ document.getElementById('sleepQuality').value=data.sleepQuality; }
    if(data.sleepHours){ filled.push('睡眠 '+data.sleepHours+'h'); }
    // Auto-save both
    saveHealth();
    saveSleep();
    showToast('✅ 已导入：'+filled.join(' / '));
  }catch(e){
    showToast('❌ 数据格式不正确，请确认已从快捷指令复制正确的JSON');
    console.error('Import error:',e);
  }
}

function showToast(msg){
  let t=document.getElementById('toast1');
  if(!t){
    t=document.createElement('div');
    t.id='toast1';
    t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;z-index:9999;white-space:nowrap;transition:opacity 0.3s;pointer-events:none';
    document.body.appendChild(t);
  }
  t.textContent=msg;
  t.style.opacity='1';
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>{ t.style.opacity='0'; },2500);
}

function saveHealth(){
  const weight=parseFloat(document.getElementById('lifeWeight').value)||0;
  const steps=parseInt(document.getElementById('lifeSteps').value)||0;
  const calories=parseInt(document.getElementById('lifeCalories').value)||0;
  const exercise=document.getElementById('lifeExercise').value.trim();
  const idx=DATA.lifeHealth.findIndex(h=>h.date===today());
  const record={date:today(),weight,steps,calories,exercise};
  if(idx>=0) DATA.lifeHealth[idx]=record;
  else DATA.lifeHealth.push(record);
  DATA.lifeHealth.sort((a,b)=>a.date.localeCompare(b.date));
  saveData(DATA);
  updateHealthRecommend();
}

function saveSleep(){
  const stEl=document.getElementById('sleepTime');
  const wtEl=document.getElementById('wakeTime');
  const qEl=document.getElementById('sleepQuality');
  if(!stEl||!wtEl||!qEl) return; // 睡眠 UI 已改为按周打卡表格，旧表单不再渲染
  const sleepTime=stEl.value;
  const wakeTime=wtEl.value;
  const quality=qEl.value;
  let hours=0;
  if(sleepTime&&wakeTime){
    const [sh,sm]=sleepTime.split(':').map(Number);
    const [wh,wm]=wakeTime.split(':').map(Number);
    hours=((wh*60+wm)-(sh*60+sm))/60;
    if(hours<0) hours+=24;
    hours=Math.round(hours*10)/10;
  }
  const idx=DATA.lifeSleep.findIndex(s=>s.date===today());
  const record={date:today(),sleepTime,wakeTime,hours,quality};
  if(idx>=0) DATA.lifeSleep[idx]=record;
  else DATA.lifeSleep.push(record);
  DATA.lifeSleep.sort((a,b)=>a.date.localeCompare(b.date));
  saveData(DATA);
  updateSleepAvg();
}

function isFavorited(category, title){
  if(!DATA.favorites) return false;
  return DATA.favorites.some(f=>f.category===category && f.title===title);
}
function toggleFavorite(category, title, text){
  if(!DATA.favorites) DATA.favorites=[];
  const idx=DATA.favorites.findIndex(f=>f.category===category && f.title===title);
  if(idx>=0){
    DATA.favorites.splice(idx,1);
    showToast('已取消收藏');
  }else{
    DATA.favorites.push({id:'fav_'+Date.now(),category,title,text,date:today()});
    showToast('已收藏 ⭐');
  }
  saveData(DATA);
}
function favFromData(dataStr){
  const d=JSON.parse(decodeURIComponent(dataStr));
  toggleFavorite(d.c, d.t, d.x);
  // Update button visual
  const btn=event.currentTarget;
  const fav=isFavorited(d.c, d.t);
  btn.classList.toggle('on', fav);
  btn.textContent=fav?'⭐':'☆';
}
function removeFavorite(id){
  if(!DATA.favorites) return;
  DATA.favorites=DATA.favorites.filter(f=>f.id!==id);
  saveData(DATA);
  renderFavoritesCard();
  showToast('已取消收藏');
}
function tipCardHtml(category, title, text){
  const fav=isFavorited(category, title);
  const data=encodeURIComponent(JSON.stringify({c:category,t:title,x:text}));
  return `<div class="tip-card">
    <div class="tip-head"><h4>${title}</h4>
    <button class="fav-btn${fav?' on':''}" onclick="event.stopPropagation();favFromData('${data}')">${fav?'⭐':'☆'}</button></div>
    <p>${text}</p></div>`;
}

function updateHealthRecommend(){
  const todayData=DATA.lifeHealth.find(h=>h.date===today());
  if(!todayData) return;
  const rec=document.getElementById('healthRecommend');
  let msg='';
  if(todayData.weight){
    const prev=DATA.lifeHealth.filter(h=>h.date<today()).slice(-3);
    if(prev.length>0){
      const avgPrev=prev.reduce((s,p)=>s+(p.weight||todayData.weight),0)/prev.length;
      const diff=todayData.weight-avgPrev;
      if(diff>0.3) msg+='⚠️ 体重有上升趋势，建议控制碳水摄入，增加有氧运动；';
      else if(diff<-0.3) msg+='👍 体重在下降，继续保持！注意补充蛋白质避免肌肉流失；';
      else msg+='📊 体重稳定，保持现有饮食和运动节奏；';
    }
  }
  if(todayData.steps<5000) msg+='🚶 今日步数偏低，建议饭后散步30分钟；';
  else if(todayData.steps>=10000) msg+='👏 步数达标！继续保持活跃；';
  if(todayData.calories<1500) msg+='🍽️ 卡路里消耗偏低，可适当增加运动强度；';
  if(msg) rec.textContent='💡 '+msg;
}

// 计算当前所处生理期阶段
function calcCurrentPhase(){
  if(!DATA.lifePeriod||DATA.lifePeriod.length===0) return null;
  const sorted=DATA.lifePeriod.slice().sort((a,b)=>b.date.localeCompare(a.date));
  const latest=sorted[0];
  const start=new Date(latest.date);
  const now=new Date(today());
  const diffDays=Math.floor((now-start)/(1000*60*60*24));
  if(diffDays<0) return null; // future date
  const cycleLen=28;
  const dayInCycle=(diffDays%cycleLen)+1; // 1-28
  // Determine phase
  if(dayInCycle>=1&&dayInCycle<=5) return {phase:'menstrual',dayInCycle,diffDays};
  if(dayInCycle>=6&&dayInCycle<=13) return {phase:'follicular',dayInCycle,diffDays};
  if(dayInCycle>=14&&dayInCycle<=16) return {phase:'ovulation',dayInCycle,diffDays};
  return {phase:'luteal',dayInCycle,diffDays};
}

// 当前阶段信息 + 预测下次月经
function renderPhaseInfo(){
  const info=calcCurrentPhase();
  if(!info){
    return `<div class="phase-empty">📌 添加月经开始日期后，将自动推算当前所处生理期阶段<br>并提供针对性的饮食、锻炼、保养建议</div>`;
  }
  const ph=PERIOD_PHASES[info.phase];
  const nextPeriodDate=new Date(today());
  const daysToNext=28-info.dayInCycle+1;
  if(daysToNext>0) nextPeriodDate.setDate(nextPeriodDate.getDate()+daysToNext);
  const nextStr=nextPeriodDate.toISOString().split('T')[0];
  const phaseColors={
    menstrual:'#e74c3c',
    follicular:'#e891b8',
    ovulation:'#c084fc',
    luteal:'#f59e0b'
  };
  let bars='';
  const phases=['menstrual','follicular','ovulation','luteal'];
  bars=phases.map(p=>{
    const isCurrent=p===info.phase;
    const pp=PERIOD_PHASES[p];
    return `<div class="phase-bar${isCurrent?' current':''}" style="border-color:${isCurrent?phaseColors[p]:'var(--border)'}">
      <span class="phase-bar-icon">${pp.icon}</span>
      <span class="phase-bar-name">${pp.name}</span>
      <span class="phase-bar-days">D${pp.days[0]}-${pp.days[1]}</span>

  }).join('');
  return `<div class="phase-info">
    <div class="phase-current" style="background:${phaseColors[info.phase]}15;border-color:${phaseColors[info.phase]}">
      <span class="phase-current-icon">${ph.icon}</span>
      <div class="phase-current-text">
        <div class="phase-current-name">${ph.name} · 第${info.dayInCycle}天</div>
        <div class="phase-current-desc">${ph.desc}</div>
      </div>
    </div>
    <div class="phase-bars">${bars}</div>
    <div class="phase-next">📅 预计下次月经：${nextStr}（约${daysToNext>0?daysToNext:0}天后）</div>

}

function renderPeriodPhaseTips(){

  // 按类型分组：饮食/锻炼/保养

  const typeIcons={'饮食':'🍎','锻炼':'🏃‍♀️','保养':'💆‍♀️'};

function switchHealthChart(mode){ healthChartMode=mode; renderHealthChart(); }
function healthAggBy(list,gran){
  const map={};
  list.forEach(w=>{
    const key=gran==='month'?w.weekStart.slice(0,7):w.weekStart.slice(0,4);
    if(!map[key]) map[key]={diet:[],ex:[],es:[],skin:[]};
    map[key].diet.push(w.dietPct); map[key].ex.push(w.exerciseCount); map[key].es.push(w.earlySleepCount); map[key].skin.push(w.skinCount);
  });
  const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10:0;
  return Object.keys(map).sort().map(k=>({label:k,dietPct:avg(map[k].diet),ex:avg(map[k].ex),es:avg(map[k].es),skin:avg(map[k].skin)}));
}
function renderHealthChart(){
  const canvas=document.getElementById('healthChart');
  if(!canvas||typeof Chart==='undefined') return;
  ensureHealth();
  const cur=healthWeekSummary(DATA.health);
  const all=[...(DATA.healthArchive||[]), cur];
  let labels=[],dietPct=[],exCount=[],esCount=[],skinCount=[];
  if(healthChartMode==='week'){
    const weeks=all.slice(-8).slice().sort((a,b)=>a.weekStart.localeCompare(b.weekStart));
    labels=weeks.map(w=>w.weekLabel.replace(/^\d{4}-/,''));
    dietPct=weeks.map(w=>w.dietPct); exCount=weeks.map(w=>w.exerciseCount);
    esCount=weeks.map(w=>w.earlySleepCount); skinCount=weeks.map(w=>w.skinCount);
  }else{
    const agg=healthAggBy(all,healthChartMode);
    labels=agg.map(a=>healthChartMode==='month'?a.label.slice(5):a.label);
    dietPct=agg.map(a=>a.dietPct); exCount=agg.map(a=>a.ex); esCount=agg.map(a=>a.es); skinCount=agg.map(a=>a.skin);
  }
  if(healthChartInst) healthChartInst.destroy();
  healthChartInst=new Chart(canvas.getContext('2d'),{
    type:'bar',
    data:{
      labels,
      datasets:[
        {label:'饮食完成率%',data:dietPct,backgroundColor:'#e8a838',yAxisID:'p',order:2},
        {label:'锻炼次数',data:exCount,backgroundColor:'#4a90d9',yAxisID:'c',order:1},
        {label:'早睡天数',data:esCount,backgroundColor:'#6a5acd',yAxisID:'c',order:1},
        {label:'护肤次数',data:skinCount,backgroundColor:'#d672a0',yAxisID:'c',order:1}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      scales:{
        c:{position:'left',title:{display:true,text:'次数'},beginAtZero:true,suggestedMax:7,ticks:{precision:0}},
        p:{position:'right',title:{display:true,text:'完成率%'},beginAtZero:true,max:100}
      },
      plugins:{legend:{position:'bottom',labels:{font:{size:11},boxWidth:10,padding:8}},tooltip:{}}
    }
  });
}

let emotionPeriod='week';
let emotionChartInst=null;

function emotionChartBlock(){
  return `<div class="content-card">
    <h3><span class="card-icon">📈</span>情绪趋势 <span style="font-size:11px;font-weight:400;color:var(--text-tertiary)">· 每周一统计，依次形成月 / 年统计</span></h3>

function renderEmotionChart(){
  const canvas=document.getElementById('emotionChart');
  if(!canvas||typeof Chart==='undefined') return;
  ensureEmotionPeriods();
  const archived=(DATA.emotionWeeks||[]).map(w=>({...w}));
  const cur=emotionWeekAvg(getMonday());
  const allWeeks=archived.slice();
  if(!archived.some(w=>w.weekStart===cur.weekStart)) allWeeks.push(cur);
  let labels=[], values=[];
  if(emotionPeriod==='week'){
    const weeks=allWeeks.slice().sort((a,b)=>a.weekStart.localeCompare(b.weekStart)).slice(-8);
    labels=weeks.map(w=>w.label.replace(/^\d{4}-/,''));
    values=weeks.map(w=>w.avgScore);
  } else if(emotionPeriod==='month'){
    const ty=today().split('-')[0];
    const agg=emotionAggBy(allWeeks,'month').filter(a=>a.label.startsWith(ty));
    const byM={}; agg.forEach(a=>byM[a.label.slice(5)]=a.avg);
    for(let i=1;i<=12;i++){ const m=String(i).padStart(2,'0'); labels.push(i+'月'); values.push(byM[m]!=null?byM[m]:null); }
  } else {
    const agg=emotionAggBy(allWeeks,'year');
    labels=agg.map(a=>a.label+'年'); values=agg.map(a=>a.avg);
  }
  if(emotionChartInst) emotionChartInst.destroy();
  const ctx=canvas.getContext('2d');
  emotionChartInst=new Chart(ctx,{
    type:'line',
    data:{labels,datasets:[{label:'情绪指数(均值)',data:values,borderColor:'#af52de',backgroundColor:'rgba(175,82,222,0.1)',borderWidth:2.5,tension:0.4,fill:true,pointRadius:4,pointBackgroundColor:'#af52de',spanGaps:false}]},

  });
}

function getDailyEmotionTips(){
  const pool=EMOTION_TIP_POOL;
  const dayNum=parseInt(today().replace(/-/g,''),10);
  const offset=dayNum%pool.length;
  const rotated=[...pool.slice(offset),...pool.slice(0,offset)];
  const todayEmotion=DATA.emotions.find(e=>e.date===today());
  if(todayEmotion&&todayEmotion.score<=4){
    const calm=rotated.filter(t=>t.calm);
    const rest=rotated.filter(t=>!t.calm);
    return [...calm,...rest].slice(0,6);
  }
  return rotated.slice(0,6);
}

  const el=document.getElementById('emotionTips');
  if(!el) return;
  const tips=getDailyEmotionTips();
  el.innerHTML=tips.map(t=>tipCardHtml('情绪调节',t.title,t.text)).join('');
}

function renderDailyReport(feed){
  const todayStr=today();
  const catOrder=['每日时政','时政文章','政治','经济','ESG','AI'];
  const regions=['国内','国外'];
  const MAX_PER_REGION=3;
  let picked=[];
  let hasToday=false;
  // 每个「类别 × 国内/国外」组合：优先取当日新闻，当日无则回退到该组合最新若干条，
  // 保证 政治/经济/ESG/AI 国内·国外 每日都能在日报中全面呈现。
  catOrder.forEach(cat=>{
    regions.forEach(region=>{
      const pool=feed.filter(n=>n.category===cat && n.region===region);
      if(pool.length===0) return;
      const todayItems=pool.filter(n=>n.date===todayStr);
      let chosen;
      if(todayItems.length>0){
        chosen=todayItems.slice(0,MAX_PER_REGION);
        hasToday=true;
      }else{
        chosen=pool.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,MAX_PER_REGION);
      }
      picked=picked.concat(chosen);
    });
  });
  if(picked.length===0){
    return `<div class="daily-report"><div class="no-report"><div class="empty-icon">📭</div><p>暂无新闻内容</p><p style="font-size:12px;margin-top:4px">新闻将在下次自动更新时生成日报</p></div></div>`;
  }
  return renderDailyReportContent(picked, hasToday, todayStr);
}

function formatUpdateTime(ts){
  if(!ts) return '暂无记录';
  const d=new Date(ts);
  const now=new Date();
  const diffMs=now-d;
  const diffH=Math.floor(diffMs/3600000);
  if(diffH<1) return Math.floor(diffMs/60000)+'分钟前';
  if(diffH<24) return diffH+'小时前';
  const diffD=Math.floor(diffH/24);
  if(diffD<7) return diffD+'天前';
  return d.toLocaleDateString('zh-CN',{month:'short',day:'numeric'});
}

function triggerAutoUpdate(){
  // Clear seed-flagged items and reload to get latest HTML seed data
  if(!DATA.newsFeed) DATA.newsFeed=[];
  if(!DATA.academicPapers) DATA.academicPapers=[];
  DATA.newsFeed = DATA.newsFeed.filter(n => !String(n.id).startsWith('s_n'));
  DATA.academicPapers = DATA.academicPapers.filter(p => !String(p.id).startsWith('s_p'));
  DATA.seedVersion = ''; // Force re-seed on next load
  saveData(DATA);
  location.reload();
}

function renderPlog(){
  const el=document.getElementById('plogGrid');
  if(!el) return;
  const photos=DATA.plog.photos||[];
  if(photos.length===0){
    el.innerHTML='<div class="empty-state" style="padding:20px 0"><div class="empty-icon">📷</div><p>今天还没有plog，添加几张照片记录生活吧</p></div>';
    return;
  }
  el.innerHTML=photos.map((src,i)=>`
    <div class="plog-item">
      <img src="${src}" alt="plog ${i+1}" onclick="viewPlog(${i})">
      <button class="plog-del" onclick="event.stopPropagation();deletePlogPhoto(${i})">×</button>
    </div>`).join('');
}
function addPlogPhotos(input){
  if(!input||!input.files||input.files.length===0) return;
  const files=Array.from(input.files);
  let pending=files.length;
  const collected=[];
  files.forEach(file=>{
    compressImage(file,800,0.8,dataUrl=>{
      if(dataUrl) collected.push(dataUrl);
      pending--;
      if(pending===0){
        if(DATA.plog.photos.length+collected.length>15){
          collected.splice(15-DATA.plog.photos.length);
          showToast('当日照片已达上限(15张)，多余的未添加');
        }
        DATA.plog.photos=DATA.plog.photos.concat(collected);
        try{ saveData(DATA); }catch(e){ showToast('存储空间不足，删除部分旧照片后再试'); }
        renderReview();
      }
    });
  });
  input.value='';
}
function compressImage(file,maxW,quality,cb){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1, maxW/img.width);
      const w=Math.max(1,Math.round(img.width*scale)), h=Math.max(1,Math.round(img.height*scale));
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      try{ cb(c.toDataURL('image/jpeg',quality)); }catch(err){ cb(''); }
    };
    img.onerror=()=>cb('');
    img.src=e.target.result;
  };
  reader.onerror=()=>cb('');
  reader.readAsDataURL(file);
}
function deletePlogPhoto(idx){
  if(!confirm('删除这张照片？')) return;
  DATA.plog.photos.splice(idx,1);
  saveData(DATA);
  renderReview();
}
function viewPlog(idx){
  const src=DATA.plog.photos[idx];
  if(!src) return;
  const w=window.open('','_blank');
  if(w) w.document.write('<img src="'+src+'" style="max-width:100%;display:block;margin:auto">');
}

function getRecruitFeatured(){
  const pool=RECRUIT_POOL;
  if(DATA.recruit.date===today() && DATA.recruit.featuredIds && DATA.recruit.featuredIds.length){
    const arr=DATA.recruit.featuredIds.map(id=>pool.find(j=>j.id===id)).filter(Boolean);
    if(arr.length) return arr;
  }
  const sel=dailyRotate(pool,4,0);
  DATA.recruit.date=today();
  DATA.recruit.featuredIds=sel.map(j=>j.id);
  saveData(DATA);
  return sel;
}
function reshuffleRecruit(){
  const pool=RECRUIT_POOL;
  const shuffled=[...pool].sort(()=>Math.random()-0.5).slice(0,4);
  DATA.recruit.date=today();
  DATA.recruit.featuredIds=shuffled.map(j=>j.id);
  saveData(DATA);
  renderWork();
}
function toggleRecruitLike(id){
  if(DATA.recruit.liked[id]) delete DATA.recruit.liked[id];
  else DATA.recruit.liked[id]=true;
  saveData(DATA);
  renderWork();
}
function addRecruitCustom(){
  const title=(document.getElementById('rcTitle')||{}).value;
  const org=(document.getElementById('rcOrg')||{}).value;
  const city=(document.getElementById('rcCity')||{}).value;
  const deadline=(document.getElementById('rcDeadline')||{}).value;
  if(!title||!title.trim()) return;
  DATA.recruit.custom.push({id:'rc_'+Date.now(),title:title.trim(),org:(org||'').trim(),type:'自定义',city:(city||'').trim(),deadline:(deadline||'').trim(),fit:[],note:''});
  saveData(DATA);
  renderWork();
}
function deleteRecruitCustom(id){
  DATA.recruit.custom=DATA.recruit.custom.filter(j=>j.id!==id);
  saveData(DATA);
  renderWork();
}
function recruitJobHtml(j,isLiked,isCustom,idx){
  const fitChips=(j.fit||[]).map(f=>`<span class="recruit-fit">${f}</span>`).join('');
  const action=isCustom
    ? `<button class="recruit-like" onclick="deleteRecruitCustom('${j.id}')">🗑️ 删除</button>`
    : `<button class="recruit-like${isLiked?' liked':''}" onclick="toggleRecruitLike('${j.id}')">${isLiked?'❤️ 已收藏':'🤍 收藏'}</button>`;
  return `<div class="recruit-job">
    <div class="recruit-job-num">${idx}</div>
    <div class="recruit-job-main">
      <div class="recruit-job-title">${esc(j.title)}</div>
      <div class="recruit-job-meta">${j.org?esc(j.org)+' · ':''}${j.type?esc(j.type):''}${j.city?' · '+esc(j.city):''}</div>
      ${fitChips?`<div class="recruit-fit-row">${fitChips}</div>`:''}
      ${j.deadline?`<div class="recruit-deadline">⏰ 截止：${esc(j.deadline)}</div>`:''}
      ${j.note?`<div class="recruit-note">${esc(j.note)}</div>`:''}
    </div>
    <div class="recruit-job-actions">${action}</div>
  </div>`;
}
function renderWorkRecruitCard(){
  const featured=getRecruitFeatured();
  const liked=DATA.recruit.liked||{};
  const likedJobs=Object.keys(liked).map(id=>RECRUIT_POOL.find(j=>j.id===id)).filter(Boolean);
  const custom=DATA.recruit.custom||[];
  let idx=0;
  const featuredHtml=featured.map(j=>recruitJobHtml(j,liked[j.id],false,++idx)).join('');
  const likedHtml=likedJobs.length? likedJobs.map(j=>recruitJobHtml(j,true,false,++idx)).join('') : '<div class="empty-state" style="padding:14px 0"><p>还没有收藏的岗位，点击 🤍 收藏吧</p></div>';
  const customHtml=custom.length? custom.map(j=>recruitJobHtml(j,false,true,++idx)).join('') : '<div class="empty-state" style="padding:14px 0"><div class="empty-icon">📭</div><p>暂无自定义岗位</p></div>';
  const validVal=(DATA.recruit.validCount!==undefined&&DATA.recruit.validCount!=='')?DATA.recruit.validCount:'';
  return `<div class="content-card recruit-card">
    <h3><span class="card-icon">💼</span>招聘信息 <span style="font-size:11px;font-weight:400;color:var(--text-tertiary)">· 每日更新 · 适配：会计硕士/高校经历/国企实习/非应届</span></h3>
    <div class="recruit-stats">📊 今日有效岗位：<input type="number" min="0" class="recruit-valid-input" id="recruitValidInput" value="${validVal}" placeholder="自填" oninput="setRecruitValidCount(this.value)" onblur="setRecruitValidCount(this.value)"> 个（共 ${featured.length} 个推荐）</div>
    <div class="recruit-subtitle">🌟 今日推荐岗位</div>
    <div class="recruit-list">${featuredHtml}</div>
    <div style="text-align:right;margin:4px 0 2px"><button class="mini-edit-btn" onclick="reshuffleRecruit()">🔄 换一批</button></div>
    <div class="recruit-subtitle">❤️ 我的收藏</div>
    <div class="recruit-list">${likedHtml}</div>
    <div class="recruit-subtitle">✏️ 自定义岗位</div>
    <div class="recruit-list">${customHtml}</div>
    <div class="recruit-add">
      <input type="text" id="rcTitle" placeholder="岗位名称，如：XX大学财务岗">
      <input type="text" id="rcOrg" placeholder="单位">
      <input type="text" id="rcCity" placeholder="城市">
      <input type="text" id="rcDeadline" placeholder="截止日期">
      <button onclick="addRecruitCustom()">添加岗位</button>
    </div>
  </div>`;
}
function setRecruitValidCount(val){
  DATA.recruit.validCount=val===''||val==null? '' : parseInt(val,10);
  saveData(DATA);
}

function bookCardHtml(b){

function addBook(){
  const t=(document.getElementById('bkTitle')||{}).value;
  if(!t||!t.trim()){ showToast('请填写书名'); return; }
  const status=document.getElementById('bkStatus').value;
  DATA.books.push({id:'bk_'+Date.now(),title:t.trim(),author:(document.getElementById('bkAuthor').value||'').trim(),status,total:parseInt(document.getElementById('bkTotal').value)||0,current:parseInt(document.getElementById('bkCurrent').value)||0,rating:0,note:'',createdAt:now(),startedAt:status!=='want'?now():null,finishedAt:status==='done'?now():null});
  saveData(DATA);
  renderReading();
}
function saveBook(id){
  const b=DATA.books.find(x=>x.id===id);
  if(!b) return;
  const status=document.getElementById('e_bkStatus').value;
  b.title=document.getElementById('e_bkTitle').value.trim()||b.title;
  b.author=document.getElementById('e_bkAuthor').value.trim();
  b.total=parseInt(document.getElementById('e_bkTotal').value)||0;
  b.current=parseInt(document.getElementById('e_bkCurrent').value)||0;
  b.rating=Math.max(0,Math.min(5,parseInt(document.getElementById('e_bkRating').value)||0));
  if(b.status!==status){
    b.status=status;
    if(status==='reading'&&!b.startedAt) b.startedAt=now();
    if(status==='done') b.finishedAt=now();
    if(status==='want'){ b.startedAt=null; b.finishedAt=null; }
  }
  b.note=document.getElementById('e_bkNote').value.trim();
  saveData(DATA);
  bookEditId='';
  renderReading();
}
function deleteBook(id){
  if(!confirm('删除这本书的记录？')) return;
  DATA.books=DATA.books.filter(x=>x.id!==id);
  saveData(DATA);
  renderReading();
}

// 当月读书日历（按周布局：周一..周日 多行），每天一个「读了」勾选框
function renderReadingCheckinCard(){
  ensureReadingCheckin();
  const rc=DATA.readingCheckin;
  const [y,m]=rc.monthKey.split('-').map(Number);
  const first=new Date(y,m-1,1);
  const startOffset=(first.getDay()+6)%7;        // 月初前的占位天数（周一=0）
  const daysInMonth=new Date(y,m,0).getDate();
  const weeks=Math.ceil((startOffset+daysInMonth)/7);
  let rows='',day=1;
  for(let w=0;w<weeks;w++){
    let cells='';
    for(let col=0;col<7;col++){
      const idx=w*7+col;
      if(idx<startOffset || day>daysInMonth){
        cells+=`<td class="hw-cell rd-empty"></td>`;
      }else{
        const ds=`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const done=!!rc.days[ds];
        const tCls=ds===today()?' hw-today':'';
        cells+=`<td class="hw-cell${tCls}"><div class="rd-daynum">${day}</div><span class="hw-box${done?' on':''}" onclick="toggleReadingDay('${ds}')">${done?'✓':''}</span></td>`;
        day++;
      }
    }
    rows+=`<tr>${cells}</tr>`;
  }
  const readDays=Object.keys(rc.days).length;
  return `<div class="content-card hw-card">
    <h3><span class="card-icon">📅</span>读书打卡 · ${rc.monthKey} <span class="hw-pct">${readDays} 天</span></h3>
    <div class="hw-scroll"><table class="hw-table"><thead><tr>${hwHead()}</tr></thead><tbody>${rows}</tbody></table></div>
    <p class="hw-tip">本月已读书 ${readDays} 天 · 每月自动更新</p>
    <div class="hw-sub">
      <div class="hw-sub-title">📝 读书心得（${rc.monthKey}）</div>
      <textarea id="rdNote" class="rd-note" placeholder="记录本月读书心得、收获与思考..." oninput="saveReadingNote()">${esc(rc.note||'')}</textarea>
    </div>
  </div>`;
}
function toggleReadingDay(ds){
  ensureReadingCheckin();
  if(DATA.readingCheckin.days[ds]) delete DATA.readingCheckin.days[ds];
  else DATA.readingCheckin.days[ds]=true;
  saveData(DATA); renderReading();
}
function saveReadingNote(){
  ensureReadingCheckin();
  const ta=document.getElementById('rdNote');
  DATA.readingCheckin.note=ta?ta.value:'';
  saveData(DATA);
}
// 年末读书统计图：当年 12 个月读书天数柱状图
let readingChartInst=null;
function renderReadingStatsCard(){
  ensureReadingCheckin();
  const yk=new Date().getFullYear();
  let total=0;
  for(let mm=1;mm<=12;mm++){
    const mk=`${yk}-${String(mm).padStart(2,'0')}`;
    let d=(DATA.readingMonths[mk]||{}).readDays||0;
    if(mk===DATA.readingCheckin.monthKey) d=Math.max(d,Object.keys(DATA.readingCheckin.days).length);
    total+=d;
  }
  return `<div class="content-card hw-card">
    <h3><span class="card-icon">📈</span>读书统计图 · ${yk} 年</h3>
    <div class="chart-wrap"><canvas id="readingChart"></canvas></div>
    <p class="hw-tip">${yk} 年累计读书 ${total} 天 · 年末自动汇总结算</p>
  </div>`;
}
function renderReadingChart(){
  const canvas=document.getElementById('readingChart');
  if(!canvas||typeof Chart==='undefined') return;
  ensureReadingCheckin();
  const yk=new Date().getFullYear();
  const data=[];
  for(let mm=1;mm<=12;mm++){
    const mk=`${yk}-${String(mm).padStart(2,'0')}`;
    let d=(DATA.readingMonths[mk]||{}).readDays||0;
    if(mk===DATA.readingCheckin.monthKey) d=Math.max(d,Object.keys(DATA.readingCheckin.days).length);
    data.push(d);
  }
  if(readingChartInst) readingChartInst.destroy();
  readingChartInst=new Chart(canvas.getContext('2d'),{
    type:'bar',
    data:{labels:['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],
      datasets:[{label:'读书天数',data,backgroundColor:'#e8a838',borderRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,
      scales:{y:{beginAtZero:true,title:{display:true,text:'天数'},suggestedMax:30,ticks:{precision:0}}},
      plugins:{legend:{display:false},tooltip:{}}}
  });
}

const PLAN_PERIODS=[

  {key:'month',icon:'📆',label:'月计划',emoji:'⭐',color:'#af52de'},

function addPlan(key){
  const input=document.getElementById('plan_'+key);
  if(!input) return;
  const title=input.value.trim();
  if(!title) return;
  DATA.plans[key].push({id:'pl_'+Date.now(),title,done:false});
  saveData(DATA);
  renderPlan();
}
function togglePlan(key,id){
  const it=DATA.plans[key].find(x=>x.id===id);
  if(it) it.done=!it.done;
  saveData(DATA);
  renderPlan();
}
function deletePlan(key,id){
  DATA.plans[key]=DATA.plans[key].filter(x=>x.id!==id);
  saveData(DATA);
  renderPlan();
}

/* ---- Home: 今日打卡栏 ---- */
function renderCheckin(){
  const ci=(DATA.dailyCheckin&&DATA.dailyCheckin.items)||[];
  const done=ci.filter(x=>x.done).length;
  const total=ci.length;
  const pct=total?Math.round(done/total*100):0;
  const items=ci.map(c=>`
    <div class="ck-item${c.done?' done':''}" onclick="toggleCheckin('${c.id}')">
      <span class="ck-check${c.done?' checked':''}">✓</span>
      <span class="ck-icon">${c.icon||'•'}</span>
      <span class="ck-label">${esc(c.label)}</span>
      <span class="ck-del" onclick="event.stopPropagation();deleteCheckin('${c.id}')">×</span>
    </div>`).join('');
  return `<div class="content-card journal-card">
    <div class="jc-card-head">
      <h3><span class="card-icon">✅</span>今日打卡 <span class="ht-progress-text">${done}/${total}</span></h3>
      <span class="jc-pct-badge">${pct}%</span>
    </div>
    <div class="ht-progress"><div class="ht-progress-bar" style="width:${pct}%"></div></div>
    ${total? `<div class="ck-grid">${items}</div>` : '<div class="ht-empty">还没有打卡项，下面添加一个吧~</div>'}
    <div class="ck-add">
      <input type="text" id="ckInput" placeholder="➕ 添加打卡项..." onkeydown="if(event.key==='Enter')addCheckin()">
      <button onclick="addCheckin()">添加</button>
    </div>
  </div>`;
}
function toggleCheckin(id){
  const ci=(DATA.dailyCheckin&&DATA.dailyCheckin.items)||[];
  const c=ci.find(x=>x.id===id);
  if(c) c.done=!c.done;
  saveData(DATA);
  renderHome();
}
function addCheckin(){
  const inp=document.getElementById('ckInput');
  if(!inp) return;
  const label=inp.value.trim();
  if(!label) return;
  if(!DATA.dailyCheckin) DATA.dailyCheckin={date:today(),items:[]};
  const icons=['🌟','🌿','☀️','💡','🍀','🎯','🌈','✨'];
  DATA.dailyCheckin.items.push({id:'ci_'+Date.now(),label,done:false,icon:icons[DATA.dailyCheckin.items.length%icons.length]});
  saveData(DATA);
  renderHome();
}
function deleteCheckin(id){
  if(!DATA.dailyCheckin) return;
  DATA.dailyCheckin.items=DATA.dailyCheckin.items.filter(x=>x.id!==id);
  saveData(DATA);
  renderHome();
}

// 打开首页时，若当天还没天气数据则尝试用缓存城市自动刷新（仅当已有城市缓存时，避免无谓弹窗）
let weatherAutoTried=false;
function loadWeatherOnOpen(){
  if(weatherAutoTried) return;
  weatherAutoTried=true;
  const w=DATA.weather;
  if(w&&w.date===today()&&w.city){ fetchWeatherByCity(); }
  else{ fetchWeatherGeo(); }   // 无缓存 → 自动定位（GPS→IP回退）
}

const WMO_CODES={
  0:['☀️','晴'],1:['🌤️','晴间多云'],2:['⛅','多云'],3:['☁️','阴'],
  45:['🌫️','雾'],48:['🌫️','雾凇'],
  51:['🌦️','毛毛雨'],53:['🌦️','小雨'],55:['🌧️','中雨'],56:['🌧️','冻雨'],57:['🌧️','冻雨'],
  61:['🌧️','小雨'],63:['🌧️','中雨'],65:['🌧️','大雨'],66:['🌨️','冻雨'],67:['🌨️','冻雨'],
  71:['🌨️','小雪'],73:['🌨️','中雪'],75:['❄️','大雪'],77:['❄️','雪粒'],
  80:['🌦️','阵雨'],81:['🌦️','阵雨'],82:['⛈️','强阵雨'],
  85:['🌨️','阵雪'],86:['🌨️','阵雪'],
  95:['⛈️','雷阵雨'],96:['⛈️','雷阵雨伴冰雹'],99:['⛈️','强雷暴']
};

async function fetchWeatherByCity(){
  const input=document.getElementById('weatherCity');
  const city=(input&&input.value.trim())?input.value.trim():'北京';
  try{
    const geoRes=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=zh&format=json`);
    const geo=await geoRes.json();
    if(!geo.results||geo.results.length===0){ showToast('未找到该城市，请检查名称'); return; }
    const r=geo.results[0];
    const region=(r.admin1&&r.admin1!==r.name)?('·'+r.admin1):'';
    await fetchWeather(r.latitude,r.longitude,r.name+region);
  }catch(e){ showToast('天气获取失败，请检查网络'); }
}

// IP 定位回退（file:// 下 GPS 不可用时的主力方案）
async function fetchWeatherByIP(){
  showToast('正在通过IP定位…');
  try{
    const res=await fetch('https://ipapi.co/json/');
    if(!res.ok) throw new Error('IP api error');
    const d=await res.json();
    if(d&&d.latitude&&d.longitude){
      const city=d.city||'当前位置';
      const region=(d.region&&d.region!==city)?('·'+d.region):'';
      await fetchWeather(d.latitude,d.longitude,city+region);
    }else{
      showToast('IP定位未返回坐标，请手动输入城市');
    }
  }catch(e){
    // ipapi.co 失败时尝试备用源 ipwho.is
    try{
      const res2=await fetch('https://ipwho.is/');
    if(!res2.ok) throw new Error('backup ip api error');
    const d2=await res2.json();
    if(d2&&d2.latitude&&d2.longitude){
      const city=d2.city||'当前位置';
      const region=(d2.region&&d2.region!==city)?('·'+d2.region):'';
      await fetchWeather(d2.latitude,d2.longitude,city+region);
    }else{
      showToast('定位失败，请手动输入城市名');
    }
  }catch(e2){ showToast('定位失败，请手动输入城市名'); }
  }
}

// GPS定位 → IP定位回退
function fetchWeatherGeo(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(async pos=>{
      await fetchWeather(pos.coords.latitude,pos.coords.longitude,'当前位置');
    },async ()=>{
      // GPS定位失败（file://协议或拒绝授权），回退IP定位
      await fetchWeatherByIP();
    },{timeout:8000,enableHighAccuracy:false});
  }else{
    // 浏览器不支持GPS，直接IP定位
    fetchWeatherByIP();
  }
}

async function fetchWeather(lat,lon,city){
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=auto`;
    const res=await fetch(url);
    const data=await res.json();
    const cur=data.current;
    const code=cur.weather_code;
    const map=WMO_CODES[code]||['🌡️','未知'];
    const tIdx=(data.daily&&data.daily.time)?data.daily.time.indexOf(today()):-1;
    const hi=(data.daily&&data.daily.temperature_2m_max&&tIdx>=0)?Math.round(data.daily.temperature_2m_max[tIdx]):'--';
    const lo=(data.daily&&data.daily.temperature_2m_min&&tIdx>=0)?Math.round(data.daily.temperature_2m_min[tIdx]):'--';
    DATA.weather={date:today(),city,temp:Math.round(cur.temperature_2m),code,text:map[1],icon:map[0],high:hi,low:lo,fetchedAt:now()};
    saveData(DATA);
    renderHome();
  }catch(e){ showToast('天气获取失败，请检查网络'); }
}

function refreshWeather(){
  const w=DATA.weather;
  if(w&&w.city){ fetchWeatherByCity(); } else { fetchWeatherGeo(); }
}

/* 聚合各分区的完成度与计数，供概览/侧边栏复用 */
function getPartitionStats(){
  const stats=[];
  // 计划：周/月/年
  const planAll=[...(DATA.plans.week||[]),...(DATA.plans.month||[]),...(DATA.plans.year||[])];
  const planDone=planAll.filter(x=>x.done).length;
  stats.push({id:'plan',name:'计划',icon:'📅',progress:planAll.length?Math.round(planDone/planAll.length*100):0,count:planAll.length,label:planAll.length?planDone+'/'+planAll.length:'未设'});
  // 学习：四张每日学习卡「具体计划」勾选完成度（按条目聚合）
  const lp=learnModuleState();
  stats.push({id:'learning',name:'学习',icon:'📚',progress:lp.percent,count:lp.total,label:lp.total?lp.done+'/'+lp.total:'未设'});
  // 工作：待办 + 学习计划（公基/行测/高校）逐条完成度；招聘信息不计入进度
  const wt=(DATA.todos||[]).filter(t=>t.title&&t.title.indexOf('[工作]')===0);
  const wtDone=wt.filter(t=>t.status==='done').length;
  ensureWorkStudyState();
  const wsPlans=[
    {key:'gongji',plan:dailyRotate(GONGJI_POOL,1,0)[0]},
    {key:'xingce',plan:dailyRotate(XINGCE_POOL,1,1)[0]},
    {key:'gaoxiao',plan:dailyRotate(GAOXIAO_POOL,1,2)[0]}
  ];
  let wsTotal=0, wsDone=0;
  wsPlans.forEach(p=>{
    (p.plan.tasks||[]).forEach((t,i)=>{
      wsTotal++;
      if(DATA.workStudy.done[workStudyTaskKey(p.key,p.plan.theme,i)]===true) wsDone++;
    });
  });
  const workTotal=wt.length+wsTotal;
  const workDone=wtDone+wsDone;
  stats.push({id:'work',name:'工作',icon:'💼',progress:workTotal?Math.round(workDone/workTotal*100):0,count:workTotal,label:workTotal?workDone+'/'+workTotal:'未设'});
  // 生活：本周健康打卡完成度（饮食三餐 + 护肤 + 锻炼 + 早睡）
  ensureHealth();
  const h=DATA.health;
  const totalCells=3*7 + 4*7 + 7 + 7; // 饮食3餐×7天 + 护肤4项×7天 + 锻炼7天 + 早睡7天
  const doneCells=['breakfast','lunch','dinner'].reduce((s,k)=>s+(h.diet[k]||[]).filter(Boolean).length,0)
    +['eye','clean','massage','hydrate'].reduce((s,k)=>s+(h.skin[k]||[]).filter(Boolean).length,0)
    +(h.exercise||[]).filter(Boolean).length
    +(h.earlySleep||[]).filter(Boolean).length;
  stats.push({id:'life',name:'生活',icon:'🌿',progress:Math.round(doneCells/totalCells*100),count:totalCells,label:doneCells+'/'+totalCells});
  // 读书：书架
  const bk=(DATA.books||[]);
  const bkDone=bk.filter(x=>x.status==='done').length;
  stats.push({id:'reading',name:'读书',icon:'📕',progress:bk.length?Math.round(bkDone/bk.length*100):0,count:bk.length,label:bk.length?bkDone+'/'+bk.length:'空'});
  // 情绪：今日是否记录
  const emHas=(DATA.emotions||[]).some(e=>e.date===today());
  stats.push({id:'emotion',name:'情绪',icon:'🌊',progress:emHas?100:0,count:emHas?1:0,label:emHas?'已记录':'未记录'});
  // 热点：条数
  const hs=(DATA.hotspotsEsg||[]).length+(DATA.hotspotsFinance||[]).length+(DATA.hotspotsAi||[]).length;
  stats.push({id:'hotspots',name:'热点',icon:'🔥',progress:null,count:hs,label:hs+'条'});
  // 复盘：今日是否复盘
  const rvHas=(DATA.reviews||[]).some(r=>r.date===today());
  stats.push({id:'review',name:'复盘',icon:'🔄',progress:rvHas?100:0,count:rvHas?1:0,label:rvHas?'已复盘':'未复盘'});
  return stats;
}

// 分区标题旁的打卡完成进度条（关联该分区对应计划；progress=null 的分区如热点不显示）

/* ============================================
   Generic Category View (for custom categories)
   ============================================ */
function renderGenericView(catId){
  const cat=DATA.sidebarCategories.find(c=>c.id===catId);
  if(!cat) return;
  document.getElementById('contentArea').innerHTML=`
    <div class="section-title">${cat.icon||'📌'} ${cat.name}</div>

      <p style="color:var(--text-secondary);font-size:14px">

      </p>
    </div>
    <div class="content-card">
      <h3>📋 待办</h3>
      <div class="task-list" id="genericTodoList"></div>
      <div class="add-task-row">
        <input type="text" id="newGenericTodo" placeholder="添加待办...">
        <button onclick="addGenericTodo('${catId}')">添加</button>
      </div>
    </div>

}
function addGenericTodo(catId){
  const input=document.getElementById('newGenericTodo');
  if(!input) return;
  const title=input.value.trim();
  if(!title) return;
  const cat=DATA.sidebarCategories.find(c=>c.id===catId);
  const prefix=cat?'['+cat.name+'] ':'';
  DATA.todos.unshift({id:'td_'+Date.now(),title:prefix+title,status:'todo',createdAt:now()});
  saveData(DATA);
  updateStats();
  renderGenericTodos(catId);
  input.value='';
}
function renderGenericTodos(catId){
  const list=document.getElementById('genericTodoList');
  if(!list) return;
  const cat=DATA.sidebarCategories.find(c=>c.id===catId);
  const prefix=cat?'['+cat.name+'] ':'';
  const todos=DATA.todos.filter(t=>t.title.startsWith(prefix));
  if(todos.length===0){
    list.innerHTML='<div class="empty-state"><div class="empty-icon">📭</div><p>暂无待办</p></div>';
    return;
  }
  list.innerHTML=todos.map(t=>`
    <div class="task-item${t.status==='done'?' done':''}">
      <div class="task-header">
        <div class="task-checkbox${t.status==='done'?' checked':''}" onclick="toggleTodo('${t.id}');renderGenericTodos('${catId}')">✓</div>
        <span class="task-title">${esc(t.title.replace(prefix,''))}</span>
        <div class="task-actions">
          <button class="task-btn danger" onclick="deleteTodo('${t.id}');renderGenericTodos('${catId}')">删除</button>
        </div>
      </div>
    </div>
  `).join('');
}

/* ============================================
   Main Render Router
   ============================================ */
function renderView(){
  const view=DATA.activeView;
  if(!view||view==='home') renderHome();
  else if(view==='learning') renderLearning();
  else if(view==='work') renderWork();
  else if(view==='life') renderLife();
  else if(view==='emotion') renderEmotion();
  else if(view==='reading') renderReading();
  else if(view==='plan') renderPlan();
  else if(view==='hotspots') renderHotspots();
  else if(view==='review') renderReview();
  else renderGenericView(view);
}

/* ============================================
   Utility
   ============================================ */
function esc(str){ const d=document.createElement('div');d.textContent=str;return d.innerHTML;}
function fmtDateOnly(d){
  if(!d) return today();
  try{ return new Date(d).toISOString().split('T')[0];}catch(e){return d;}
}
function fmtDate(d){
  if(!d) return '';
  try{ return new Date(d).toLocaleString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return d;}
}

/* ============================================
   Init
   ============================================ */
function init(){
  initSidebar();
  updateStats();
  if(!DATA.activeView||DATA.activeView==='') DATA.activeView='home';
  renderView();

  // Set initial sidebar state based on screen size
  const sb=document.getElementById('sidebar');
  const tb=document.getElementById('sidebarToggleBtn');
  const ov=document.getElementById('sidebarOverlay');
  const mc=document.getElementById('mainContent');
  if(window.innerWidth<=768){
    // Mobile: sidebar starts closed
    if(!sb.classList.contains('closed')){
      sb.classList.add('closed');
      tb.classList.remove('shifted');
      mc.classList.add('sidebar-closed');
    }
  }else{
    // Desktop: sidebar starts open
    sb.classList.remove('closed');
    tb.classList.add('shifted');
    mc.classList.remove('sidebar-closed');
  }

  // Bind toggle events (click + touchend for reliable mobile taps)
  tb.addEventListener('click',function(e){e.preventDefault();toggleSidebar();});
  tb.addEventListener('touchend',function(e){e.preventDefault();toggleSidebar();});
  ov.addEventListener('click',function(e){e.preventDefault();toggleSidebar();});

  // Handle window resize
  window.addEventListener('resize',function(){
    if(window.innerWidth>768){
      sb.classList.remove('closed');
      ov.classList.remove('show');
      tb.classList.add('shifted');
      mc.classList.remove('sidebar-closed');
    }
  });
}

document.addEventListener('DOMContentLoaded',init);

// Handle Escape key to close mobile sidebar
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    closeSidebarMobile();
  }
});

// Service Worker Registration placeholder for PWA (future)
if('serviceWorker' in navigator){

}
